id: tigit04-classificacio
title: Comparació de classificacions de l'habitatge no principal
source_prompt: >-
  Recorregut QGIS de TIGIT, practiques/tigit-04-qgis-mapes/captures/recorregut-complet.prompt.md.
  Comparar quantils i intervals iguals mantenint les dades, cinc classes,
  la rampa BuGn, l'extensió i la mida. Mostrar el camp i els límits del
  classificador real i no deduir el mètode del nom de la capa.
runtime:
  image: sha256:351071c12539ef0c21b268c62e3efe7c6b4cfc5f111b7c45963fa382361144fc
  locale: ca_ES
  display_backend: offscreen
plugins: [processing]
project:
  source: sandbox/practiques/tigit-projecte-territorial/0.1.0/ca/run05-rebut-20261110/payload/projects/tigit-08-cartografia-tematica.qgz
  native_profile: qgis-practice-v2
  font_files:
    DejaVu Sans: sandbox/practiques/tigit-projecte-territorial/0.1.0/ca/run05-rebut-20261110/payload/data/fonts/DejaVuSans.ttf
setup:
  # El grup de cada captura governa la comparació, però els seus fills han
  # d'estar activats: fer visible el grup no activa una capa desmarcada.
  - action: set_layer_visible
    layer: Municipis · unió
    visible: true
  - action: set_layer_visible
    layer: Coropleta · intervals iguals
    visible: true
  - action: zoom_to_layer
    layer: Municipis · unió
    scale: 1.15
  - action: clear_message_bar
captures:
  - id: quantils
    mode: widget
    target:
      object_name: LayerStyling
    presentation:
      active_layer: Municipis · unió
      checks:
        project_crs: EPSG:25831
        required_layers: [Municipis · unió]
    steps:
      - action: show_layer_styling_panel
        layer: Municipis · unió
        wait_ms: 800
    drawings: []
  - id: intervals-iguals
    mode: widget
    target:
      object_name: LayerStyling
    presentation:
      active_layer: Coropleta · intervals iguals
      checks:
        project_crs: EPSG:25831
        required_layers: [Coropleta · intervals iguals]
    steps:
      - action: show_layer_styling_panel
        layer: Coropleta · intervals iguals
        wait_ms: 800
    drawings: []
  - id: mapa-quantils
    mode: widget
    target:
      object_name: theMapCanvas
    presentation:
      groups:
        - path: [Comparació, Quantils]
          layers: [Municipis · unió]
          visible: true
        - path: [Comparació, Intervals iguals]
          layers: [Coropleta · intervals iguals]
          visible: false
      active_layer: Municipis · unió
      checks:
        project_crs: EPSG:25831
        visible_layers: [Municipis · unió, Comarca · contorn, Vila-seca · detall]
    steps:
      - action: show_layer_styling_panel
        layer: Municipis · unió
      - action: zoom_to_layer
        layer: Municipis · unió
        scale: 1.15
      - action: wait
        ms: 800
    drawings: []
  - id: mapa-intervals-iguals
    mode: widget
    target:
      object_name: theMapCanvas
    presentation:
      groups:
        - path: [Comparació, Quantils]
          layers: [Municipis · unió]
          visible: false
        - path: [Comparació, Intervals iguals]
          layers: [Coropleta · intervals iguals]
          visible: true
      active_layer: Coropleta · intervals iguals
      checks:
        project_crs: EPSG:25831
        visible_layers: [Coropleta · intervals iguals, Comarca · contorn, Vila-seca · detall]
    steps:
      - action: show_layer_styling_panel
        layer: Coropleta · intervals iguals
      - action: zoom_to_layer
        layer: Municipis · unió
        scale: 1.15
      - action: wait
        ms: 800
    drawings: []
