<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">De la ret&#237;cula a la composici&#243; d'una infografia vertical</title>
  <desc id="desc">Tres panells mostren la mateixa p&#224;gina A3 vertical: primer, una ret&#237;cula de sis columnes amb marges; despr&#233;s, un esquelet amb blocs de t&#237;tol, m&#232;triques, mapa, gr&#224;fic, interpretaci&#243;, limitaci&#243; i fonts; finalment, una composici&#243; amb una ruta de lectura numerada. Una nota recorda que la ret&#237;cula &#233;s una bastida i no obliga a omplir totes les cel&#183;les.</desc>

  <rect width="1200" height="760" fill="#f5f2ea"/>

  <g font-family="Arial, 'Liberation Sans', sans-serif">
    <text x="32" y="39" font-size="27" font-weight="700" fill="#18262d">De la ret&#237;cula a la composici&#243;</text>
    <text x="32" y="65" font-size="15" fill="#4d626b">La mateixa infografia A3 vertical, de l'alineaci&#243; abstracta a una lectura intencional.</text>

    <rect x="24" y="88" width="368" height="600" rx="8" fill="#fbfaf6" stroke="#ccd5d7" stroke-width="1.5"/>
    <rect x="416" y="88" width="368" height="600" rx="8" fill="#fbfaf6" stroke="#ccd5d7" stroke-width="1.5"/>
    <rect x="808" y="88" width="368" height="600" rx="8" fill="#fbfaf6" stroke="#ccd5d7" stroke-width="1.5"/>

    <path d="M398 119h10" fill="none" stroke="#81949b" stroke-width="2"/>
    <path d="M408 119l-6-4v8z" fill="#81949b"/>
    <path d="M790 119h10" fill="none" stroke="#81949b" stroke-width="2"/>
    <path d="M800 119l-6-4v8z" fill="#81949b"/>

    <circle cx="49" cy="118" r="15" fill="#14677a"/>
    <text x="49" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">a</text>
    <text x="73" y="116" font-size="17" font-weight="700" fill="#18262d">RET&#205;CULA</text>
    <text x="73" y="137" font-size="13" fill="#4d626b">Sis columnes, espais i marges</text>

    <circle cx="441" cy="118" r="15" fill="#14677a"/>
    <text x="441" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">b</text>
    <text x="465" y="116" font-size="17" font-weight="700" fill="#18262d">ESQUEMA DE CAIXES</text>
    <text x="465" y="137" font-size="13" fill="#4d626b">Blocs assignats a la ret&#237;cula</text>

    <circle cx="833" cy="118" r="15" fill="#b64a36"/>
    <text x="833" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">c</text>
    <text x="857" y="116" font-size="17" font-weight="700" fill="#18262d">COMPOSICI&#211;</text>
    <text x="857" y="137" font-size="13" fill="#4d626b">Jerarquia i recorregut de lectura</text>

    <!-- Panell a: reticula de sis columnes -->
    <g transform="translate(68 160)">
      <rect x="3" y="4" width="280" height="396" fill="#d9dedc" opacity="0.55"/>
      <rect width="280" height="396" fill="#ffffff" stroke="#9caaae" stroke-width="1.3"/>

      <rect x="18" y="16" width="37" height="364" fill="#dcebed"/>
      <rect x="59" y="16" width="37" height="364" fill="#dcebed"/>
      <rect x="100" y="16" width="37" height="364" fill="#dcebed"/>
      <rect x="141" y="16" width="37" height="364" fill="#dcebed"/>
      <rect x="182" y="16" width="37" height="364" fill="#dcebed"/>
      <rect x="223" y="16" width="39" height="364" fill="#dcebed"/>

      <rect x="18" y="16" width="244" height="364" fill="none" stroke="#14677a" stroke-width="1.2" stroke-dasharray="4 3"/>
      <g stroke="#b7c6c9" stroke-width="0.8" stroke-dasharray="2 3">
        <line x1="18" y1="68" x2="262" y2="68"/>
        <line x1="18" y1="120" x2="262" y2="120"/>
        <line x1="18" y1="172" x2="262" y2="172"/>
        <line x1="18" y1="224" x2="262" y2="224"/>
        <line x1="18" y1="276" x2="262" y2="276"/>
        <line x1="18" y1="328" x2="262" y2="328"/>
      </g>

      <text x="140" y="36" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.2" fill="#355963">6 COLUMNES</text>
      <text x="57" y="54" text-anchor="middle" font-size="9" fill="#4d626b">espai</text>
      <path d="M57 58v25" fill="none" stroke="#4d626b" stroke-width="1"/>
      <path d="M54 80l3 5 3-5z" fill="#4d626b"/>

      <path d="M5 16h9M9 16v364M5 380h9" fill="none" stroke="#b64a36" stroke-width="1.2"/>
      <text x="8" y="203" text-anchor="middle" font-size="9" font-weight="700" fill="#8f3b2d" transform="rotate(-90 8 203)">MARGE</text>
      <path d="M266 16h9M271 16v364M266 380h9" fill="none" stroke="#b64a36" stroke-width="1.2"/>
      <text x="272" y="203" text-anchor="middle" font-size="9" font-weight="700" fill="#8f3b2d" transform="rotate(90 272 203)">MARGE</text>

      <line x1="18" y1="387" x2="262" y2="387" stroke="#14677a" stroke-width="1"/>
      <path d="M18 383v8M262 383v8" stroke="#14677a" stroke-width="1"/>
      <text x="140" y="393" text-anchor="middle" font-size="9" fill="#355963">amplada &#250;til</text>
    </g>

    <!-- Panell b: esquema de caixes sobre la mateixa reticula -->
    <g transform="translate(460 160)">
      <rect x="3" y="4" width="280" height="396" fill="#d9dedc" opacity="0.55"/>
      <rect width="280" height="396" fill="#ffffff" stroke="#9caaae" stroke-width="1.3"/>

      <g opacity="0.52">
        <rect x="18" y="16" width="37" height="364" fill="#dcebed"/>
        <rect x="59" y="16" width="37" height="364" fill="#dcebed"/>
        <rect x="100" y="16" width="37" height="364" fill="#dcebed"/>
        <rect x="141" y="16" width="37" height="364" fill="#dcebed"/>
        <rect x="182" y="16" width="37" height="364" fill="#dcebed"/>
        <rect x="223" y="16" width="39" height="364" fill="#dcebed"/>
      </g>

      <g fill="#fbfcfa" stroke="#61777e" stroke-width="1.2" stroke-dasharray="5 3">
        <rect x="18" y="16" width="244" height="52"/>
        <rect x="18" y="78" width="72" height="42"/>
        <rect x="104" y="78" width="72" height="42"/>
        <rect x="190" y="78" width="72" height="42"/>
        <rect x="18" y="132" width="154" height="112"/>
        <rect x="178" y="132" width="84" height="112"/>
        <rect x="18" y="254" width="154" height="68"/>
        <rect x="178" y="254" width="84" height="68"/>
        <rect x="18" y="334" width="244" height="34"/>
      </g>

      <g font-size="9" font-weight="700" letter-spacing="0.6" fill="#355963">
        <text x="27" y="31">T&#205;TOL / PREGUNTA</text>
        <text x="27" y="92">M&#200;TRICA</text>
        <text x="113" y="92">M&#200;TRICA</text>
        <text x="199" y="92">M&#200;TRICA</text>
        <text x="27" y="147">MAPA PRINCIPAL</text>
        <text x="187" y="147">GR&#192;FIC</text>
        <text x="27" y="269">INTERPRETACI&#211;</text>
        <text x="187" y="269">LIMITACI&#211;</text>
        <text x="27" y="349">FONTS</text>
      </g>

      <g fill="#aebcc0">
        <rect x="27" y="40" width="178" height="6" rx="3"/>
        <rect x="27" y="51" width="125" height="5" rx="2.5"/>
        <rect x="27" y="100" width="41" height="9" rx="2"/>
        <rect x="113" y="100" width="41" height="9" rx="2"/>
        <rect x="199" y="100" width="41" height="9" rx="2"/>
        <path d="M37 213l27-44 31 15 27-29 31 37v36H37z" opacity="0.55"/>
        <rect x="188" y="218" width="10" height="12"/>
        <rect x="203" y="200" width="10" height="30"/>
        <rect x="218" y="177" width="10" height="53"/>
        <rect x="233" y="191" width="10" height="39"/>
        <rect x="27" y="281" width="125" height="5" rx="2.5"/>
        <rect x="27" y="293" width="109" height="5" rx="2.5"/>
        <rect x="187" y="281" width="56" height="5" rx="2.5"/>
        <rect x="187" y="293" width="44" height="5" rx="2.5"/>
        <rect x="27" y="356" width="134" height="4" rx="2"/>
      </g>
    </g>

    <!-- Panell c: composicio final amb ruta numerada -->
    <g transform="translate(852 160)">
      <rect x="3" y="4" width="280" height="396" fill="#d9dedc" opacity="0.55"/>
      <rect width="280" height="396" fill="#ffffff" stroke="#9caaae" stroke-width="1.3"/>
      <rect width="280" height="7" fill="#14677a"/>

      <text x="18" y="25" font-size="9" font-weight="700" letter-spacing="1" fill="#8f3b2d">1 &#183; PREGUNTA</text>
      <text x="18" y="43" font-size="15" font-weight="700" fill="#18262d">On es concentra la</text>
      <text x="18" y="60" font-size="15" font-weight="700" fill="#18262d">pressi&#243; tur&#237;stica?</text>
      <circle cx="251" cy="31" r="12" fill="#b64a36"/>
      <text x="251" y="35" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>

      <rect x="18" y="78" width="72" height="42" rx="3" fill="#14677a"/>
      <text x="25" y="91" font-size="9" font-weight="700" letter-spacing="0.3" fill="#dcebed">TEND&#200;NCIA</text>
      <text x="25" y="109" font-size="12" font-weight="700" fill="#ffffff">augmenta</text>

      <rect x="104" y="78" width="72" height="42" rx="3" fill="#e5eff0"/>
      <text x="111" y="91" font-size="9" font-weight="700" letter-spacing="0.3" fill="#355963">PATR&#211;</text>
      <text x="111" y="109" font-size="12" font-weight="700" fill="#18262d">litoral</text>

      <rect x="190" y="78" width="72" height="42" rx="3" fill="#f2e5df"/>
      <text x="197" y="91" font-size="9" font-weight="700" letter-spacing="0.3" fill="#78392f">FOCUS</text>
      <text x="197" y="109" font-size="11" font-weight="700" fill="#18262d">concentrat</text>

      <rect x="18" y="132" width="154" height="112" rx="3" fill="#eaf1ef" stroke="#b8c9c5"/>
      <text x="29" y="147" font-size="8.5" font-weight="700" letter-spacing="0.3" fill="#355963">2 &#183; EVID&#200;NCIA PRINCIPAL</text>
      <path d="M40 173l30-14 28 11 27-8 25 22-10 37-31 9-25-11-31 8-19-21z" fill="#cbded8" stroke="#55766f" stroke-width="1.2"/>
      <path d="M40 173l44 46M70 159l14 60M98 170l11 60M125 162l-16 68M53 227l45-57M84 219l41-57M109 230l41-46" fill="none" stroke="#ffffff" stroke-width="1"/>
      <path d="M40 173c14 15 15 35 13 54" fill="none" stroke="#14677a" stroke-width="3.5"/>
      <circle cx="48" cy="187" r="5" fill="#b64a36"/>
      <circle cx="51" cy="204" r="7" fill="#b64a36"/>
      <circle cx="52" cy="220" r="4" fill="#b64a36"/>
      <text x="112" y="237" font-size="8.5" fill="#4d626b">mapa sint&#232;tic</text>
      <circle cx="160" cy="140" r="10" fill="#b64a36"/>
      <text x="160" y="144" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">2</text>

      <rect x="178" y="132" width="84" height="112" rx="3" fill="#f7f5ef" stroke="#d2ccc0"/>
      <text x="187" y="147" font-size="8.5" font-weight="700" letter-spacing="0.3" fill="#78392f">3 &#183; SUPORT</text>
      <text x="187" y="160" font-size="8.5" fill="#4d626b">comparaci&#243;</text>
      <g font-size="9" fill="#4d626b">
        <text x="187" y="181">A</text>
        <text x="187" y="201">B</text>
        <text x="187" y="221">C</text>
      </g>
      <rect x="199" y="173" width="48" height="10" rx="2" fill="#14677a"/>
      <rect x="199" y="193" width="34" height="10" rx="2" fill="#7ba5ad"/>
      <rect x="199" y="213" width="22" height="10" rx="2" fill="#aabdc1"/>
      <circle cx="250" cy="140" r="10" fill="#b64a36"/>
      <text x="250" y="144" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">3</text>

      <rect x="18" y="254" width="154" height="68" rx="3" fill="#e5eff0"/>
      <text x="29" y="270" font-size="8.5" font-weight="700" letter-spacing="0.3" fill="#355963">4 &#183; INTERPRETACI&#211;</text>
      <text x="29" y="286" font-size="9" fill="#18262d">El patr&#243; concentra l'atenci&#243;</text>
      <text x="29" y="299" font-size="9" fill="#18262d">al litoral i orienta la lectura.</text>
      <circle cx="160" cy="262" r="10" fill="#b64a36"/>
      <text x="160" y="266" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">4</text>

      <rect x="178" y="254" width="84" height="68" rx="3" fill="#f2e5df"/>
      <text x="187" y="270" font-size="8.5" font-weight="700" letter-spacing="0.3" fill="#78392f">LIMITACI&#211;</text>
      <text x="187" y="286" font-size="9" fill="#18262d">Esquema,</text>
      <text x="187" y="299" font-size="9" fill="#18262d">no resultat real.</text>

      <rect x="18" y="334" width="244" height="34" rx="3" fill="#f3f1eb" stroke="#d7d1c6"/>
      <text x="29" y="348" font-size="8.5" font-weight="700" letter-spacing="0.3" fill="#355963">5 &#183; FONTS</text>
      <text x="29" y="361" font-size="9" fill="#4d626b">Dades simulades &#183; elaboraci&#243; pr&#242;pia</text>
      <circle cx="250" cy="342" r="10" fill="#b64a36"/>
      <text x="250" y="346" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">5</text>
    </g>

    <g transform="translate(44 580)">
      <rect width="328" height="82" rx="5" fill="#eef3f2" stroke="#c4d2d0"/>
      <text x="15" y="23" font-size="12" font-weight="700" fill="#355963">LA RETÍCULA ESTRUCTURA LA COMPOSICIÓ</text>
      <text x="15" y="44" font-size="12" fill="#34474e">La ret&#237;cula fixa relacions: marges, columnes</text>
      <text x="15" y="61" font-size="12" fill="#34474e">i els espais mantenen una l&#242;gica comuna.</text>
    </g>

    <g transform="translate(436 580)">
      <rect width="328" height="82" rx="5" fill="#eef3f2" stroke="#c4d2d0"/>
      <text x="15" y="23" font-size="12" font-weight="700" fill="#355963">LA JERARQUIA GUIA EL DISSENY</text>
      <text x="15" y="44" font-size="12" fill="#34474e">L'amplada i la posici&#243; de cada bloc anticipen</text>
      <text x="15" y="61" font-size="12" fill="#34474e">la import&#224;ncia i l'ordre de lectura.</text>
    </g>

    <g transform="translate(828 580)">
      <rect width="328" height="82" rx="5" fill="#f4ebe6" stroke="#dcc4b9"/>
      <text x="15" y="21" font-size="12" font-weight="700" fill="#78392f">RUTA DE LECTURA</text>
      <text x="15" y="42" font-size="11.5" fill="#34474e">1 pregunta &#8594; 2 evid&#232;ncia principal &#8594; 3 suport</text>
      <text x="15" y="60" font-size="11.5" fill="#34474e">4 interpretaci&#243; i l&#237;mit &#8594; 5 fonts</text>
    </g>

    <!-- Comparacio: la reticula guia, pero no obliga a omplir -->
    <g transform="translate(258 706)">
      <rect width="684" height="36" rx="18" fill="#ffffff" stroke="#b9c7ca"/>
      <g transform="translate(17 10)" stroke="#14677a" stroke-width="1">
        <rect width="12" height="16" fill="#dcebed"/>
        <rect x="15" width="12" height="16" fill="#dcebed"/>
        <rect x="30" width="12" height="16" fill="#dcebed"/>
        <rect x="45" width="12" height="16" fill="#dcebed"/>
        <rect x="60" width="12" height="16" fill="#dcebed"/>
        <rect x="75" width="12" height="16" fill="#dcebed"/>
      </g>
      <path d="M113 18h18" stroke="#81949b" stroke-width="1.5"/>
      <path d="M131 18l-5-3v6z" fill="#81949b"/>
      <g transform="translate(146 10)" stroke="#14677a" stroke-width="1">
        <rect width="87" height="16" fill="none" stroke="#b7c6c9"/>
        <rect width="42" height="7" fill="#14677a"/>
        <rect x="60" y="9" width="27" height="7" fill="#b64a36"/>
      </g>
      <text x="249" y="23" font-size="12.5" font-weight="700" fill="#34474e">RET&#205;CULA = BASTIDA: NO CAL OMPLIR CADA CEL&#183;LA.</text>
    </g>
  </g>
</svg>
