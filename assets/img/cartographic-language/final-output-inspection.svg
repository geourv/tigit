<svg xmlns="http://www.w3.org/2000/svg" width="1044" height="470" viewBox="0 0 1044 470" role="img" aria-labelledby="title desc">
  <title id="title">Comprovació d'una separació a la mida final i amb zoom de diagnosi</title>
  <desc id="desc">Dues línies semblen contínues en una exportació ràster observada al cent per cent, però una ampliació de la quadrícula de píxels mostra un píxel buit entre els extrems.</desc>
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d5dde2; stroke-width: 1.6; }
      .screen { fill: #f7fbfa; stroke: #8da1aa; stroke-width: 1.5; }
      .label { font: 700 20px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .small { font: 15px Arial, 'Liberation Sans', sans-serif; fill: #52616b; }
      .result { font: 700 16px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .linework { fill: none; stroke: #16697a; stroke-width: 12; stroke-linecap: butt; }
      .context { fill: none; stroke: #c8d4d8; stroke-width: 3; }
      .callout { fill: none; stroke: #d0523c; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .pixel { fill: #16697a; }
      .grid { fill: url(#pixel-grid); stroke: #8da1aa; stroke-width: 1.5; shape-rendering: crispEdges; }
      .gap { fill: #ffffff; stroke: #d0523c; stroke-width: 2.5; shape-rendering: crispEdges; }
      .guide { fill: none; stroke: #d0523c; stroke-width: 2.5; marker-end: url(#arrow); }
      .decision { fill: #ecf3f1; stroke: #b8cbc7; stroke-width: 1.4; }
      .decision-label { font: 700 14px Arial, 'Liberation Sans', sans-serif; fill: #365b6d; }
      .decision-text { font: 14px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
    </style>
    <pattern id="pixel-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f7fbfa"/>
      <path d="M20 0H0V20" fill="none" stroke="#c8d4d8" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d0523c"/>
    </marker>
  </defs>

  <g transform="translate(20 20)">
    <rect class="panel" width="482" height="350" rx="4"/>
    <text x="26" y="42" class="label">Mida final · 100%</text>
    <text x="26" y="67" class="small">Exportació ràster observada com la rebrà el lector</text>
    <g transform="translate(26 91)">
      <rect class="screen" width="430" height="188"/>
      <path class="context" d="M10 48 C88 82 116 24 198 63 S330 110 420 61"/>
      <path class="context" d="M42 176 C105 131 177 145 241 115 S355 78 419 101"/>
      <path class="linework" d="M48 102 H214.8"/>
      <path class="linework" d="M215.2 102 H382"/>
      <circle class="callout" cx="215" cy="102" r="28"/>
    </g>
    <text x="241" y="317" text-anchor="middle" class="result">Lectura: sembla una línia contínua</text>
  </g>

  <g transform="translate(542 20)">
    <rect class="panel" width="482" height="350" rx="4"/>
    <text x="26" y="42" class="label">Zoom de diagnosi · 1.600%</text>
    <text x="26" y="67" class="small">La mateixa zona ampliada fins a distingir els píxels</text>
    <g transform="translate(51 91)">
      <rect class="grid" width="380" height="180"/>
      <rect class="pixel" x="0" y="60" width="180" height="60"/>
      <rect class="pixel" x="200" y="60" width="180" height="60"/>
      <rect class="gap" x="180" y="60" width="20" height="60"/>
      <path class="guide" d="M190 43 V17"/>
      <text x="190" y="10" text-anchor="middle" class="small">1 píxel buit</text>
    </g>
    <text x="241" y="317" text-anchor="middle" class="result">Diagnòstic: els extrems no coincideixen</text>
  </g>

  <g transform="translate(20 392)">
    <rect class="decision" width="492" height="58" rx="4"/>
    <text x="18" y="24" class="decision-label">SI ÉS UNA XARXA</text>
    <text x="18" y="44" class="decision-text">Fer coincidir els extrems i validar-ne la topologia.</text>
  </g>
  <g transform="translate(532 392)">
    <rect class="decision" width="492" height="58" rx="4"/>
    <text x="18" y="24" class="decision-label">SI ÉS UNA COMPOSICIÓ</text>
    <text x="18" y="44" class="decision-text">Jutjar la llegibilitat a la mida real de publicació.</text>
  </g>
</svg>
