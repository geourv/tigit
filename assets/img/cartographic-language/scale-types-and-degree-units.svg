<svg xmlns="http://www.w3.org/2000/svg" width="1014" height="624" viewBox="53 110 1014 624" role="img" aria-labelledby="title desc">
  <title id="title">Tipus d'escala cartogràfica i unitats angulars</title>
  <desc id="desc">Figura didàctica que compara l'escala numèrica, verbal i gràfica, mostra equivalències mètriques i distingeix el grau de latitud, mesurat sobre meridians i gairebé constant en distància nord-sud, del grau de longitud, mesurat sobre paral·lels cada vegada més curts cap als pols.</desc>
  <defs>
    <style>
      .panel{fill:#fff;stroke:#d8d2c5;stroke-width:1.6}.txt{font-family:Arial,Helvetica,sans-serif;fill:#2b2b2b}.h{font-size:19px;font-weight:700}.small{font-size:14px}.label{font-size:13px;fill:#555}.tiny{font-size:12px;fill:#666}.map{fill:#e7efe2;stroke:#75a36d;stroke-width:2}.water{fill:#dcecf7}.line{stroke:#2b2b2b;stroke-width:4;stroke-linecap:round}.thin{stroke:#777;stroke-width:1.4}.dash{stroke:#777;stroke-width:1.4;stroke-dasharray:5 5}.accent{fill:#d65f43}.blue{fill:#e8f1fb;stroke:#4c78a8;stroke-width:2}.chip{fill:#f7f0df;stroke:#d0b56f;stroke-width:1.3}.formula{font-size:17px;font-weight:700;fill:#365b6d}.warning{fill:#fff5f0;stroke:#d65f43;stroke-width:1.5}.degree{stroke:#4c78a8;stroke-width:7;stroke-linecap:round}.degree2{stroke:#75a36d;stroke-width:7;stroke-linecap:round}.arrow{stroke:#777;stroke-width:2;marker-end:url(#arrow)}.tick{stroke:#2b2b2b;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#777"/></marker>
  </defs>

  <g transform="translate(55,112)">
    <rect width="480" height="245" class="panel"/>
    <text x="24" y="36" class="txt h">1. Tres formes equivalents</text>

    <rect x="32" y="64" width="168" height="124" class="water"/>
    <path d="M32,147 C62,129 93,135 122,111 C145,92 168,97 200,82 L200,188 L32,188 Z" class="map"/>
    <path d="M72,116 L142,97 L178,72" fill="none" class="thin"/>
    <circle cx="87" cy="112" r="5" class="accent"/>
    <circle cx="147" cy="95" r="5" class="accent"/>
    <text x="48" y="211" class="txt tiny">Marc de mapa a mida final</text>

    <rect x="218" y="64" width="232" height="42" class="chip"/>
    <text x="246" y="91" class="txt formula">Numèrica: 1:50 000</text>

    <rect x="218" y="118" width="232" height="42" class="chip"/>
    <text x="246" y="145" class="txt formula">Verbal: 1 cm = 500 m</text>

    <g transform="translate(218,182)">
      <text x="0" y="-12" class="txt label">Escala gràfica</text>
      <rect x="0" y="0" width="70" height="14" fill="#2b2b2b"/>
      <rect x="70" y="0" width="70" height="14" fill="#fff" stroke="#2b2b2b"/>
      <rect x="140" y="0" width="70" height="14" fill="#2b2b2b"/>
      <line x1="0" y1="-4" x2="0" y2="22" class="tick"/>
      <line x1="70" y1="-4" x2="70" y2="22" class="tick"/>
      <line x1="140" y1="-4" x2="140" y2="22" class="tick"/>
      <line x1="210" y1="-4" x2="210" y2="22" class="tick"/>
      <text x="-2" y="39" class="txt tiny">0</text>
      <text x="59" y="39" class="txt tiny">500 m</text>
      <text x="132" y="39" class="txt tiny">1 km</text>
      <text x="202" y="39" class="txt tiny">1,5 km</text>
    </g>
  </g>

  <g transform="translate(585,112)">
    <rect width="480" height="245" class="panel"/>
    <text x="24" y="36" class="txt h">2. Equivalències mètriques</text>

    <rect x="34" y="68" width="158" height="90" class="blue"/>
    <path d="M68,113 L158,113" class="line"/>
    <text x="60" y="143" class="txt small">1 cm al mapa</text>
    <line x1="212" y1="113" x2="278" y2="113" class="arrow"/>
    <rect x="296" y="68" width="145" height="90" class="map"/>
    <path d="M326,113 L414,113" class="line"/>
    <text x="320" y="143" class="txt small">500 m reals</text>

    <rect x="34" y="177" width="190" height="38" class="chip"/>
    <text x="52" y="202" class="txt small">1 km = 100 000 cm</text>
    <rect x="250" y="177" width="190" height="38" class="chip"/>
    <text x="282" y="202" class="txt small">1 m = 100 cm</text>
  </g>

  <g transform="translate(55,392)">
    <rect width="1010" height="340" class="panel"/>
    <text x="24" y="38" class="txt h">3. Una escala en graus no és una regla mètrica uniforme</text>
    <text x="24" y="65" class="txt small">Els paral·lels no es tallen; els meridians convergeixen als pols. Això canvia la lectura dels graus.</text>

    <g transform="translate(48,94)">
      <text x="0" y="18" class="txt formula">Latitud</text>
      <text x="0" y="40" class="txt label">arc nord-sud sobre un meridià</text>
      <line x1="34" y1="176" x2="34" y2="73" class="arrow"/>
      <text x="27" y="63" class="txt small">N</text>
      <line x1="78" y1="78" x2="210" y2="78" class="dash"/>
      <line x1="78" y1="138" x2="210" y2="138" class="dash"/>
      <text x="219" y="83" class="txt label">42° N</text>
      <text x="219" y="143" class="txt label">41° N</text>
      <line x1="112" y1="138" x2="112" y2="78" class="degree2"/>
      <text x="0" y="209" class="txt small">1° de latitud ≈ 111 km</text>

      <text x="340" y="18" class="txt formula">Longitud</text>
      <text x="340" y="40" class="txt label">arc est-oest sobre un paral·lel</text>
      <text x="296" y="87" class="txt label">60° N</text>
      <text x="296" y="137" class="txt label">41° N</text>
      <text x="313" y="187" class="txt label">0°</text>
      <line x1="340" y1="82" x2="454" y2="82" class="degree"/>
      <line x1="340" y1="132" x2="512" y2="132" class="degree"/>
      <line x1="340" y1="182" x2="568" y2="182" class="degree"/>
      <text x="468" y="87" class="txt small">≈ 56 km</text>
      <text x="526" y="137" class="txt small">≈ 84 km</text>
      <text x="582" y="187" class="txt small">≈ 111 km</text>
    </g>

    <g transform="translate(720,84)">
      <rect x="0" y="0" width="270" height="146" class="warning"/>
      <text x="22" y="32" class="txt formula">CRS geogràfic</text>
      <text x="22" y="57" class="txt small">Coordenades en graus:</text>
      <text x="22" y="80" class="txt small">latitud i longitud.</text>
      <text x="22" y="103" class="txt small">Un grau és una obertura angular,</text>
      <text x="22" y="126" class="txt small">no un metre.</text>

      <rect x="0" y="168" width="270" height="80" class="blue"/>
      <text x="22" y="198" class="txt small">Per mesurar a Catalunya:</text>
      <text x="22" y="221" class="txt small">ETRS89 / UTM 31N,</text>
      <text x="22" y="241" class="txt small">en metres.</text>
    </g>
  </g>
</svg>
