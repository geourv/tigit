<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Operacions principals de generalitzacio cartografica</title>
  <desc id="desc">La figura compara una font detallada amb seleccio, simplificacio, agregacio, desplacament i exageracio sobre petits esquemes cartografics.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.panel{fill:#fff;stroke:#d8d2c5;stroke-width:1.5}.txt{font-family:Arial,Helvetica,sans-serif;fill:#2b2b2b}.title{font-size:19px;font-weight:700}.small{font-size:14px}.label{font-size:12px;fill:#555}.water{fill:none;stroke:#5796c7;stroke-width:3;stroke-linecap:round}.road{fill:none;stroke:#707070;stroke-width:3;stroke-linecap:round}.minor{fill:none;stroke:#c8c8c8;stroke-width:1.5;stroke-linecap:round}.area{fill:#dce9d3;stroke:#75a36d;stroke-width:1.5}.built{fill:#d7b18f;stroke:#9b765b;stroke-width:1}.symbol{fill:#d65f43;stroke:#7f2f22;stroke-width:1}.note{font-size:12px;fill:#666}.arrow{stroke:#999;stroke-width:2;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#999"/></marker>
  </defs>
  <rect width="1000" height="620" class="bg"/>
  <text x="40" y="40" class="txt title">Generalitzar es decidir que conserva el mapa a una mida concreta</text>
  <text x="40" y="64" class="txt small">La font pot contenir mes detall del que el lector pot llegir; cada operacio ha de respondre a la funcio del mapa.</text>

  <g transform="translate(40,105)">
    <rect width="280" height="200" rx="14" class="panel"/>
    <text x="18" y="30" class="txt small" font-weight="700">Font detallada</text>
    <path d="M35,166 C74,120 96,143 128,86 C153,42 199,58 246,38" class="water"/>
    <path d="M42,52 C95,70 131,118 246,156" class="road"/>
    <path d="M61,142 C89,120 122,128 151,111 C184,91 205,103 234,84" class="minor"/>
    <path d="M48,96 C84,80 99,100 121,82 C147,61 169,80 185,64" class="minor"/>
    <polygon points="172,120 224,113 241,151 196,174 160,155" class="area"/>
    <rect x="75" y="92" width="16" height="11" class="built"/><rect x="96" y="100" width="18" height="12" class="built"/><rect x="118" y="91" width="14" height="11" class="built"/><rect x="132" y="112" width="17" height="13" class="built"/><rect x="154" y="101" width="14" height="12" class="built"/>
    <circle cx="221" cy="71" r="4" class="symbol"/><circle cx="235" cy="69" r="3" class="symbol"/><circle cx="215" cy="83" r="3" class="symbol"/>
  </g>

  <line x1="335" y1="205" x2="382" y2="205" class="arrow"/>

  <g transform="translate(395,95)">
    <rect width="250" height="150" rx="14" class="panel"/>
    <text x="16" y="28" class="txt small" font-weight="700">Seleccio</text>
    <path d="M30,118 C65,85 88,98 117,58 C141,28 179,41 221,28" class="water"/>
    <path d="M32,45 C80,58 116,90 220,116" class="road"/>
    <polygon points="160,86 205,82 220,110 182,128 148,113" class="area"/>
    <text x="16" y="136" class="txt label">Es retiren elements secundaris.</text>
  </g>

  <g transform="translate(700,95)">
    <rect width="250" height="150" rx="14" class="panel"/>
    <text x="16" y="28" class="txt small" font-weight="700">Simplificacio</text>
    <path d="M30,116 C78,86 106,79 129,54 C155,29 184,42 221,28" class="water"/>
    <path d="M32,45 C94,64 136,90 220,116" class="road"/>
    <polygon points="160,88 205,82 220,110 183,128 150,114" class="area"/>
    <text x="16" y="136" class="txt label">Es redueix detall sense canviar sentit.</text>
  </g>

  <g transform="translate(90,370)">
    <rect width="250" height="150" rx="14" class="panel"/>
    <text x="16" y="28" class="txt small" font-weight="700">Agregacio</text>
    <path d="M30,116 C78,86 106,79 129,54 C155,29 184,42 221,28" class="water"/>
    <path d="M32,45 C94,64 136,90 220,116" class="road"/>
    <rect x="80" y="78" width="74" height="42" rx="8" class="built"/>
    <text x="16" y="136" class="txt label">Diverses peces formen una categoria.</text>
  </g>

  <g transform="translate(395,370)">
    <rect width="250" height="150" rx="14" class="panel"/>
    <text x="16" y="28" class="txt small" font-weight="700">Desplacament</text>
    <path d="M30,116 C78,86 106,79 129,54 C155,29 184,42 221,28" class="water"/>
    <path d="M32,45 C94,64 136,90 220,116" class="road"/>
    <circle cx="134" cy="92" r="8" class="symbol"/>
    <circle cx="160" cy="85" r="8" fill="#f7b267" stroke="#7f2f22" stroke-width="1"/>
    <line x1="142" y1="90" x2="152" y2="86" stroke="#7f2f22" stroke-width="1.5"/>
    <text x="16" y="136" class="txt label">Se separen simbols que se solapen.</text>
  </g>

  <g transform="translate(700,370)">
    <rect width="250" height="150" rx="14" class="panel"/>
    <text x="16" y="28" class="txt small" font-weight="700">Exageracio</text>
    <path d="M30,116 C78,86 106,79 129,54 C155,29 184,42 221,28" class="water"/>
    <path d="M32,45 C94,64 136,90 220,116" class="road"/>
    <circle cx="177" cy="78" r="17" class="symbol"/>
    <text x="16" y="136" class="txt label">Un element petit es fa visible si es essencial.</text>
  </g>

  <text x="40" y="580" class="txt note">Esquemes docents no derivats d'una capa real. Figura d'elaboracio propia, 14 d'agost de 2026.</text>
</svg>
