<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Una mateixa geografia representada amb tres orientacions cartogràfiques</title>
  <desc id="desc">Tres mapes esquemàtics del mateix indret costaner comparen el nord a dalt, un gir que alinea un corredor oblic i una orientació de visita des del punt Sou aquí. Tots mantenen una indicació explícita del nord.</desc>
  <defs>
    <style>
      .page-title { font: 700 25px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .intro { font: 16px Arial, 'Liberation Sans', sans-serif; fill: #52616b; }
      .panel { fill: #ffffff; stroke: #d5dde2; stroke-width: 1.6; }
      .panel-title { font: 700 20px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .panel-kicker { font: 700 13px Arial, 'Liberation Sans', sans-serif; fill: #365b6d; letter-spacing: .6px; }
      .map-frame { fill: #e8f2f4; stroke: #52616b; stroke-width: 1.6; }
      .map-label { font: 700 15px Arial, 'Liberation Sans', sans-serif; fill: #25313a; paint-order: stroke fill; stroke: #ffffff; stroke-width: 3.5; stroke-linejoin: round; }
      .sea-label { font: italic 15px Arial, 'Liberation Sans', sans-serif; fill: #365b6d; letter-spacing: 1px; }
      .land { fill: #f4f0e3; }
      .sea { fill: #cfe5eb; }
      .coast { fill: none; stroke: #527783; stroke-width: 2.2; }
      .park { fill: #c8ddbf; stroke: #6d8f65; stroke-width: 1.5; }
      .river { fill: none; stroke: #2f7fa9; stroke-width: 4; stroke-linecap: round; }
      .minor-road { fill: none; stroke: #a7a096; stroke-width: 2.2; stroke-linecap: round; }
      .route-halo { fill: none; stroke: #ffffff; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
      .route { fill: none; stroke: #b4552d; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .place { fill: #17202a; stroke: #ffffff; stroke-width: 2; }
      .north { fill: none; stroke: #17202a; stroke-width: 3; stroke-linecap: round; marker-end: url(#north-tip); }
      .north-label { font: 700 18px Arial, 'Liberation Sans', sans-serif; fill: #17202a; paint-order: stroke fill; stroke: #ffffff; stroke-width: 4; }
      .travel { fill: none; stroke: #b4552d; stroke-width: 3; stroke-dasharray: 7 5; marker-end: url(#travel-tip); }
      .travel-label { font: 700 13px Arial, 'Liberation Sans', sans-serif; fill: #7b351f; paint-order: stroke fill; stroke: #ffffff; stroke-width: 4; }
      .you { fill: #ffffff; stroke: #7b351f; stroke-width: 4; }
      .you-core { fill: #b4552d; }
      .you-label { font: 700 16px Arial, 'Liberation Sans', sans-serif; fill: #7b351f; paint-order: stroke fill; stroke: #ffffff; stroke-width: 5; }
      .body { font: 15px Arial, 'Liberation Sans', sans-serif; fill: #394852; }
      .verdict { fill: #edf3f1; stroke: #b8cbc7; stroke-width: 1.3; }
      .verdict-text { font: 700 13px Arial, 'Liberation Sans', sans-serif; fill: #315e65; letter-spacing: .35px; }
    </style>
    <marker id="north-tip" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0V6L9 3Z" fill="#17202a"/>
    </marker>
    <marker id="travel-tip" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0V6L9 3Z" fill="#b4552d"/>
    </marker>
    <clipPath id="map-clip">
      <rect width="346" height="380" rx="3"/>
    </clipPath>
    <g id="coastal-place">
      <rect width="300" height="320" class="land"/>
      <path class="sea" d="M217 -12C231 37 219 78 237 112C256 150 224 185 240 219C255 251 245 283 257 332H312V-12Z"/>
      <path class="coast" d="M217 -12C231 37 219 78 237 112C256 150 224 185 240 219C255 251 245 283 257 332"/>
      <path class="park" d="M20 30L91 18L119 58L93 101L30 93L11 61Z"/>
      <path class="river" d="M128 -8C137 45 120 90 146 127C171 163 199 174 239 219"/>
      <path class="minor-road" d="M4 205C63 211 108 196 145 160C184 124 214 111 293 111"/>
      <path class="minor-road" d="M97 320C110 270 105 220 145 160C166 128 177 77 175 6"/>
      <path class="route-halo" d="M45 280C80 252 102 205 145 160C180 123 219 112 260 70"/>
      <path class="route" d="M45 280C80 252 102 205 145 160C180 123 219 112 260 70"/>
      <circle class="place" cx="45" cy="280" r="6"/>
      <circle class="place" cx="145" cy="160" r="7"/>
      <circle class="place" cx="260" cy="70" r="6"/>
      <circle class="place" cx="233" cy="241" r="6"/>
      <text class="map-label" x="53" y="299">Estació</text>
      <text class="map-label" x="119" y="151">Vila Mar</text>
      <text class="map-label" x="211" y="62">Mirador</text>
      <text class="map-label" x="189" y="262">Port</text>
      <text class="sea-label" x="251" y="184" transform="rotate(83 251 184)">MAR</text>
    </g>
  </defs>

  <rect width="1200" height="690" fill="#ffffff"/>
  <text x="24" y="35" class="page-title">Una mateixa geografia, tres orientacions</text>
  <text x="24" y="61" class="intro">L’orientació pot canviar segons la tasca; la referència espacial, no.</text>

  <g transform="translate(20 82)">
    <rect width="378" height="580" rx="6" class="panel"/>
    <text x="18" y="31" class="panel-kicker">CONVENCIÓ GENERAL</text>
    <text x="18" y="56" class="panel-title">1 · Nord a dalt</text>
    <g transform="translate(16 70)">
      <rect width="346" height="380" rx="3" class="map-frame"/>
      <g clip-path="url(#map-clip)">
        <g transform="translate(23 30)"><use href="#coastal-place"/></g>
      </g>
      <path class="north" d="M315 73V31"/>
      <text x="315" y="22" text-anchor="middle" class="north-label">N</text>
    </g>
    <text x="18" y="482" class="body">Nord a dalt per convenció.</text>
    <text x="18" y="505" class="body">Facilita comparar mapes i coordenades.</text>
    <rect x="18" y="526" width="207" height="31" rx="4" class="verdict"/>
    <text x="30" y="547" class="verdict-text">ORIENTACIÓ ESTÀNDARD</text>
  </g>

  <g transform="translate(411 82)">
    <rect width="378" height="580" rx="6" class="panel"/>
    <text x="18" y="31" class="panel-kicker">TASCA DE RECORREGUT</text>
    <text x="18" y="56" class="panel-title">2 · Mapa girat pel corredor</text>
    <g transform="translate(16 70)">
      <rect width="346" height="380" rx="3" class="map-frame"/>
      <g clip-path="url(#map-clip)">
        <g transform="translate(173 190) rotate(40) scale(.82) translate(-150 -160)"><use href="#coastal-place"/></g>
      </g>
      <path class="north" d="M281 78L309 44"/>
      <text x="319" y="40" class="north-label">N</text>
    </g>
    <text x="18" y="482" class="body">Girar pot afavorir una ruta o una tasca.</text>
    <text x="18" y="505" class="body">El nord no pot quedar implícit.</text>
    <rect x="18" y="526" width="258" height="31" rx="4" class="verdict"/>
    <text x="30" y="547" class="verdict-text">GIR ÚTIL + NORD EXPLÍCIT</text>
  </g>

  <g transform="translate(802 82)">
    <rect width="378" height="580" rx="6" class="panel"/>
    <text x="18" y="31" class="panel-kicker">LECTURA DES DEL LLOC</text>
    <text x="18" y="56" class="panel-title">3 · Orientació per al visitant</text>
    <g transform="translate(16 70)">
      <rect width="346" height="380" rx="3" class="map-frame"/>
      <g clip-path="url(#map-clip)">
        <g transform="translate(173 190) rotate(-49) scale(.82) translate(-150 -160)"><use href="#coastal-place"/></g>
      </g>
      <path class="north" d="M82 78L49 50"/>
      <text x="35" y="45" class="north-label">N</text>
      <path class="travel" d="M191 303C189 245 184 177 179 112"/>
      <text x="181" y="101" text-anchor="middle" class="travel-label">CAP AL MIRADOR</text>
      <circle cx="191" cy="319" r="13" class="you"/>
      <circle cx="191" cy="319" r="5" class="you-core"/>
      <text x="191" y="349" text-anchor="middle" class="you-label">Sou aquí</text>
    </g>
    <text x="18" y="482" class="body">La ruta apunta en el sentit de la marxa.</text>
    <text x="18" y="505" class="body">«Sou aquí» fixa el punt i la mirada.</text>
    <rect x="18" y="526" width="265" height="31" rx="4" class="verdict"/>
    <text x="30" y="547" class="verdict-text">NORD + SENTIT EXPLÍCITS</text>
  </g>
</svg>
