<svg xmlns="http://www.w3.org/2000/svg" width="823" height="303" viewBox="87 84 823 303" role="img" aria-labelledby="title desc">
  <title id="title">Taula rectangular per a l'analisi</title>
  <desc id="desc">Esquema d'una taula analitica rectangular amb una sola fila de capcalera, una fila per municipi, variables en columnes i metadades separades.</desc>
  <defs>
    <style>
      .head{fill:#dfeaf7}.good{fill:#eaf7ea;stroke:#4c956c;stroke-width:3}.side{fill:#fff8e6;stroke:#d49a00;stroke-width:2}.text{font-family:Arial, sans-serif;fill:#1f2933;font-size:18px}.small{font-size:15px}.tiny{font-size:13px}.label{font-weight:700}.grid{stroke:#c8d0dc;stroke-width:1}
    </style>
  </defs>
  <rect class="good" x="92" y="118" width="540" height="224"/>
  <rect class="head" x="92" y="118" width="540" height="42"/>
  <g>
    <line class="grid" x1="92" y1="160" x2="632" y2="160"/><line class="grid" x1="92" y1="202" x2="632" y2="202"/><line class="grid" x1="92" y1="244" x2="632" y2="244"/><line class="grid" x1="92" y1="286" x2="632" y2="286"/><line class="grid" x1="92" y1="328" x2="632" y2="328"/>
    <line class="grid" x1="212" y1="118" x2="212" y2="342"/><line class="grid" x1="352" y1="118" x2="352" y2="342"/><line class="grid" x1="472" y1="118" x2="472" y2="342"/>
  </g>
  <text class="text small label" x="106" y="145">codi_municipi</text>
  <text class="text small label" x="228" y="145">municipi</text>
  <text class="text small label" x="366" y="145">poblacio_2021</text>
  <text class="text small label" x="488" y="145">habitatges_total</text>
  <text class="text small" x="112" y="187">430379</text><text class="text small" x="228" y="187">Salou</text><text class="text small" x="392" y="187">30000</text><text class="text small" x="522" y="187">23000</text>
  <text class="text small" x="112" y="229">431711</text><text class="text small" x="228" y="229">Vila-seca</text><text class="text small" x="392" y="229">23000</text><text class="text small" x="522" y="229">12000</text>
  <text class="text small" x="112" y="271">431482</text><text class="text small" x="228" y="271">Tarragona</text><text class="text small" x="392" y="271">140000</text><text class="text small" x="522" y="271">72000</text>
  <text class="text small" x="112" y="313">430955</text><text class="text small" x="228" y="313">Altafulla</text><text class="text small" x="392" y="313">5000</text><text class="text small" x="522" y="313">4000</text>
