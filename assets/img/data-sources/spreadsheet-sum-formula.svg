<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Formula que suma dues cel.les</title>
  <desc id="desc">Esquema docent d'una formula de full de calcul que suma els valors de les cel.les B2 i C2 i desa el resultat a D2.</desc>
  <defs>
    <style>
      .bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#c8d0dc;stroke-width:2}.header{fill:#e9eef5}.source{fill:#e8f4fd;stroke:#1f78b4;stroke-width:3}.result{fill:#eaf7ea;stroke:#4c956c;stroke-width:3}.formula{fill:#fff8e6;stroke:#d49a00;stroke-width:2}.text{font-family:Arial, sans-serif;fill:#1f2933;font-size:20px}.small{font-size:16px}.tiny{font-size:13px}.label{font-weight:700}.grid{stroke:#c8d0dc;stroke-width:1}.arrow{stroke:#d49a00;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d49a00"/></marker>
  </defs>
  <rect class="bg" width="960" height="540"/>
  <rect class="panel" x="80" y="88" width="560" height="260" rx="12"/>
  <rect class="header" x="80" y="88" width="560" height="50" rx="12"/>
  <rect fill="#ffffff" stroke="#b7c1cf" x="170" y="102" width="360" height="24" rx="4"/>
  <text class="text small label" x="100" y="121">fx</text>
  <text class="text small" x="184" y="121">=B2+C2</text>
  <g>
    <rect class="header" x="130" y="160" width="120" height="40"/><rect class="header" x="250" y="160" width="120" height="40"/><rect class="header" x="370" y="160" width="120" height="40"/><rect class="header" x="490" y="160" width="120" height="40"/>
    <rect class="header" x="80" y="160" width="50" height="40"/>
    <text class="text label" x="180" y="187">A</text><text class="text label" x="300" y="187">B</text><text class="text label" x="420" y="187">C</text><text class="text label" x="540" y="187">D</text>
    <text class="text label" x="100" y="230">1</text><text class="text label" x="100" y="274">2</text>
    <line class="grid" x1="80" y1="200" x2="610" y2="200"/><line class="grid" x1="80" y1="244" x2="610" y2="244"/><line class="grid" x1="80" y1="288" x2="610" y2="288"/>
    <line class="grid" x1="130" y1="160" x2="130" y2="288"/><line class="grid" x1="250" y1="160" x2="250" y2="288"/><line class="grid" x1="370" y1="160" x2="370" y2="288"/><line class="grid" x1="490" y1="160" x2="490" y2="288"/><line class="grid" x1="610" y1="160" x2="610" y2="288"/>
  </g>
  <text class="text small label" x="145" y="230">municipi</text>
  <text class="text small label" x="264" y="230">places</text>
  <text class="text small label" x="384" y="230">habitatges</text>
  <text class="text small label" x="506" y="230">total</text>
  <text class="text small" x="145" y="274">Salou</text>
  <rect class="source" x="250" y="244" width="120" height="44"/><rect class="source" x="370" y="244" width="120" height="44"/><rect class="result" x="490" y="244" width="120" height="44"/>
  <text class="text" x="290" y="273">120</text><text class="text" x="410" y="273">80</text><text class="text label" x="528" y="273">200</text>
  <rect class="formula" x="680" y="98" width="220" height="98" rx="12"/>
  <text class="text small label" x="702" y="126">Formula visible</text>
  <text class="text" x="702" y="158">=B2+C2</text>
  <text class="text tiny" x="702" y="180">comenca amb el signe =</text>
  <path class="arrow" d="M705 196 C650 245 604 270 610 266"/>
  <rect class="formula" x="674" y="250" width="236" height="124" rx="12"/>
  <text class="text small label" x="696" y="278">Lectura</text>
  <text class="text small" x="696" y="304">D2 calcula B2 + C2.</text>
  <text class="text small" x="696" y="328">Si B2 canvia, D2</text>
  <text class="text small" x="696" y="352">es recalcula.</text>
  <path class="arrow" d="M310 290 C350 390 505 410 550 292"/>
  <path class="arrow" d="M430 290 C450 360 520 362 550 292"/>
  <text class="text tiny" x="80" y="420">El valor mostrat a D2 es pot veure com a resultat, pero la regla important es la formula que el produeix.</text>
</svg>
