<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Cercador de funcions en un full de calcul</title>
  <desc id="desc">Esquema docent d'un assistent de funcions amb caixa de cerca, categories, resultats i comprovacio abans d'acceptar una formula.</desc>
  <defs>
    <style>
      .bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#c8d0dc;stroke-width:2}.bar{fill:#e9eef5}.field{fill:#fff;stroke:#9fb0c3;stroke-width:2}.tab{fill:#f1f5f9;stroke:#c8d0dc}.tab-active{fill:#d9ecff;stroke:#1f78b4;stroke-width:2}.item{fill:#fff;stroke:#d5dde8}.item-active{fill:#eef8ee;stroke:#4c956c;stroke-width:3}.warn{fill:#fff8e6;stroke:#d49a00;stroke-width:2}.text{font-family:Arial, sans-serif;fill:#1f2933;font-size:18px}.small{font-size:15px}.tiny{font-size:13px}.label{font-weight:700}.muted{fill:#52616f}.line{stroke:#d49a00;stroke-width:2;fill:none}.ok{fill:#eaf7ee;stroke:#4c956c;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="960" height="540"/>

  <rect class="panel" x="54" y="58" width="612" height="404" rx="14"/>
  <rect class="bar" x="54" y="58" width="612" height="54" rx="14"/>
  <text class="text label" x="78" y="92">Assistent de funcions</text>
  <rect class="field" x="78" y="132" width="548" height="44" rx="8"/>
  <text class="text small muted" x="94" y="160">cerca: tornar comarca a partir del codi municipal</text>

  <rect class="tab-active" x="78" y="198" width="120" height="34" rx="8"/>
  <text class="text small label" x="100" y="221">Cerca</text>
  <rect class="tab" x="210" y="198" width="120" height="34" rx="8"/>
  <text class="text small" x="230" y="221">Text</text>
  <rect class="tab" x="342" y="198" width="120" height="34" rx="8"/>
  <text class="text small" x="362" y="221">Logica</text>
  <rect class="tab" x="474" y="198" width="152" height="34" rx="8"/>
  <text class="text small" x="494" y="221">Referencia</text>

  <rect class="item-active" x="78" y="254" width="548" height="64" rx="8"/>
  <text class="text label" x="96" y="282">XLOOKUP / BUSCARX</text>
  <text class="text small muted" x="96" y="305">Busca una clau en un rang i retorna el valor corresponent.</text>

  <rect class="item" x="78" y="330" width="548" height="48" rx="8"/>
  <text class="text small label" x="96" y="360">VLOOKUP / BUSCARV</text>
  <text class="text small muted" x="290" y="360">cerca vertical tradicional</text>

  <rect class="item" x="78" y="390" width="548" height="48" rx="8"/>
  <text class="text small label" x="96" y="420">LEFT / ESQUERRA</text>
  <text class="text small muted" x="290" y="420">extreu caracters inicials</text>

  <rect class="warn" x="706" y="76" width="200" height="82" rx="12"/>
  <text class="text small label" x="724" y="106">1. Definir</text>
  <text class="text tiny" x="724" y="130">Que s'ha de fer?</text>
  <path class="line" d="M706 134 C660 150 636 154 626 154"/>

  <rect class="warn" x="716" y="206" width="200" height="92" rx="12"/>
  <text class="text small label" x="734" y="236">2. Explorar</text>
  <text class="text tiny" x="734" y="260">Cercador, categories</text>
  <text class="text tiny" x="734" y="278">i documentacio</text>
  <path class="line" d="M716 262 C670 275 650 284 626 286"/>

  <rect class="ok" x="706" y="350" width="210" height="86" rx="12"/>
  <text class="text small label" x="724" y="380">3. Validar</text>
  <text class="text tiny" x="724" y="404">Rangs, resultat manual</text>
  <text class="text tiny" x="724" y="422">i copia cap avall</text>
  <path class="line" d="M706 390 C658 370 640 332 626 302"/>

  <text class="text tiny" x="64" y="498">Esquema propi. El menu real, els noms i els separadors poden canviar segons l'aplicacio i la configuracio regional.</text>
</svg>
