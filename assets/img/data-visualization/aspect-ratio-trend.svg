<svg xmlns="http://www.w3.org/2000/svg" width="884" height="334" viewBox="38 102 884 334" role="img" aria-labelledby="title desc">
  <title id="title">Mateixa serie temporal amb tres relacions d'aspecte</title>
  <desc id="desc">Tres panells mostren la mateixa serie de valors turistics amb el mateix rang numeric, pero amb marcs de dibuix alt, equilibrat i pla que canvien la sensacio visual de pendent.</desc>
  <defs>
    <style>
      .panel{fill:#fff;stroke:#d8d2c5;stroke-width:1.5}.grid{stroke:#e8e2d7;stroke-width:1}.axis{stroke:#5b5b5b;stroke-width:1.7}.txt{font-family:Arial,Helvetica,sans-serif;fill:#2b2b2b}.small{font-size:13px;fill:#555}.label{font-size:12px;fill:#626262}.line{fill:none;stroke:#2f6fb0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#2f6fb0}
    </style>
  </defs>
  <g transform="translate(40,104)">
    <rect class="panel" x="0" y="0" width="270" height="330"/>
    <text x="18" y="28" class="txt small" font-weight="700">Marc alt</text>
    <g transform="translate(44,68)">
      <line class="grid" x1="0" y1="0" x2="195" y2="0"/>
      <line class="grid" x1="0" y1="100" x2="195" y2="100"/>
      <line class="grid" x1="0" y1="200" x2="195" y2="200"/>
      <line class="axis" x1="0" y1="200" x2="195" y2="200"/>
      <line class="axis" x1="0" y1="0" x2="0" y2="200"/>
      <text x="-27" y="204" class="txt label">0</text>
      <text x="-34" y="104" class="txt label">10</text>
      <text x="-34" y="4" class="txt label">20</text>
      <polyline class="line" points="8,118 53,103 98,92 143,76 188,62"/>
      <circle class="dot" cx="8" cy="118" r="4"/><circle class="dot" cx="53" cy="103" r="4"/><circle class="dot" cx="98" cy="92" r="4"/><circle class="dot" cx="143" cy="76" r="4"/><circle class="dot" cx="188" cy="62" r="4"/>
      <text x="-3" y="224" class="txt label">2021</text><text x="177" y="224" class="txt label">2025</text>
    </g>
  </g>

  <g transform="translate(345,104)">
    <rect class="panel" x="0" y="0" width="270" height="330"/>
    <text x="18" y="28" class="txt small" font-weight="700">Marc equilibrat</text>
    <g transform="translate(44,118)">
      <line class="grid" x1="0" y1="0" x2="195" y2="0"/>
      <line class="grid" x1="0" y1="75" x2="195" y2="75"/>
      <line class="grid" x1="0" y1="150" x2="195" y2="150"/>
      <line class="axis" x1="0" y1="150" x2="195" y2="150"/>
      <line class="axis" x1="0" y1="0" x2="0" y2="150"/>
      <text x="-27" y="154" class="txt label">0</text>
      <text x="-34" y="79" class="txt label">10</text>
      <text x="-34" y="4" class="txt label">20</text>
      <polyline class="line" points="8,88.5 53,77.25 98,69 143,57 188,46.5"/>
      <circle class="dot" cx="8" cy="88.5" r="4"/><circle class="dot" cx="53" cy="77.25" r="4"/><circle class="dot" cx="98" cy="69" r="4"/><circle class="dot" cx="143" cy="57" r="4"/><circle class="dot" cx="188" cy="46.5" r="4"/>
      <text x="-3" y="174" class="txt label">2021</text><text x="177" y="174" class="txt label">2025</text>
    </g>
  </g>

  <g transform="translate(650,104)">
    <rect class="panel" x="0" y="0" width="270" height="330"/>
    <text x="18" y="28" class="txt small" font-weight="700">Marc pla</text>
    <g transform="translate(44,168)">
      <line class="grid" x1="0" y1="0" x2="195" y2="0"/>
      <line class="grid" x1="0" y1="45" x2="195" y2="45"/>
      <line class="grid" x1="0" y1="90" x2="195" y2="90"/>
      <line class="axis" x1="0" y1="90" x2="195" y2="90"/>
      <line class="axis" x1="0" y1="0" x2="0" y2="90"/>
      <text x="-27" y="94" class="txt label">0</text>
      <text x="-34" y="49" class="txt label">10</text>
      <text x="-34" y="4" class="txt label">20</text>
      <polyline class="line" points="8,53.1 53,46.35 98,41.4 143,34.2 188,27.9"/>
      <circle class="dot" cx="8" cy="53.1" r="4"/><circle class="dot" cx="53" cy="46.35" r="4"/><circle class="dot" cx="98" cy="41.4" r="4"/><circle class="dot" cx="143" cy="34.2" r="4"/><circle class="dot" cx="188" cy="27.9" r="4"/>
      <text x="-3" y="114" class="txt label">2021</text><text x="177" y="114" class="txt label">2025</text>
    </g>
  </g>
</svg>
