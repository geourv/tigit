<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Gràfica amb doble eix que fa coincidir dues sèries diferents</title>
  <desc id="desc">Un gràfic de línies mostra ocupació i preu mitjà amb dos eixos verticals ajustats per fer que els pendents semblin equivalents.</desc>
  <defs>
    <style>
      .bg{fill:#fffdf8}.panel{fill:#fff;stroke:#d8d2c5;stroke-width:1.5}.grid{stroke:#e8e2d7;stroke-width:1}.axis{stroke:#555;stroke-width:1.8}.txt{font-family:Arial,Helvetica,sans-serif;fill:#2b2b2b}.title{font-size:26px;font-weight:700}.small{font-size:15px}.label{font-size:13px;fill:#555}.warn{fill:#8f1f18}.badge{fill:#8f1f18}.white{fill:#fff}.blueLine{fill:none;stroke:#2f6fb0;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.orangeLine{fill:none;stroke:#d77828;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.blueTxt{fill:#2f6fb0}.orangeTxt{fill:#b65f1f}.note{font-size:14px;fill:#5b5b5b}
    </style>
  </defs>
  <rect class="bg" width="760" height="500"/>
  <rect x="34" y="28" width="118" height="34" rx="17" class="badge"/>
  <text x="93" y="51" text-anchor="middle" class="txt white" font-size="16" font-weight="700">PROBLEMA</text>
  <text x="190" y="51" class="txt title">Un doble eix pot fabricar una relació visual</text>
  <text x="65" y="88" class="txt small">Els dos eixos s'han ajustat perquè les línies tinguin quasi el mateix pendent.</text>

  <g transform="translate(78 115)">
    <rect class="panel" x="0" y="0" width="604" height="300" rx="10"/>
    <line class="grid" x1="65" y1="48" x2="540" y2="48"/>
    <line class="grid" x1="65" y1="106" x2="540" y2="106"/>
    <line class="grid" x1="65" y1="164" x2="540" y2="164"/>
    <line class="grid" x1="65" y1="222" x2="540" y2="222"/>
    <line class="axis" x1="65" y1="251" x2="540" y2="251"/>
    <line class="axis" x1="65" y1="38" x2="65" y2="251"/>
    <line class="axis" x1="540" y1="38" x2="540" y2="251"/>
    <text x="26" y="256" class="txt label">60</text>
    <text x="26" y="202" class="txt label">62,5</text>
    <text x="26" y="148" class="txt label">65</text>
    <text x="26" y="94" class="txt label">67,5</text>
    <text x="29" y="43" class="txt label">70</text>
    <text x="558" y="256" class="txt label">90</text>
    <text x="558" y="202" class="txt label">105</text>
    <text x="558" y="148" class="txt label">120</text>
    <text x="558" y="94" class="txt label">135</text>
    <text x="558" y="43" class="txt label">150</text>

    <polyline class="blueLine" points="88,230 196,206 304,177 412,128 520,78"/>
    <polyline class="orangeLine" points="88,228 196,204 304,178 412,132 520,82"/>
    <circle cx="88" cy="230" r="5" fill="#2f6fb0"/><circle cx="196" cy="206" r="5" fill="#2f6fb0"/><circle cx="304" cy="177" r="5" fill="#2f6fb0"/><circle cx="412" cy="128" r="5" fill="#2f6fb0"/><circle cx="520" cy="78" r="5" fill="#2f6fb0"/>
    <circle cx="88" cy="228" r="5" fill="#d77828"/><circle cx="196" cy="204" r="5" fill="#d77828"/><circle cx="304" cy="178" r="5" fill="#d77828"/><circle cx="412" cy="132" r="5" fill="#d77828"/><circle cx="520" cy="82" r="5" fill="#d77828"/>

    <text x="85" y="279" class="txt label">2021</text><text x="193" y="279" class="txt label">2022</text><text x="301" y="279" class="txt label">2023</text><text x="409" y="279" class="txt label">2024</text><text x="517" y="279" class="txt label">2025</text>
    <text x="85" y="28" class="txt blueTxt" font-size="15" font-weight="700">ocupació (%)</text>
    <text x="421" y="28" class="txt orangeTxt" font-size="15" font-weight="700">preu mitjà (euros)</text>
  </g>

  <g transform="translate(82 436)">
    <rect x="0" y="-18" width="16" height="16" fill="#2f6fb0"/>
    <text x="24" y="-5" class="txt note">Ocupació: 61% - 68%</text>
    <rect x="245" y="-18" width="16" height="16" fill="#d77828"/>
    <text x="269" y="-5" class="txt note">Preu: 92 EUR - 145 EUR</text>
  </g>
  <text x="78" y="472" class="txt warn" font-size="16" font-weight="700">Risc: la semblança de pendents surt de l'escala, no de les dades.</text>
</svg>
