<svg xmlns="http://www.w3.org/2000/svg" width="1102" height="732" viewBox="0 0 1102 732" role="img" aria-labelledby="title desc">
  <title id="title">Matriu de variables visuals</title>
  <desc id="desc">Esquema docent que mostra com posició, mida, forma, orientació, valor, textura i to poden aplicar-se a marques puntuals, lineals i superficials.</desc>
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d5dde2; stroke-width: 1.5; }
      .head { fill: #eef4f5; stroke: #d5dde2; stroke-width: 1.5; }
      .label { font: 700 17px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .small { font: 14px Arial, 'Liberation Sans', sans-serif; fill: #52616b; }
      .tiny { font: 12px Arial, 'Liberation Sans', sans-serif; fill: #52616b; }
      .axis { stroke: #9fb0b8; stroke-width: 1.3; }
      .guide { stroke: #d5dde2; stroke-width: 1; stroke-dasharray: 4 5; }
      .ink { fill: #16697a; stroke: #123f4b; stroke-width: 1.4; }
      .ink2 { fill: #d0523c; stroke: #8c3225; stroke-width: 1.4; }
      .ink3 { fill: #f2b544; stroke: #9b6f20; stroke-width: 1.4; }
      .line { fill: none; stroke: #16697a; stroke-linecap: round; stroke-linejoin: round; }
      .outline { fill: none; stroke: #365b6d; stroke-width: 2; }
      .area { fill: #8fbdd0; stroke: #365b6d; stroke-width: 1.4; }
      .area2 { fill: #d0523c; stroke: #8c3225; stroke-width: 1.4; }
      .area3 { fill: #f2b544; stroke: #9b6f20; stroke-width: 1.4; }
    </style>
    <pattern id="dotsSparse" patternUnits="userSpaceOnUse" width="14" height="14">
      <circle cx="4" cy="4" r="1.4" fill="#365b6d"/>
    </pattern>
    <pattern id="dotsDense" patternUnits="userSpaceOnUse" width="8" height="8">
      <circle cx="3" cy="3" r="1.3" fill="#365b6d"/>
    </pattern>
    <pattern id="hatchA" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#365b6d" stroke-width="1.6"/>
    </pattern>
    <pattern id="hatchB" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#365b6d" stroke-width="1.6"/>
    </pattern>
    <pattern id="waves" patternUnits="userSpaceOnUse" width="28" height="12">
      <path d="M0,7 C7,1 14,13 21,7 C24,4 26,4 28,7" fill="none" stroke="#365b6d" stroke-width="1.4"/>
    </pattern>
  </defs>

  <g transform="translate(1 1)">
    <rect x="0" y="0" width="1100" height="730" class="panel"/>
    <rect x="0" y="0" width="1100" height="66" class="head"/>
    <line x1="180" y1="0" x2="180" y2="730" stroke="#d5dde2" stroke-width="1.5"/>
    <line x1="410" y1="0" x2="410" y2="730" stroke="#d5dde2" stroke-width="1.5"/>
    <line x1="640" y1="0" x2="640" y2="730" stroke="#d5dde2" stroke-width="1.5"/>
    <line x1="870" y1="0" x2="870" y2="730" stroke="#d5dde2" stroke-width="1.5"/>
    <g stroke="#d5dde2" stroke-width="1.5">
      <line x1="0" y1="66" x2="1100" y2="66"/>
      <line x1="0" y1="161" x2="1100" y2="161"/>
      <line x1="0" y1="256" x2="1100" y2="256"/>
      <line x1="0" y1="351" x2="1100" y2="351"/>
      <line x1="0" y1="446" x2="1100" y2="446"/>
      <line x1="0" y1="541" x2="1100" y2="541"/>
      <line x1="0" y1="636" x2="1100" y2="636"/>
    </g>

    <g text-anchor="middle" dominant-baseline="middle" class="label">
      <text x="90" y="33">Variable visual</text>
      <text x="295" y="33">Marca puntual</text>
      <text x="525" y="33">Marca lineal</text>
      <text x="755" y="33">Marca superficial</text>
      <text x="985" y="33">Lectura principal</text>
    </g>

    <text x="90" y="113.5" text-anchor="middle" dominant-baseline="middle" class="label">Posició</text>
    <g transform="translate(5 -6)">
      <line x1="220" y1="134" x2="360" y2="134" class="axis"/>
      <line x1="220" y1="85" x2="220" y2="143" class="axis"/>
      <line x1="220" y1="113" x2="360" y2="113" class="guide"/>
      <circle cx="246" cy="126" r="7" class="ink"/>
      <circle cx="291" cy="104" r="7" class="ink"/>
      <circle cx="337" cy="91" r="7" class="ink"/>
    </g>
    <g transform="translate(0 -6)">
      <path d="M460,128 C495,92 538,133 590,95" class="line" stroke-width="4"/>
      <path d="M460,145 C495,109 538,150 590,112" fill="none" stroke="#8fbdd0" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(3 -6)">
      <rect x="690" y="91" width="44" height="44" class="area"/>
      <rect x="770" y="104" width="44" height="44" fill="#cfe3ea" stroke="#365b6d" stroke-width="1.4"/>
    </g>
    <g text-anchor="middle">
      <text x="985" y="108" class="small">Localitzar</text>
      <text x="985" y="129" class="tiny">i comparar posicions</text>
    </g>

    <text x="90" y="208.5" text-anchor="middle" dominant-baseline="middle" class="label">Mida</text>
    <g transform="translate(6 -7.5)">
      <circle cx="237" cy="216" r="5" class="ink"/>
      <circle cx="280" cy="216" r="10" class="ink"/>
      <circle cx="328" cy="216" r="18" class="ink"/>
    </g>
    <g transform="translate(0 -9)">
      <line x1="462" y1="197" x2="588" y2="197" class="line" stroke-width="2.5"/>
      <line x1="462" y1="217" x2="588" y2="217" class="line" stroke-width="6"/>
      <line x1="462" y1="239" x2="588" y2="239" class="line" stroke-width="11"/>
    </g>
    <g transform="translate(-15.5 0)">
      <rect x="690" y="195" width="28" height="28" class="area"/>
      <rect x="735" y="189" width="40" height="40" class="area"/>
      <rect x="795" y="181" width="56" height="56" class="area"/>
    </g>
    <g text-anchor="middle">
      <text x="985" y="203" class="small">Estimar magnitud</text>
      <text x="985" y="224" class="tiny">millor amb escala visible</text>
    </g>

    <text x="90" y="303.5" text-anchor="middle" dominant-baseline="middle" class="label">Forma</text>
    <g transform="translate(10 -7.5)">
      <circle cx="236" cy="311" r="14" class="ink"/>
      <polygon points="280,293 298,327 262,327" class="ink2"/>
      <polygon points="328,293 348,313 328,333 308,313" class="ink3"/>
    </g>
    <g transform="translate(0 -20)">
      <line x1="462" y1="296" x2="588" y2="296" class="line" stroke-width="4"/>
      <line x1="462" y1="316" x2="588" y2="316" fill="none" stroke="#16697a" stroke-width="4" stroke-dasharray="12 9" stroke-linecap="round"/>
      <path d="M462,338 C478,325 494,351 510,338 C526,325 542,351 558,338 C574,325 582,334 588,338" class="line" stroke-width="4"/>
    </g>
    <g transform="translate(-19 -6.5)">
      <rect x="687" y="288" width="44" height="44" fill="url(#dotsSparse)" stroke="#365b6d" stroke-width="1.4"/>
      <rect x="752" y="288" width="44" height="44" fill="url(#waves)" stroke="#365b6d" stroke-width="1.4"/>
      <rect x="817" y="288" width="44" height="44" fill="url(#hatchA)" stroke="#365b6d" stroke-width="1.4"/>
    </g>
    <g text-anchor="middle">
      <text x="985" y="298" class="small">Distingir categories</text>
      <text x="985" y="319" class="tiny">sense suggerir ordre</text>
    </g>

    <text x="90" y="398.5" text-anchor="middle" dominant-baseline="middle" class="label">Orientació</text>
    <g transform="translate(-0.75 -4.5)">
      <line x1="237" y1="423" x2="237" y2="383" stroke="#16697a" stroke-width="5" stroke-linecap="round"/>
      <line x1="280" y1="421" x2="306" y2="391" stroke="#16697a" stroke-width="5" stroke-linecap="round"/>
      <line x1="329" y1="420" x2="357" y2="420" stroke="#16697a" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(0 -10)">
      <line x1="462" y1="418" x2="588" y2="388" class="line" stroke-width="4"/>
      <line x1="462" y1="399" x2="588" y2="429" fill="none" stroke="#d0523c" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(-6.5 -8.5)">
      <rect x="690" y="383" width="58" height="48" fill="url(#hatchA)" stroke="#365b6d" stroke-width="1.4"/>
      <rect x="775" y="383" width="58" height="48" fill="url(#hatchB)" stroke="#365b6d" stroke-width="1.4"/>
    </g>
    <g text-anchor="middle">
      <text x="985" y="393" class="small">Diferenciar direcció</text>
      <text x="985" y="414" class="tiny">o patró orientat</text>
    </g>

    <text x="90" y="493.5" text-anchor="middle" dominant-baseline="middle" class="label">Valor</text>
    <g transform="translate(12 -7.5)">
      <circle cx="238" cy="501" r="15" fill="#d9dee2"/>
      <circle cx="283" cy="501" r="15" fill="#8b969d"/>
      <circle cx="328" cy="501" r="15" fill="#27343a"/>
    </g>
    <g transform="translate(0 -10.5)">
      <line x1="462" y1="484" x2="588" y2="484" stroke="#c9d0d4" stroke-width="7" stroke-linecap="round"/>
      <line x1="462" y1="504" x2="588" y2="504" stroke="#818b91" stroke-width="7" stroke-linecap="round"/>
      <line x1="462" y1="524" x2="588" y2="524" stroke="#27343a" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="translate(-22 -9.5)">
      <rect x="690" y="478" width="50" height="50" fill="#d9dee2" stroke="#365b6d" stroke-width="1.2"/>
      <rect x="752" y="478" width="50" height="50" fill="#8b969d" stroke="#365b6d" stroke-width="1.2"/>
      <rect x="814" y="478" width="50" height="50" fill="#27343a" stroke="#365b6d" stroke-width="1.2"/>
    </g>
    <g text-anchor="middle">
      <text x="985" y="488" class="small">Ordenar intensitat</text>
      <text x="985" y="509" class="tiny">clar-fosc, baix-alt</text>
    </g>

    <text x="90" y="588.5" text-anchor="middle" dominant-baseline="middle" class="label">Textura</text>
    <g transform="translate(12 -7.5)">
      <circle cx="238" cy="596" r="17" fill="url(#dotsSparse)" stroke="#365b6d" stroke-width="1.3"/>
      <circle cx="283" cy="596" r="17" fill="url(#hatchA)" stroke="#365b6d" stroke-width="1.3"/>
      <circle cx="328" cy="596" r="17" fill="url(#dotsDense)" stroke="#365b6d" stroke-width="1.3"/>
    </g>
    <g transform="translate(0 -14.5)">
      <line x1="462" y1="581" x2="588" y2="581" stroke="#365b6d" stroke-width="4" stroke-dasharray="4 8" stroke-linecap="round"/>
      <line x1="462" y1="603" x2="588" y2="603" stroke="#365b6d" stroke-width="4" stroke-dasharray="14 7" stroke-linecap="round"/>
      <line x1="462" y1="625" x2="588" y2="625" stroke="#365b6d" stroke-width="4" stroke-dasharray="2 5" stroke-linecap="round"/>
    </g>
    <g transform="translate(-22 -9.5)">
      <rect x="690" y="573" width="50" height="50" fill="url(#dotsSparse)" stroke="#365b6d" stroke-width="1.2"/>
      <rect x="752" y="573" width="50" height="50" fill="url(#hatchA)" stroke="#365b6d" stroke-width="1.2"/>
      <rect x="814" y="573" width="50" height="50" fill="url(#dotsDense)" stroke="#365b6d" stroke-width="1.2"/>
    </g>
    <g text-anchor="middle">
      <text x="985" y="583" class="small">Distingir patrons</text>
      <text x="985" y="604" class="tiny">i reforçar accessibilitat</text>
    </g>

    <text x="90" y="683" text-anchor="middle" dominant-baseline="middle" class="label">To</text>
    <g transform="translate(12 -8)">
      <circle cx="238" cy="691" r="16" class="ink"/>
      <circle cx="283" cy="691" r="16" class="ink2"/>
      <circle cx="328" cy="691" r="16" class="ink3"/>
    </g>
    <g transform="translate(0 -15)">
      <line x1="462" y1="676" x2="588" y2="676" stroke="#16697a" stroke-width="7" stroke-linecap="round"/>
      <line x1="462" y1="698" x2="588" y2="698" stroke="#d0523c" stroke-width="7" stroke-linecap="round"/>
      <line x1="462" y1="720" x2="588" y2="720" stroke="#f2b544" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="translate(-22 -10)">
      <rect x="690" y="668" width="50" height="50" class="area"/>
      <rect x="752" y="668" width="50" height="50" class="area2"/>
      <rect x="814" y="668" width="50" height="50" class="area3"/>
    </g>
    <g text-anchor="middle">
      <text x="985" y="678" class="small">Separar categories</text>
      <text x="985" y="699" class="tiny">no quantificar per si sol</text>
    </g>
  </g>
</svg>
