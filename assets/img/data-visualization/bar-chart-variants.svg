<svg xmlns="http://www.w3.org/2000/svg" width="924" height="334" viewBox="38 88 924 334" role="img" aria-labelledby="title desc">
  <title id="title">Variants de grafics de barres i comparacions divergents</title>
  <desc id="desc">Sis panells comparen barres verticals, barres horitzontals ordenades, barres agrupades, barres apilades al 100%, un tornado plot i una piramide de poblacio.</desc>
  <defs>
    <style>
      .panel{fill:#fff;stroke:#d8d2c5;stroke-width:1.5}.axis{stroke:#5b5b5b;stroke-width:1.5}.grid{stroke:#e8e2d7;stroke-width:1}.txt{font-family:Arial,Helvetica,sans-serif;fill:#2b2b2b}.small{font-size:13px}.label{font-size:12px;fill:#555}.blue{fill:#4c78a8}.orange{fill:#f58518}.green{fill:#54a24b}.red{fill:#d64f4f}.grey{fill:#b8b8b8}.pale{fill:#e9eef4}.line{stroke:#777;stroke-width:1.2;fill:none}.center{stroke:#777;stroke-width:2;stroke-dasharray:4 4}
    </style>
  </defs>
  <g transform="translate(40,90)">
    <rect width="290" height="150" class="panel"/>
    <text x="18" y="28" class="txt small" font-weight="700">Barres verticals</text>
    <line x1="40" y1="122" x2="250" y2="122" class="axis"/>
    <line x1="40" y1="42" x2="40" y2="122" class="axis"/>
    <rect x="65" y="78" width="28" height="44" class="blue"/>
    <rect x="110" y="58" width="28" height="64" class="blue"/>
    <rect x="155" y="92" width="28" height="30" class="blue"/>
    <rect x="200" y="68" width="28" height="54" class="blue"/>
    <text x="53" y="142" class="txt label">A</text><text x="100" y="142" class="txt label">B</text><text x="145" y="142" class="txt label">C</text><text x="190" y="142" class="txt label">D</text>
  </g>

  <g transform="translate(355,90)">
    <rect width="290" height="150" class="panel"/>
    <text x="18" y="28" class="txt small" font-weight="700">Barres horitzontals ordenades</text>
    <line x1="92" y1="122" x2="250" y2="122" class="axis"/>
    <rect x="92" y="45" width="132" height="16" class="green"/>
    <rect x="92" y="70" width="105" height="16" class="green"/>
    <rect x="92" y="95" width="72" height="16" class="green"/>
    <text x="34" y="58" class="txt label">Municipi B</text>
    <text x="34" y="83" class="txt label">Municipi D</text>
    <text x="34" y="108" class="txt label">Municipi A</text>
  </g>

  <g transform="translate(670,90)">
    <rect width="290" height="150" class="panel"/>
    <text x="18" y="28" class="txt small" font-weight="700">Barres agrupades</text>
    <line x1="40" y1="122" x2="250" y2="122" class="axis"/>
    <line x1="40" y1="42" x2="40" y2="122" class="axis"/>
    <g transform="translate(60,0)"><rect x="0" y="78" width="16" height="44" class="blue"/><rect x="20" y="62" width="16" height="60" class="orange"/></g>
    <g transform="translate(120,0)"><rect x="0" y="90" width="16" height="32" class="blue"/><rect x="20" y="72" width="16" height="50" class="orange"/></g>
    <g transform="translate(180,0)"><rect x="0" y="65" width="16" height="57" class="blue"/><rect x="20" y="86" width="16" height="36" class="orange"/></g>
    <rect x="64" y="135" width="12" height="12" class="blue"/><text x="82" y="145" class="txt label">2021</text>
    <rect x="130" y="135" width="12" height="12" class="orange"/><text x="148" y="145" class="txt label">2026</text>
  </g>

  <g transform="translate(40,270)">
    <rect width="290" height="150" class="panel"/>
    <text x="18" y="28" class="txt small" font-weight="700">Barres apilades al 100%</text>
    <g transform="translate(58,50)">
      <rect x="0" y="0" width="180" height="18" class="blue"/><rect x="108" y="0" width="48" height="18" class="orange"/><rect x="156" y="0" width="24" height="18" class="grey"/>
      <rect x="0" y="36" width="180" height="18" class="blue" opacity=".78"/><rect x="72" y="36" width="72" height="18" class="orange"/><rect x="144" y="36" width="36" height="18" class="grey"/>
      <rect x="0" y="72" width="180" height="18" class="blue" opacity=".58"/><rect x="54" y="72" width="84" height="18" class="orange"/><rect x="138" y="72" width="42" height="18" class="grey"/>
    </g>
  </g>

  <g transform="translate(355,270)">
    <rect width="290" height="150" class="panel"/>
    <text x="18" y="28" class="txt small" font-weight="700">Tornado plot</text>
    <line x1="145" y1="42" x2="145" y2="122" class="center"/>
    <rect x="64" y="50" width="81" height="14" class="blue"/><rect x="145" y="50" width="104" height="14" class="orange"/>
    <rect x="88" y="75" width="57" height="14" class="blue"/><rect x="145" y="75" width="72" height="14" class="orange"/>
    <rect x="110" y="100" width="35" height="14" class="blue"/><rect x="145" y="100" width="46" height="14" class="orange"/>
    <text x="92" y="142" class="txt label" text-anchor="middle">Escenari baix</text><text x="198" y="142" class="txt label" text-anchor="middle">Escenari alt</text>
  </g>

  <g transform="translate(670,270)">
    <rect width="290" height="150" class="panel"/>
    <text x="18" y="28" class="txt small" font-weight="700">Piramide de poblacio</text>
    <line x1="145" y1="42" x2="145" y2="125" class="center"/>
    <g transform="translate(0,0)">
      <rect x="92" y="48" width="53" height="10" class="blue"/><rect x="145" y="48" width="58" height="10" class="red"/>
      <rect x="76" y="65" width="69" height="10" class="blue"/><rect x="145" y="65" width="74" height="10" class="red"/>
      <rect x="66" y="82" width="79" height="10" class="blue"/><rect x="145" y="82" width="84" height="10" class="red"/>
      <rect x="104" y="99" width="41" height="10" class="blue"/><rect x="145" y="99" width="45" height="10" class="red"/>
      <rect x="120" y="116" width="25" height="10" class="blue"/><rect x="145" y="116" width="32" height="10" class="red"/>
    </g>
    <text x="76" y="142" class="txt label">homes</text><text x="173" y="142" class="txt label">dones</text>
  </g>
</svg>
