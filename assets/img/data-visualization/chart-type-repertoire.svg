<svg xmlns="http://www.w3.org/2000/svg" width="1074" height="549" viewBox="53 118 1074 549" role="img" aria-labelledby="title desc">
  <title id="title">Repertori orientatiu de grafics segons la pregunta</title>
  <desc id="desc">Vuit famílies de representació visual vinculades a preguntes de comparació, evolució, composició, distribució, relació, xarxa, flux i espai.</desc>
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #d5dde2; stroke-width: 1.6; }
      .label { font: 700 18px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .small { font: 14px Arial, 'Liberation Sans', sans-serif; fill: #52616b; }
      .axis { stroke: #9fb0b8; stroke-width: 1.5; }
      .ink { fill: #16697a; }
      .ink2 { fill: #d0523c; }
      .ink3 { fill: #f2b544; }
      .line { fill: none; stroke: #16697a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #365b6d; stroke-width: 2; }
      .dash { fill: none; stroke: #365b6d; stroke-width: 2; stroke-dasharray: 6 7; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#365b6d"/>
    </marker>
  </defs>
  <g transform="translate(55 120)">
    <rect class="card" width="245" height="245"/>
    <text x="24" y="38" class="label">Comparar magnituds</text>
    <text x="24" y="62" class="small">barres ordenades</text>
    <line x1="45" y1="190" x2="205" y2="190" class="axis"/>
    <rect x="50" y="130" width="26" height="60" class="ink"/>
    <rect x="88" y="92" width="26" height="98" class="ink"/>
    <rect x="126" y="150" width="26" height="40" class="ink"/>
    <rect x="164" y="74" width="26" height="116" class="ink"/>
  </g>

  <g transform="translate(330 120)">
    <rect class="card" width="245" height="245"/>
    <text x="24" y="38" class="label">Seguir un canvi</text>
    <text x="24" y="62" class="small">serie temporal</text>
    <line x1="42" y1="190" x2="205" y2="190" class="axis"/>
    <line x1="42" y1="72" x2="42" y2="190" class="axis"/>
    <polyline points="45,165 82,145 119,152 156,105 194,88" class="line"/>
    <circle cx="45" cy="165" r="5" class="ink2"/><circle cx="82" cy="145" r="5" class="ink2"/><circle cx="119" cy="152" r="5" class="ink2"/><circle cx="156" cy="105" r="5" class="ink2"/><circle cx="194" cy="88" r="5" class="ink2"/>
  </g>

  <g transform="translate(605 120)">
    <rect class="card" width="245" height="245"/>
    <text x="24" y="38" class="label">Explicar composicio</text>
    <text x="24" y="62" class="small">parts d'un total</text>
    <rect x="48" y="98" width="150" height="34" fill="#16697a"/>
    <rect x="48" y="132" width="150" height="34" fill="#7fb3c8"/>
    <rect x="48" y="166" width="150" height="34" fill="#f2b544"/>
    <line x1="123" y1="98" x2="123" y2="200" stroke="#fff" stroke-width="2"/>
    <line x1="162" y1="98" x2="162" y2="200" stroke="#fff" stroke-width="2"/>
  </g>

  <g transform="translate(880 120)">
    <rect class="card" width="245" height="245"/>
    <text x="24" y="38" class="label">Llegir distribucio</text>
    <text x="24" y="62" class="small">histograma o boxplot</text>
    <line x1="45" y1="190" x2="205" y2="190" class="axis"/>
    <rect x="55" y="160" width="24" height="30" class="ink"/>
    <rect x="82" y="125" width="24" height="65" class="ink"/>
    <rect x="109" y="90" width="24" height="100" class="ink"/>
    <rect x="136" y="118" width="24" height="72" class="ink"/>
    <rect x="163" y="150" width="24" height="40" class="ink"/>
  </g>

  <g transform="translate(55 420)">
    <rect class="card" width="245" height="245"/>
    <text x="24" y="38" class="label">Explorar relacio</text>
    <text x="24" y="62" class="small">diagrama de dispersio</text>
    <line x1="45" y1="190" x2="205" y2="190" class="axis"/>
    <line x1="45" y1="190" x2="45" y2="78" class="axis"/>
    <circle cx="72" cy="165" r="6" class="ink"/><circle cx="98" cy="148" r="6" class="ink"/><circle cx="122" cy="134" r="6" class="ink"/><circle cx="146" cy="112" r="6" class="ink"/><circle cx="177" cy="92" r="6" class="ink2"/><circle cx="93" cy="112" r="6" class="ink3"/>
  </g>

  <g transform="translate(330 420)">
    <rect class="card" width="245" height="245"/>
    <text x="24" y="38" class="label">Mostrar xarxa</text>
    <text x="24" y="62" class="small">nodes i arestes</text>
    <line x1="82" y1="116" x2="160" y2="95" class="thin"/>
    <line x1="82" y1="116" x2="108" y2="176" class="thin"/>
    <line x1="160" y1="95" x2="178" y2="163" class="thin"/>
    <line x1="108" y1="176" x2="178" y2="163" class="thin"/>
    <circle cx="82" cy="116" r="17" class="ink"/><circle cx="160" cy="95" r="17" class="ink2"/><circle cx="108" cy="176" r="17" class="ink3"/><circle cx="178" cy="163" r="17" fill="#7a5195"/>
  </g>

  <g transform="translate(605 420)">
    <rect class="card" width="245" height="245"/>
    <text x="24" y="38" class="label">Representar flux</text>
    <text x="24" y="62" class="small">direccio i volum</text>
    <path d="M55,170 C94,94 143,206 195,92" class="dash" marker-end="url(#arrow)"/>
    <path d="M62,112 C115,90 143,118 188,150" fill="none" stroke="#d0523c" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
    <circle cx="55" cy="170" r="10" class="ink"/><circle cx="195" cy="92" r="10" class="ink"/><circle cx="62" cy="112" r="10" class="ink2"/><circle cx="188" cy="150" r="10" class="ink2"/>
  </g>

  <g transform="translate(880 420)">
    <rect class="card" width="245" height="245"/>
    <text x="24" y="38" class="label">Conservar l'espai</text>
    <text x="24" y="62" class="small">mapa o patro territorial</text>
    <path d="M68,102 L132,84 L188,112 L178,178 L112,195 L54,158 Z" fill="#e4edf0" stroke="#365b6d" stroke-width="3"/>
    <path d="M68,102 L105,137 L54,158" class="thin"/>
    <path d="M105,137 L132,84 L142,145 L188,112" class="thin"/>
    <path d="M105,137 L112,195 L142,145 L178,178" class="thin"/>
    <circle cx="142" cy="145" r="18" fill="#d0523c" opacity=".85"/>
  </g>
</svg>
