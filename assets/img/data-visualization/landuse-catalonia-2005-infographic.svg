        <rect x="166" y="191" width="15" height="35" rx="1"/>
        <rect x="185" y="198" width="10" height="28" rx="1"/>
        <rect x="146" y="226" width="53" height="4" rx="2"/>
      </g>
      <text x="215" y="205" font-size="32" font-weight="700" fill="#96392e">6,23%</text>
      <text x="215" y="237" font-size="24" font-weight="700" fill="#394851">Zones urbanitzades</text>
    </g>

    <g aria-label="Aig&#252;es continentals: 0,53 per cent">
      <path d="M596.274 195.031 680 168H860V179" fill="none" stroke="#246d8c" stroke-width="3"/>
      <circle cx="596.274" cy="195.031" r="5" fill="#287da2"/>
      <circle cx="860" cy="210" r="31" fill="#dcecf3"/>
      <g aria-hidden="true" fill="none" stroke="#287da2" stroke-width="4" stroke-linecap="round">
        <path d="M839 199c7 0 7 6 14 6s7-6 14-6 7 6 14 6"/>
        <path d="M839 211c7 0 7 6 14 6s7-6 14-6 7 6 14 6"/>
        <path d="M839 223c7 0 7 6 14 6s7-6 14-6 7 6 14 6"/>
      </g>
      <text x="905" y="205" font-size="32" font-weight="700" fill="#246d8c">0,53%</text>
      <text x="905" y="237" font-size="24" font-weight="700" fill="#394851">Aig&#252;es continentals</text>
    </g>

    <g aria-label="Terrenys agr&#237;coles: 29,80 per cent">
      <path d="M379.544 375.01 335 372H120V389" fill="none" stroke="#a56a10" stroke-width="3"/>
      <circle cx="379.544" cy="375.01" r="5" fill="#e2a12e"/>
      <circle cx="120" cy="420" r="31" fill="#faedcf"/>
      <g aria-hidden="true" fill="none" stroke="#a56a10" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M120 393v54"/>
        <path d="m120 406-12-8M120 416l-14-7M120 426l-13-5M120 406l12-8M120 416l14-7M120 426l13-5"/>
