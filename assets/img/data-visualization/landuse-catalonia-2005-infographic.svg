<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ocupaci&#243; del s&#242;l a Catalunya, 2005</title>
  <desc id="desc">Gr&#224;fic en anell amb quatre categories. Els terrenys forestals representen el 63,44 per cent; els agr&#237;coles, el 29,80 per cent; les zones urbanitzades, el 6,23 per cent, i les aig&#252;es continentals, el 0,53 per cent. El centre mostra un total de 3,21 milions d'hect&#224;rees.</desc>

  <rect width="1200" height="760" fill="#fbfaf7"/>

  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="600" y="82" text-anchor="middle" font-size="44" font-weight="700" fill="#17202a">Ocupaci&#243; del s&#242;l a Catalunya (2005)</text>

    <g aria-label="Anell amb les quatre categories d'ocupaci&#243; del s&#242;l">
      <path d="M600 195A225 225 0 1 1 431.76 569.4L502.795 506.32A130 130 0 1 0 600 290Z" fill="#1f6b57"/>
      <path d="M431.76 569.4A225 225 0 0 1 507.319 214.975L546.451 301.541A130 130 0 0 0 502.795 506.32Z" fill="#e2a12e"/>
      <path d="M507.319 214.975A225 225 0 0 1 592.548 195.123L595.695 290.071A130 130 0 0 0 546.451 301.541Z" fill="#b84b3a"/>
      <path d="M592.548 195.123A225 225 0 0 1 600 195L600 290A130 130 0 0 0 595.695 290.071Z" fill="#287da2"/>

      <g stroke="#fbfaf7" stroke-width="5">
        <line x1="600" y1="290" x2="600" y2="195"/>
        <line x1="502.795" y1="506.32" x2="431.76" y2="569.4"/>
        <line x1="546.451" y1="301.541" x2="507.319" y2="214.975"/>
        <line x1="595.695" y1="290.071" x2="592.548" y2="195.123"/>
      </g>

      <text x="600" y="402" text-anchor="middle" font-size="54" font-weight="700" fill="#17202a">3,21</text>
      <text x="600" y="437" text-anchor="middle" font-size="21" font-weight="700" fill="#52616b">milions d'hect&#224;rees</text>
      <text x="600" y="469" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="1.8" fill="#52616b">TOTAL</text>
    </g>

    <g aria-label="Zones urbanitzades: 6,23 per cent">
      <path d="M548.959 200.866 505 168H170V179" fill="none" stroke="#96392e" stroke-width="3"/>
      <circle cx="548.959" cy="200.866" r="5" fill="#b84b3a"/>
      <circle cx="170" cy="210" r="31" fill="#f3dfda"/>
      <g aria-hidden="true" fill="#b84b3a">
