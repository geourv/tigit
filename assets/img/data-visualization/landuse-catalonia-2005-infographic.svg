    <line x1="80" y1="682" x2="1120" y2="682" stroke="#c8c0b3" stroke-width="2"/>
    <text x="80" y="711" font-size="18" fill="#52616b">Font: CREAF, Mapa de cobertes del s&#242;l de Catalunya, 3a edici&#243; (MCSC-3), 2005.</text>
    <text x="1120" y="739" text-anchor="end" font-size="18" fill="#52616b">Total: 3.210.092,33 ha &#183; Elaboraci&#243; pr&#242;pia TIGIT</text>
  </g>
