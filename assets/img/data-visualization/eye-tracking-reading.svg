<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="eye-title eye-desc">
  <title id="eye-title">Tres lectures de dades de seguiment de la mirada</title>
  <desc id="eye-desc">Tres panells comparen fixacions i moviments sacàdics, el recorregut temporal d'una persona i un gràfic d'intensitat de colors agregat sobre el mateix estímul infogràfic. Les dades són simulades.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fa; }
      .panel { fill: #ffffff; stroke: #cbd6dc; stroke-width: 2; }
      .stimulus { fill: #ffffff; stroke: #9fb0b8; stroke-width: 1.5; }
      .ink { fill: #17202a; font-family: Arial, 'Liberation Sans', sans-serif; }
      .muted { fill: #52616b; font-family: Arial, 'Liberation Sans', sans-serif; }
      .panel-title { fill: #17202a; font: 700 22px Arial, 'Liberation Sans', sans-serif; }
      .panel-subtitle { fill: #52616b; font: 16px Arial, 'Liberation Sans', sans-serif; }
      .stim-title { fill: #17202a; font: 700 18px Arial, 'Liberation Sans', sans-serif; }
      .stim-metric { fill: #16697a; font: 700 36px Arial, 'Liberation Sans', sans-serif; }
      .stim-label { fill: #52616b; font: 13px Arial, 'Liberation Sans', sans-serif; }
      .note { fill: #17202a; font: 16px Arial, 'Liberation Sans', sans-serif; }
      .legend { fill: #17202a; font: 15px Arial, 'Liberation Sans', sans-serif; }
      .marker-text { fill: #17202a; font: 700 14px Arial, 'Liberation Sans', sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .bar { fill: #8fbdd0; }
      .bar-key { fill: #16697a; }
      .fixation { fill: #ffffff; fill-opacity: .82; stroke: #16697a; stroke-width: 3; }
      .saccade { fill: none; stroke: #365b6d; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .scan-line { fill: none; stroke: #d0523c; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .timeline { stroke: #9fb0b8; stroke-width: 2; }
    </style>
    <marker id="eye-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#365b6d"/>
    </marker>
    <marker id="scan-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d0523c"/>
    </marker>
    <radialGradient id="heat-high">
      <stop offset="0" stop-color="#d0523c" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#f2b544" stop-opacity=".78"/>
      <stop offset=".7" stop-color="#f5df75" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f5df75" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat-low">
      <stop offset="0" stop-color="#f2b544" stop-opacity=".72"/>
      <stop offset=".55" stop-color="#f5df75" stop-opacity=".42"/>
      <stop offset="1" stop-color="#f5df75" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heat-scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5df75"/>
      <stop offset=".55" stop-color="#f2b544"/>
      <stop offset="1" stop-color="#d0523c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" class="bg"/>
  <g id="heading" class="ink">
    <text x="40" y="43" font-size="28" font-weight="700">Qu&#x00E8; conserva cada representaci&#x00F3; del seguiment de la mirada?</text>
    <text x="40" y="70" font-size="17" fill="#52616b">El mateix est&#x00ED;mul, tres formes de resumir l'atenci&#x00F3; visual</text>
  </g>

  <g id="fixations-panel" aria-label="Fixacions i moviments sacàdics">
    <rect x="30" y="92" width="360" height="590" rx="8" class="panel"/>
    <text x="52" y="126" class="panel-title">a &#x00B7; Fixacions i moviments</text>
    <text x="52" y="151" class="panel-subtitle">Moviments sac&#x00E0;dics entre punts observats</text>

    <g id="stimulus-fixations" transform="translate(52 174)">
      <rect width="316" height="292" rx="5" class="stimulus"/>
      <rect width="316" height="43" rx="5" fill="#e7f0f2"/>
      <rect y="38" width="316" height="5" fill="#e7f0f2"/>
      <text x="16" y="28" class="stim-title">Turisme al litoral</text>
      <text x="18" y="93" class="stim-metric">72%</text>
      <text x="18" y="116" class="stim-label">ocupaci&#x00F3; mitjana</text>
      <g transform="translate(139 66)">
        <line x1="0" y1="109" x2="151" y2="109" stroke="#9fb0b8" stroke-width="1.3"/>
        <rect x="8" y="66" width="22" height="43" class="bar"/>
        <rect x="42" y="49" width="22" height="60" class="bar"/>
        <rect x="76" y="29" width="22" height="80" class="bar-key"/>
        <rect x="110" y="12" width="22" height="97" class="bar"/>
        <text x="19" y="128" text-anchor="middle" class="stim-label">J</text>
        <text x="53" y="128" text-anchor="middle" class="stim-label">J</text>
        <text x="87" y="128" text-anchor="middle" class="stim-label">A</text>
        <text x="121" y="128" text-anchor="middle" class="stim-label">S</text>
      </g>
      <rect x="17" y="213" width="282" height="45" rx="4" fill="#fff3d8" stroke="#d8b45c"/>
      <text x="30" y="232" class="stim-label" font-weight="700">Punt clau</text>
      <text x="30" y="249" class="stim-label">El m&#x00E0;xim arriba al setembre</text>
      <text x="18" y="280" class="stim-label">Font: observatori local</text>

      <path d="M73 68 L181 87 L246 110 L177 232 L85 240 L61 270" class="saccade" marker-end="url(#eye-arrow)"/>
      <circle cx="73" cy="68" r="19" class="fixation"/>
      <text x="73" y="68" class="marker-text">1</text>
      <circle cx="181" cy="87" r="15" class="fixation"/>
      <text x="181" y="87" class="marker-text">2</text>
      <circle cx="246" cy="110" r="22" class="fixation"/>
      <text x="246" y="110" class="marker-text">3</text>
      <circle cx="177" cy="232" r="17" class="fixation"/>
      <text x="177" y="232" class="marker-text">4</text>
      <circle cx="85" cy="240" r="14" class="fixation"/>
      <text x="85" y="240" class="marker-text">5</text>
      <circle cx="61" cy="270" r="12" class="fixation"/>
      <text x="61" y="270" class="marker-text">6</text>
    </g>

    <g id="fixations-legend">
      <circle cx="66" cy="497" r="13" class="fixation"/>
      <text x="90" y="502" class="legend">Fixaci&#x00F3; (mida = durada)</text>
      <line x1="54" y1="528" x2="80" y2="528" class="saccade" marker-end="url(#eye-arrow)"/>
      <text x="90" y="533" class="legend">Moviment sac&#x00E0;dic (transici&#x00F3;)</text>
    </g>
    <rect x="50" y="560" width="320" height="93" rx="5" fill="#eef4f5"/>
    <text x="66" y="585" class="note" font-weight="700">Qu&#x00E8; conserva?</text>
    <text x="66" y="608" class="note">On es fixa la mirada i com salta</text>
    <text x="66" y="631" class="note">d'un punt al seg&#x00FC;ent.</text>
  </g>

  <g id="scanpath-panel" aria-label="Ordre temporal del recorregut de la mirada">
    <rect x="420" y="92" width="360" height="590" rx="8" class="panel"/>
    <text x="442" y="126" class="panel-title">b &#x00B7; Recorregut temporal</text>
    <text x="442" y="151" class="panel-subtitle">Una seq&#x00FC;&#x00E8;ncia individual, d'inici a final</text>

    <g id="stimulus-scanpath" transform="translate(442 174)">
      <rect width="316" height="292" rx="5" class="stimulus"/>
      <rect width="316" height="43" rx="5" fill="#e7f0f2"/>
      <rect y="38" width="316" height="5" fill="#e7f0f2"/>
      <text x="16" y="28" class="stim-title">Turisme al litoral</text>
      <text x="18" y="93" class="stim-metric">72%</text>
      <text x="18" y="116" class="stim-label">ocupaci&#x00F3; mitjana</text>
      <g transform="translate(139 66)">
        <line x1="0" y1="109" x2="151" y2="109" stroke="#9fb0b8" stroke-width="1.3"/>
        <rect x="8" y="66" width="22" height="43" class="bar"/>
        <rect x="42" y="49" width="22" height="60" class="bar"/>
        <rect x="76" y="29" width="22" height="80" class="bar-key"/>
        <rect x="110" y="12" width="22" height="97" class="bar"/>
        <text x="19" y="128" text-anchor="middle" class="stim-label">J</text>
        <text x="53" y="128" text-anchor="middle" class="stim-label">J</text>
        <text x="87" y="128" text-anchor="middle" class="stim-label">A</text>
        <text x="121" y="128" text-anchor="middle" class="stim-label">S</text>
      </g>
      <rect x="17" y="213" width="282" height="45" rx="4" fill="#fff3d8" stroke="#d8b45c"/>
      <text x="30" y="232" class="stim-label" font-weight="700">Punt clau</text>
      <text x="30" y="249" class="stim-label">El m&#x00E0;xim arriba al setembre</text>
      <text x="18" y="280" class="stim-label">Font: observatori local</text>

      <path d="M73 68 L181 87 L246 110 L177 232 L85 240 L61 270" class="scan-line" marker-end="url(#scan-arrow)"/>
      <g fill="#ffffff" stroke="#d0523c" stroke-width="3">
        <circle cx="73" cy="68" r="14"/>
        <circle cx="181" cy="87" r="14"/>
        <circle cx="246" cy="110" r="14"/>
        <circle cx="177" cy="232" r="14"/>
        <circle cx="85" cy="240" r="14"/>
        <circle cx="61" cy="270" r="14"/>
      </g>
      <g class="marker-text">
        <text x="73" y="68">1</text>
        <text x="181" y="87">2</text>
        <text x="246" y="110">3</text>
        <text x="177" y="232">4</text>
        <text x="85" y="240">5</text>
        <text x="61" y="270">6</text>
      </g>
    </g>

    <g id="timeline" transform="translate(452 490)">
      <text x="0" y="5" class="legend" font-weight="700">Temps</text>
      <line x1="60" y1="0" x2="290" y2="0" class="timeline" marker-end="url(#scan-arrow)"/>
      <g fill="#ffffff" stroke="#d0523c" stroke-width="2">
        <circle cx="75" cy="0" r="12"/><circle cx="115" cy="0" r="12"/>
        <circle cx="155" cy="0" r="12"/><circle cx="195" cy="0" r="12"/>
        <circle cx="235" cy="0" r="12"/><circle cx="275" cy="0" r="12"/>
      </g>
      <g class="marker-text" font-size="12">
        <text x="75" y="0">1</text><text x="115" y="0">2</text>
        <text x="155" y="0">3</text><text x="195" y="0">4</text>
        <text x="235" y="0">5</text><text x="275" y="0">6</text>
      </g>
    </g>
    <rect x="440" y="560" width="320" height="93" rx="5" fill="#fff3ee"/>
    <text x="456" y="585" class="note" font-weight="700">Qu&#x00E8; conserva?</text>
    <text x="456" y="608" class="note">L'ordre temporal d'una persona:</text>
    <text x="456" y="631" class="note">el recorregut no es pot reordenar.</text>
  </g>

  <g id="heatmap-panel" aria-label="Gràfic d'intensitat de colors agregat">
    <rect x="810" y="92" width="360" height="590" rx="8" class="panel"/>
    <text x="832" y="126" class="panel-title">c &#x00B7; Intensitat agregada</text>
    <text x="832" y="151" class="panel-subtitle">Intensitat conjunta de moltes mirades</text>

    <g id="stimulus-heatmap" transform="translate(832 174)">
      <rect width="316" height="292" rx="5" class="stimulus"/>
      <rect width="316" height="43" rx="5" fill="#e7f0f2"/>
      <rect y="38" width="316" height="5" fill="#e7f0f2"/>
      <text x="16" y="28" class="stim-title">Turisme al litoral</text>
      <text x="18" y="93" class="stim-metric">72%</text>
      <text x="18" y="116" class="stim-label">ocupaci&#x00F3; mitjana</text>
      <g transform="translate(139 66)">
        <line x1="0" y1="109" x2="151" y2="109" stroke="#9fb0b8" stroke-width="1.3"/>
        <rect x="8" y="66" width="22" height="43" class="bar"/>
        <rect x="42" y="49" width="22" height="60" class="bar"/>
        <rect x="76" y="29" width="22" height="80" class="bar-key"/>
        <rect x="110" y="12" width="22" height="97" class="bar"/>
        <text x="19" y="128" text-anchor="middle" class="stim-label">J</text>
        <text x="53" y="128" text-anchor="middle" class="stim-label">J</text>
        <text x="87" y="128" text-anchor="middle" class="stim-label">A</text>
        <text x="121" y="128" text-anchor="middle" class="stim-label">S</text>
      </g>
      <rect x="17" y="213" width="282" height="45" rx="4" fill="#fff3d8" stroke="#d8b45c"/>
      <text x="30" y="232" class="stim-label" font-weight="700">Punt clau</text>
      <text x="30" y="249" class="stim-label">El m&#x00E0;xim arriba al setembre</text>
      <text x="18" y="280" class="stim-label">Font: observatori local</text>

      <ellipse cx="76" cy="73" rx="70" ry="55" fill="url(#heat-high)"/>
      <ellipse cx="235" cy="106" rx="82" ry="68" fill="url(#heat-high)"/>
      <ellipse cx="164" cy="235" rx="105" ry="45" fill="url(#heat-low)"/>
      <ellipse cx="62" cy="272" rx="56" ry="31" fill="url(#heat-low)"/>
    </g>

    <g id="heatmap-legend">
      <text x="832" y="495" class="legend" font-weight="700">Intensitat agregada</text>
      <rect x="832" y="510" width="190" height="16" rx="3" fill="url(#heat-scale)" stroke="#9b6f20"/>
      <text x="832" y="548" class="legend">menys</text>
      <text x="1022" y="548" text-anchor="end" class="legend">m&#x00E9;s</text>
    </g>
    <rect x="830" y="560" width="320" height="93" rx="5" fill="#fff3d8"/>
    <text x="846" y="585" class="note" font-weight="700">Qu&#x00E8; perd?</text>
    <text x="846" y="608" class="note">L'ordre temporal i les difer&#x00E8;ncies</text>
    <text x="846" y="631" class="note">entre persones.</text>
  </g>

  <g id="footer" class="muted" font-size="16">
    <line x1="30" y1="708" x2="1170" y2="708" stroke="#cbd6dc" stroke-width="1.5"/>
    <text x="600" y="738" text-anchor="middle">Dades simulades &#x00B7; esquema docent</text>
  </g>
</svg>
