<svg xmlns="http://www.w3.org/2000/svg" width="600" height="316" viewBox="80 118 600 316" role="img" aria-labelledby="title desc">
  <title id="title">Dues sèries separades en petits múltiples amb unitats explícites</title>
  <desc id="desc">La mateixa ocupació i el mateix preu mitjà es mostren en dos panells separats, amb unitats i rangs visibles, per evitar una relació visual fabricada.</desc>
  <defs>
    <style>
      .panel{fill:#fff;stroke:#d8d2c5;stroke-width:1.5}.grid{stroke:#e8e2d7;stroke-width:1}.axis{stroke:#555;stroke-width:1.6}.txt{font-family:Arial,Helvetica,sans-serif;fill:#2b2b2b}.label{font-size:13px;fill:#555}.blueLine{fill:none;stroke:#2f6fb0;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}.orangeLine{fill:none;stroke:#d77828;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}.blueTxt{fill:#2f6fb0}.orangeTxt{fill:#b65f1f}
    </style>
  </defs>
  <g transform="translate(82 120)">
    <rect class="panel" x="0" y="0" width="596" height="140"/>
    <line class="grid" x1="70" y1="32" x2="540" y2="32"/>
    <line class="grid" x1="70" y1="72" x2="540" y2="72"/>
    <line class="grid" x1="70" y1="112" x2="540" y2="112"/>
    <line class="axis" x1="70" y1="112" x2="540" y2="112"/>
    <line class="axis" x1="70" y1="25" x2="70" y2="112"/>
    <text x="20" y="117" class="txt label">60%</text>
    <text x="20" y="77" class="txt label">65%</text>
    <text x="20" y="37" class="txt label">70%</text>
    <polyline class="blueLine" points="92,105 200,91 308,78 416,51 524,31"/>
    <circle cx="92" cy="105" r="4.8" fill="#2f6fb0"/><circle cx="200" cy="91" r="4.8" fill="#2f6fb0"/><circle cx="308" cy="78" r="4.8" fill="#2f6fb0"/><circle cx="416" cy="51" r="4.8" fill="#2f6fb0"/><circle cx="524" cy="31" r="4.8" fill="#2f6fb0"/>
    <text x="88" y="132" class="txt label">2021</text><text x="196" y="132" class="txt label">2022</text><text x="304" y="132" class="txt label">2023</text><text x="412" y="132" class="txt label">2024</text><text x="520" y="132" class="txt label">2025</text>
    <text x="86" y="24" class="txt blueTxt" font-size="15" font-weight="700">Ocupació hotelera (%)</text>
  </g>

  <g transform="translate(82 292)">
    <rect class="panel" x="0" y="0" width="596" height="140"/>
    <line class="grid" x1="70" y1="32" x2="540" y2="32"/>
    <line class="grid" x1="70" y1="72" x2="540" y2="72"/>
    <line class="grid" x1="70" y1="112" x2="540" y2="112"/>
    <line class="axis" x1="70" y1="112" x2="540" y2="112"/>
    <line class="axis" x1="70" y1="25" x2="70" y2="112"/>
    <text x="24" y="117" class="txt label">90</text>
    <text x="18" y="77" class="txt label">120</text>
    <text x="18" y="37" class="txt label">150</text>
    <polyline class="orangeLine" points="92,109 200,97 308,85 416,61 524,39"/>
    <circle cx="92" cy="109" r="4.8" fill="#d77828"/><circle cx="200" cy="97" r="4.8" fill="#d77828"/><circle cx="308" cy="85" r="4.8" fill="#d77828"/><circle cx="416" cy="61" r="4.8" fill="#d77828"/><circle cx="524" cy="39" r="4.8" fill="#d77828"/>
    <text x="88" y="132" class="txt label">2021</text><text x="196" y="132" class="txt label">2022</text><text x="304" y="132" class="txt label">2023</text><text x="412" y="132" class="txt label">2024</text><text x="520" y="132" class="txt label">2025</text>
    <text x="86" y="24" class="txt orangeTxt" font-size="15" font-weight="700">Preu mitjà per nit (EUR)</text>
  </g>
</svg>
