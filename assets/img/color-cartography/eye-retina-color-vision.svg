<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 98 920 334" role="img" aria-labelledby="title desc">
  <title id="title">Esquema docent de l'ull, la retina i la percepcio cromatica</title>
  <desc id="desc">La figura mostra la llum entrant a l'ull, la retina amb bastons i cons, i una traduccio didactica cap a contrast de valor i diferencies de to. Es un esquema simplificat i l'anatomia no es representa a escala.</desc>
  <defs>
    <style>
      .panel{fill:#fff;stroke:#d8d2c5;stroke-width:1.5}.txt{font-family:Arial,Helvetica,sans-serif;fill:#2b2b2b}.small{font-size:14px}.label{font-size:12px;fill:#555}.line{fill:none;stroke:#444;stroke-width:2}.soft{fill:#f0ece4}.retina{fill:none;stroke:#c96f5d;stroke-width:9;stroke-linecap:round}.lens{fill:#dcecff;stroke:#6a8fb3;stroke-width:2}.arrow{stroke:#d49a2a;stroke-width:3;fill:none;marker-end:url(#arrow)}.rod{fill:#4b5563}.coneS{fill:#3c70b2}.coneM{fill:#5a9b52}.coneL{fill:#d65f43}.chip{stroke:#555;stroke-width:.8}.note{font-size:12px;fill:#666}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d49a2a"/></marker>
  </defs>
  <g transform="translate(42,100)">
    <rect width="575" height="330" class="panel"/>
    <path d="M50,168 C118,62 288,34 466,115 C518,139 546,165 546,165 C546,165 512,201 450,226 C283,293 119,268 50,168 Z" fill="#fff9f2" stroke="#4f4f4f" stroke-width="3"/>
    <circle cx="160" cy="166" r="68" fill="#eef6ff" stroke="#6a8fb3" stroke-width="3"/>
    <circle cx="160" cy="166" r="28" fill="#16181d" opacity=".86"/>
    <ellipse cx="247" cy="166" rx="24" ry="64" class="lens"/>
    <path d="M475,120 C430,150 430,190 475,222" class="retina"/>
    <path d="M5,117 C75,130 120,145 144,160" class="arrow"/>
    <path d="M4,166 C72,166 118,166 144,166" class="arrow"/>
    <path d="M5,215 C75,202 120,187 144,172" class="arrow"/>
    <text x="12" y="98" class="txt label">llum</text>
    <text x="219" y="248" class="txt label">cristalli</text>
    <text x="445" y="252" class="txt label">retina</text>
    <g transform="translate(402,130)">
      <rect x="0" y="0" width="12" height="44" rx="5" class="rod"/>
      <path d="M28,0 L40,44 L16,44 Z" class="coneS"/>
      <rect x="58" y="0" width="12" height="44" rx="5" class="rod"/>
      <path d="M86,0 L98,44 L74,44 Z" class="coneM"/>
      <path d="M124,0 L136,44 L112,44 Z" class="coneL"/>
    </g>
    <text x="348" y="42" class="txt small" font-weight="700">Fotoreceptors</text>
    <text x="348" y="68" class="txt label">bastons: lluminositat i contrast</text>
    <text x="348" y="88" class="txt label">cons: diferencies cromatiques</text>
  </g>

  <g transform="translate(648,100)">
    <rect width="310" height="330" class="panel"/>
    <text x="22" y="34" class="txt small" font-weight="700">Conseqüencia grafica</text>
    <text x="22" y="64" class="txt label">Una rampa ordenada necessita</text>
    <text x="22" y="82" class="txt label">contrast de valor, no nomes canvi de to.</text>
    <g transform="translate(24,112)">
      <text x="0" y="-18" class="txt label">Progressio de valor</text>
      <rect x="0" y="0" width="44" height="44" fill="#eff3ff" class="chip"/>
      <rect x="44" y="0" width="44" height="44" fill="#bdd7e7" class="chip"/>
      <rect x="88" y="0" width="44" height="44" fill="#6baed6" class="chip"/>
      <rect x="132" y="0" width="44" height="44" fill="#3182bd" class="chip"/>
      <rect x="176" y="0" width="44" height="44" fill="#08519c" class="chip"/>
    </g>
    <g transform="translate(24,200)">
      <text x="0" y="-18" class="txt label">Canvi de to sense ordre clar</text>
      <rect x="0" y="0" width="44" height="44" fill="#e41a1c" class="chip"/>
      <rect x="44" y="0" width="44" height="44" fill="#4daf4a" class="chip"/>
      <rect x="88" y="0" width="44" height="44" fill="#377eb8" class="chip"/>
      <rect x="132" y="0" width="44" height="44" fill="#984ea3" class="chip"/>
      <rect x="176" y="0" width="44" height="44" fill="#ff7f00" class="chip"/>
    </g>
    <text x="22" y="284" class="txt note">
      <tspan x="22" dy="0">Si el to falla, la lectura encara ha de poder-se</tspan>
      <tspan x="22" dy="18">sostenir amb valor, etiqueta, forma o patró.</tspan>
    </text>
  </g>
</svg>
