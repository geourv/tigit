<svg xmlns="http://www.w3.org/2000/svg" width="1304" height="724" viewBox="48 118 1304 724" role="img" aria-labelledby="title desc">
  <title id="title">Models de color per a monitors, impressio i selectors digitals</title>
  <desc id="desc">Comparacio didactica dels models RGB, CMYK, RYB i HSL HSV, amb colors primaris, usos principals i significat dels canals.</desc>
  <defs>
    <style>
      .panel{fill:#f7fafb;stroke:#c9d4dc;stroke-width:2}
      .panelDark{fill:#101820;stroke:#c9d4dc;stroke-width:2}
      .h{font:700 25px Arial,'Liberation Sans',sans-serif;fill:#17202a}
      .hLight{font:700 25px Arial,'Liberation Sans',sans-serif;fill:#ffffff}
      .p{font:17px Arial,'Liberation Sans',sans-serif;fill:#40515c}
      .pLight{font:17px Arial,'Liberation Sans',sans-serif;fill:#dce6ee}
      .small{font:15px Arial,'Liberation Sans',sans-serif;fill:#52616b}
      .smallLight{font:15px Arial,'Liberation Sans',sans-serif;fill:#dce6ee}
      .tag{font:700 15px Arial,'Liberation Sans',sans-serif;fill:#17202a}
      .tagLight{font:700 15px Arial,'Liberation Sans',sans-serif;fill:#ffffff}
      .code{font:700 15px 'Liberation Mono',Consolas,monospace;fill:#17202a}
      .codeLight{font:700 15px 'Liberation Mono',Consolas,monospace;fill:#ffffff}
      .screen{mix-blend-mode:screen;opacity:.96}
      .ink{mix-blend-mode:multiply;opacity:.86}
      .outline{fill:none;stroke:#17202a;stroke-width:1.4;opacity:.55}
      .outlineLight{fill:none;stroke:#ffffff;stroke-width:1.4;opacity:.65}
      .box{fill:#ffffff;stroke:#c9d4dc;stroke-width:1.4}
      .boxDark{fill:#172331;stroke:#3c4d5d;stroke-width:1.4}
    </style>
    <linearGradient id="satBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfc4cb"/>
      <stop offset="1" stop-color="#2a66cc"/>
    </linearGradient>
    <linearGradient id="hslLight" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#111111"/>
      <stop offset=".5" stop-color="#2a66cc"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="hsvValue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="1" stop-color="#2a66cc"/>
    </linearGradient>
  </defs>

  <rect x="50" y="120" width="630" height="360" class="panelDark"/>
  <text x="86" y="164" class="hLight">RGB: mescla additiva de llum</text>
  <text x="86" y="196" class="pLight">Monitors, projectors, mobils i webs</text>
  <text x="86" y="222" class="pLight">sumen canals de llum emesa.</text>
  <text x="86" y="262" class="smallLight">R = red, G = green, B = blue.</text>
  <text x="86" y="286" class="smallLight">Els tres canals al maxim donen blanc.</text>
  <text x="86" y="340" class="smallLight">Exemple: <tspan class="codeLight">RGB(34,102,153)</tspan></text>
  <text x="86" y="364" class="smallLight">equival a <tspan class="codeLight">#226699</tspan>.</text>
  <text x="86" y="424" class="smallLight">Una mateixa paleta pot canviar segons</text>
  <text x="86" y="448" class="smallLight">pantalla, brillantor i perfil del dispositiu.</text>
  <g transform="translate(530 326) scale(.78)">
    <rect x="-148" y="-148" width="296" height="296" class="boxDark"/>
    <circle cx="-52" cy="28" r="74" fill="#ff2d2d" class="screen"/>
    <circle cx="52" cy="28" r="74" fill="#20d650" class="screen"/>
    <circle cx="0" cy="-64" r="74" fill="#1976ff" class="screen"/>
    <circle cx="-52" cy="28" r="74" class="outlineLight"/>
    <circle cx="52" cy="28" r="74" class="outlineLight"/>
    <circle cx="0" cy="-64" r="74" class="outlineLight"/>
    <circle cx="0" cy="-2" r="28" fill="#ffffff" stroke="#17202a" stroke-width="1.4"/>
    <text x="-122" y="118" class="tagLight">R</text>
    <text x="110" y="118" class="tagLight">G</text>
    <text x="-7" y="-126" class="tagLight">B</text>
    <text x="-23" y="3" class="tag">blanc</text>
  </g>

  <rect x="720" y="120" width="630" height="360" class="panel"/>
  <text x="756" y="164" class="h">CMYK: mescla subtractiva de tintes</text>
  <text x="756" y="196" class="p">Impressores i arts grafiques dipositen</text>
  <text x="756" y="222" class="p">tintes sobre un suport que reflecteix</text>
  <text x="756" y="246" class="p">la llum.</text>
  <text x="756" y="280" class="small">C, M i Y absorbeixen llum blanca.</text>
  <text x="756" y="304" class="small">El blanc es paper sense tinta.</text>
  <text x="756" y="344" class="small">K = <tspan class="code">Key</tspan>, la planxa clau.</text>
  <text x="756" y="368" class="small">Tinta negra per al text;</text>
  <text x="756" y="392" class="small">registre, detall i contrast.</text>
  <text x="756" y="442" class="small">La conversio depen de perfil,</text>
  <text x="756" y="464" class="small">paper, tinta i impressora.</text>
  <g transform="translate(1180 326) scale(.78)">
    <rect x="-168" y="-143" width="336" height="286" class="box"/>
    <circle cx="-58" cy="30" r="72" fill="#00aeef" class="ink"/>
    <circle cx="58" cy="30" r="72" fill="#ec008c" class="ink"/>
    <circle cx="0" cy="-64" r="72" fill="#fff200" class="ink"/>
    <circle cx="-58" cy="30" r="72" class="outline"/>
    <circle cx="58" cy="30" r="72" class="outline"/>
    <circle cx="0" cy="-64" r="72" class="outline"/>
    <circle cx="0" cy="-3" r="27" fill="#222222" opacity=".9"/>
    <text x="-132" y="116" class="tag">C</text>
    <text x="121" y="116" class="tag">M</text>
    <text x="-7" y="-125" class="tag">Y</text>
    <rect x="106" y="-105" width="46" height="46" fill="#151515"/>
    <text x="129" y="-75" text-anchor="middle" class="codeLight">K</text>
  </g>

  <rect x="50" y="520" width="390" height="320" class="panel"/>
  <text x="86" y="564" class="h">RYB</text>
  <text x="86" y="596" class="p">Roda tradicional de pintura</text>
  <text x="86" y="626" class="small">Ajuda a parlar d'harmonies artistiques.</text>
  <text x="86" y="650" class="small">No descriu be monitors ni impressio.</text>
  <g transform="translate(250 752)">
    <circle cx="-48" cy="24" r="52" fill="#e53935" opacity=".84"/>
    <circle cx="48" cy="24" r="52" fill="#fdd835" opacity=".84"/>
    <circle cx="0" cy="-46" r="52" fill="#1e88e5" opacity=".84"/>
    <circle cx="-48" cy="24" r="52" class="outline"/>
    <circle cx="48" cy="24" r="52" class="outline"/>
    <circle cx="0" cy="-46" r="52" class="outline"/>
  </g>

  <rect x="480" y="520" width="870" height="320" class="panel"/>
  <text x="516" y="564" class="h">HSL / HSV: controls per ajustar colors</text>
  <text x="516" y="596" class="p">No son dispositius: separen dimensions que un selector digital pot modificar.</text>
  <text x="516" y="632" class="small">H = <tspan class="code">hue</tspan>, el to situat com un angle de 0 a 360 graus.</text>
  <text x="516" y="656" class="small">S = <tspan class="code">saturation</tspan>, del gris cap a un color mes pur.</text>
  <text x="516" y="680" class="small">L = <tspan class="code">lightness</tspan> en HSL; V = <tspan class="code">value</tspan> en HSV.</text>
  <g transform="translate(637 758)">
    <path d="M0,-64 A64,64 0 0,1 32,-55 L0,0 Z" fill="#e53935"/>
    <path d="M32,-55 A64,64 0 0,1 55,-32 L0,0 Z" fill="#fb8c00"/>
    <path d="M55,-32 A64,64 0 0,1 64,0 L0,0 Z" fill="#fdd835"/>
    <path d="M64,0 A64,64 0 0,1 55,32 L0,0 Z" fill="#7cb342"/>
    <path d="M55,32 A64,64 0 0,1 32,55 L0,0 Z" fill="#43a047"/>
    <path d="M32,55 A64,64 0 0,1 0,64 L0,0 Z" fill="#00897b"/>
    <path d="M0,64 A64,64 0 0,1 -32,55 L0,0 Z" fill="#00acc1"/>
    <path d="M-32,55 A64,64 0 0,1 -55,32 L0,0 Z" fill="#039be5"/>
    <path d="M-55,32 A64,64 0 0,1 -64,0 L0,0 Z" fill="#3949ab"/>
    <path d="M-64,0 A64,64 0 0,1 -55,-32 L0,0 Z" fill="#5e35b1"/>
    <path d="M-55,-32 A64,64 0 0,1 -32,-55 L0,0 Z" fill="#8e24aa"/>
    <path d="M-32,-55 A64,64 0 0,1 0,-64 L0,0 Z" fill="#d81b60"/>
    <circle r="24" fill="#f7fafb" stroke="#ffffff" stroke-width="3"/>
    <line x1="0" y1="0" x2="46" y2="-46" stroke="#17202a" stroke-width="2.2"/>
    <text x="-48" y="75" class="tag">H = hue</text>
  </g>
  <g transform="translate(790 724)">
    <text x="0" y="-18" class="tag">S = saturation</text>
    <rect x="0" y="0" width="190" height="34" fill="url(#satBlue)" stroke="#8a9aa7"/>
    <text x="0" y="58" class="small">gris</text>
    <text x="132" y="58" class="small">color pur</text>
  </g>
  <g transform="translate(1040 704)">
    <text x="-18" y="-18" class="tag">L = lightness</text>
    <rect x="0" y="0" width="34" height="116" fill="url(#hslLight)" stroke="#8a9aa7"/>
    <text x="48" y="18" class="small">blanc</text>
    <text x="48" y="62" class="small">color</text>
    <text x="48" y="108" class="small">negre</text>
  </g>
  <g transform="translate(1230 704)">
    <text x="-12" y="-18" class="tag">V = value</text>
    <rect x="0" y="0" width="34" height="116" fill="url(#hsvValue)" stroke="#8a9aa7"/>
    <text x="-14" y="108" text-anchor="end" class="small">llum maxima</text>
  </g>

</svg>
