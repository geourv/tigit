<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="534" viewBox="62 113 1080 534" role="img" aria-labelledby="title desc">
  <title id="title">Paletes segons el tipus de dada</title>
  <desc id="desc">Quatre exemples de decisió cromàtica per a categories nominals, quantitats relatives, desviacions respecte d'un centre i llindars o accents.</desc>
  <defs>
    <style>
      .card { fill: #f7fafb; stroke: #cbd6dc; stroke-width: 1.4; }
      .h { font: 700 22px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .kind { font: 700 15px Arial, 'Liberation Sans', sans-serif; fill: #2f5f73; text-transform: uppercase; }
      .p { font: 15px Arial, 'Liberation Sans', sans-serif; fill: #40515c; }
      .label { font: 700 14px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .small { font: 13px Arial, 'Liberation Sans', sans-serif; fill: #52616b; }
      .axis { stroke: #8fa0aa; stroke-width: 1.4; }
      .shape { stroke: #ffffff; stroke-width: 2; }
      .outline { stroke: #8fa0aa; stroke-width: 1.2; fill: none; }
    </style>
  </defs>
  <rect x="64" y="115" width="510" height="250" class="card"/>
  <text x="94" y="153" class="kind">categoria nominal</text>
  <text x="94" y="182" class="h">Qualitativa</text>
  <text x="94" y="209" class="p">Separar tipus de recurs sense crear cap ordre.</text>
  <circle cx="105" cy="244" r="10" fill="#66c2a5"/>
  <text x="124" y="249" class="label">Allotjament</text>
  <circle cx="105" cy="276" r="10" fill="#fc8d62"/>
  <text x="124" y="281" class="label">Restauració</text>
  <circle cx="105" cy="308" r="10" fill="#8da0cb"/>
  <text x="124" y="313" class="label">Patrimoni</text>
  <circle cx="105" cy="340" r="10" fill="#e78ac3"/>
  <text x="124" y="345" class="label">Platja</text>
  <rect x="355" y="223" width="68" height="58" fill="#66c2a5" class="shape"/>
  <rect x="424" y="223" width="68" height="58" fill="#fc8d62" class="shape"/>
  <rect x="355" y="282" width="68" height="58" fill="#8da0cb" class="shape"/>
  <rect x="424" y="282" width="68" height="58" fill="#e78ac3" class="shape"/>
  <text x="424" y="354" text-anchor="middle" class="small">distingir, no ordenar</text>

  <rect x="606" y="115" width="510" height="250" class="card"/>
  <text x="636" y="153" class="kind">quantitat relativa</text>
  <text x="636" y="182" class="h">Seqüencial</text>
  <text x="636" y="209" class="p">Mostrar més o menys intensitat amb lluminositat.</text>
  <rect x="662" y="241" width="62" height="62" fill="#eff3ff" class="shape"/>
  <rect x="724" y="241" width="62" height="62" fill="#bdd7e7" class="shape"/>
  <rect x="786" y="241" width="62" height="62" fill="#6baed6" class="shape"/>
  <rect x="848" y="241" width="62" height="62" fill="#3182bd" class="shape"/>
  <rect x="910" y="241" width="62" height="62" fill="#08519c" class="shape"/>
  <rect x="662" y="241" width="310" height="62" class="outline"/>
  <line x1="662" y1="319" x2="972" y2="319" class="axis"/>
  <text x="662" y="340" text-anchor="middle" class="small">baix</text>
  <text x="817" y="340" text-anchor="middle" class="small">places / 1.000 hab.</text>
  <text x="972" y="340" text-anchor="middle" class="small">alt</text>

  <rect x="64" y="395" width="510" height="250" class="card"/>
  <text x="94" y="433" class="kind">respecte d'un centre</text>
  <text x="94" y="462" class="h">Divergent</text>
  <text x="94" y="489" class="p">Comparar desviacions a banda i banda d'una mitjana.</text>
  <rect x="118" y="529" width="54" height="54" fill="#b2182b" class="shape"/>
  <rect x="172" y="529" width="54" height="54" fill="#ef8a62" class="shape"/>
  <rect x="226" y="529" width="54" height="54" fill="#fddbc7" class="shape"/>
  <rect x="280" y="529" width="54" height="54" fill="#f7f7f7" class="shape"/>
  <rect x="334" y="529" width="54" height="54" fill="#d1e5f0" class="shape"/>
  <rect x="388" y="529" width="54" height="54" fill="#67a9cf" class="shape"/>
  <rect x="442" y="529" width="54" height="54" fill="#2166ac" class="shape"/>
  <line x1="307" y1="514" x2="307" y2="604" stroke="#17202a" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="145" y="618" text-anchor="middle" class="small">per sota</text>
  <text x="307" y="618" text-anchor="middle" class="small">mitjana</text>
  <text x="469" y="618" text-anchor="middle" class="small">per sobre</text>

  <rect x="606" y="395" width="510" height="250" class="card"/>
  <text x="636" y="433" class="kind">llindar o focus</text>
  <text x="636" y="462" class="h">Binària o accent</text>
  <text x="636" y="489" class="p">Destacar una condició definida i deixar la resta en segon pla.</text>
  <rect x="668" y="527" width="56" height="48" fill="#dce3e8" class="shape"/>
  <rect x="729" y="527" width="56" height="48" fill="#dce3e8" class="shape"/>
  <rect x="790" y="527" width="56" height="48" fill="#e4572e" class="shape"/>
  <rect x="851" y="527" width="56" height="48" fill="#dce3e8" class="shape"/>
  <rect x="912" y="527" width="56" height="48" fill="#dce3e8" class="shape"/>
  <rect x="668" y="580" width="56" height="32" fill="#dce3e8" class="shape"/>
  <rect x="729" y="580" width="56" height="32" fill="#dce3e8" class="shape"/>
  <rect x="790" y="580" width="56" height="32" fill="#dce3e8" class="shape"/>
  <rect x="851" y="580" width="56" height="32" fill="#e4572e" class="shape"/>
  <rect x="912" y="580" width="56" height="32" fill="#dce3e8" class="shape"/>
  <circle cx="981" cy="548" r="9" fill="#e4572e"/>
  <text x="998" y="553" class="label">supera el llindar</text>
  <circle cx="981" cy="588" r="9" fill="#dce3e8"/>
  <text x="998" y="593" class="label">resta de municipis</text>
  <text x="817" y="630" text-anchor="middle" class="small">el llindar ha de constar a la llegenda</text>

</svg>
