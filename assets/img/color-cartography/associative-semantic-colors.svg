<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="514" viewBox="60 118 1060 514" role="img" aria-labelledby="title desc">
  <title id="title">Colors associatius, semàntics i corporatius</title>
  <desc id="desc">Esquema que compara usos associatius del color, codis semàntics com semàfors i termòmetres, paletes institucionals i paletes temàtiques de dades.</desc>
  <defs>
    <style>
      .card { fill: #f7fafb; stroke: #cbd6dc; stroke-width: 1.4; }
      .h { font: 700 21px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .p { font: 15px Arial, 'Liberation Sans', sans-serif; fill: #40515c; }
      .tiny { font: 13px Arial, 'Liberation Sans', sans-serif; fill: #52616b; }
      .label { font: 700 14px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .white { font: 700 13px Arial, 'Liberation Sans', sans-serif; fill: #ffffff; }
      .stroke { stroke: #17202a; stroke-width: 1.2; opacity: .35; }
      .line { stroke: #8fa0aa; stroke-width: 1.5; }
    </style>
  </defs>
  <rect x="62" y="120" width="330" height="235" class="card"/>
  <text x="92" y="158" class="h">Associatiu</text>
  <text x="92" y="184" class="p">El color recorda un objecte o paisatge.</text>
  <rect x="95" y="215" width="70" height="72" fill="#4f9bd5"/>
  <path d="M106 259 C122 243, 139 276, 155 256" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <text x="130" y="309" text-anchor="middle" class="label">aigua</text>
  <rect x="190" y="215" width="70" height="72" fill="#6ab04c"/>
  <path d="M225 234 C205 245, 204 269, 225 276 C246 269, 246 245, 225 234 Z" fill="#dff0d8"/>
  <text x="225" y="309" text-anchor="middle" class="label">verd</text>
  <rect x="285" y="215" width="70" height="72" fill="#b8b2a6"/>
  <path d="M302 263 L338 227" stroke="#fff3c4" stroke-width="8" stroke-linecap="round"/>
  <text x="320" y="309" text-anchor="middle" class="label">sorra</text>
  <text x="92" y="335" class="tiny">Associació compartida, no jerarquia falsa.</text>

  <rect x="425" y="120" width="330" height="235" class="card"/>
  <text x="455" y="158" class="h">Semàntic</text>
  <text x="455" y="184" class="p">El color forma part d'un codi social.</text>
  <rect x="477" y="206" width="58" height="102" fill="#2c3e50"/>
  <circle cx="506" cy="230" r="13" fill="#d64541"/>
  <circle cx="506" cy="258" r="13" fill="#f6c445"/>
  <circle cx="506" cy="286" r="13" fill="#3fa35b"/>
  <rect x="595" y="208" width="44" height="92" fill="#eef3f6" stroke="#8fa0aa"/>
  <rect x="608" y="254" width="18" height="35" fill="#d64541"/>
  <circle cx="617" cy="298" r="17" fill="#d64541"/>
  <line x1="652" y1="294" x2="704" y2="224" stroke="#d64541" stroke-width="8" stroke-linecap="round"/>
  <text x="455" y="335" class="tiny">Un codi social no és una prova analítica.</text>

  <rect x="788" y="120" width="330" height="235" class="card"/>
  <text x="818" y="158" class="h">Identitat visual</text>
  <text x="818" y="184" class="p">La paleta identifica una institució</text>
  <text x="818" y="204" class="p">o esdeveniment.</text>
  <rect x="820" y="218" width="250" height="78" fill="#ffffff" stroke="#8fa0aa"/>
  <rect x="842" y="240" width="44" height="34" fill="#0072ce"/>
  <rect x="886" y="240" width="44" height="34" fill="#ffcd00"/>
  <rect x="930" y="240" width="44" height="34" fill="#e4002b"/>
  <rect x="974" y="240" width="44" height="34" fill="#009739"/>
  <text x="945" y="318" text-anchor="middle" class="label">paleta corporativa</text>
  <text x="818" y="335" class="tiny">No reassignar a classes quantitatives.</text>

  <rect x="62" y="395" width="330" height="235" class="card"/>
  <text x="92" y="433" class="h">Reciclatge i serveis</text>
  <text x="92" y="459" class="p">Els codis locals faciliten trobar categories.</text>
  <rect x="93" y="494" width="56" height="82" fill="#2f80ed"/>
  <rect x="168" y="494" width="56" height="82" fill="#f2c94c"/>
  <rect x="243" y="494" width="56" height="82" fill="#27ae60"/>
  <rect x="318" y="494" width="36" height="82" fill="#4f4f4f"/>
  <line x1="100" y1="506" x2="142" y2="506" class="line"/>
  <line x1="175" y1="506" x2="217" y2="506" class="line"/>
  <line x1="250" y1="506" x2="292" y2="506" class="line"/>
  <text x="92" y="610" class="tiny">Comprovar el codi local i el públic.</text>

  <rect x="425" y="395" width="330" height="235" class="card"/>
  <text x="455" y="433" class="h">Temàtic de dades</text>
  <text x="455" y="459" class="p">La paleta respon al tipus de variable.</text>
  <rect x="462" y="498" width="42" height="50" fill="#eff3ff" class="stroke"/>
  <rect x="504" y="498" width="42" height="50" fill="#bdd7e7" class="stroke"/>
  <rect x="546" y="498" width="42" height="50" fill="#6baed6" class="stroke"/>
  <rect x="588" y="498" width="42" height="50" fill="#3182bd" class="stroke"/>
  <rect x="630" y="498" width="42" height="50" fill="#08519c" class="stroke"/>
  <text x="567" y="571" text-anchor="middle" class="label">seqüencial</text>
  <text x="455" y="610" class="tiny">Un percentatge demana ordre perceptiu.</text>

  <rect x="788" y="395" width="330" height="235" class="card"/>
  <text x="818" y="433" class="h">Risc d'estereotip</text>
  <text x="818" y="459" class="p">Una associació pot ser ofensiva</text>
  <text x="818" y="479" class="p">o enganyosa.</text>
  <circle cx="877" cy="532" r="36" fill="#f7a8c8"/>
  <circle cx="954" cy="532" r="36" fill="#8ecae6"/>
  <line x1="840" y1="492" x2="992" y2="572" stroke="#d64541" stroke-width="8" stroke-linecap="round"/>
  <line x1="992" y1="492" x2="840" y2="572" stroke="#d64541" stroke-width="8" stroke-linecap="round"/>
  <text x="818" y="610" class="tiny">Revisar context, criteri i accessibilitat.</text>

</svg>
