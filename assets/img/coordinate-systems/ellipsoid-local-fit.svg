<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Ajust local i global d'el·lipsoides</title>
  <desc id="desc">Esquema conceptual amb dues superfícies continentals separades, un el·lipsoide global i dos el·lipsoides locals que s'ajusten millor a l'entorn d'Amèrica del Nord i d'Europa.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#">
      <cc:Work rdf:about="">
        <dc:title>Ajust local i global d'el·lipsoides</dc:title>
        <dc:creator>Manual TIGIT</dc:creator>
        <dc:description>Esquema vectorial propi inspirat en materials docents antics, sense reutilitzar el raster original.</dc:description>
        <dc:rights>Elaboració pròpia</dc:rights>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8403b"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#21757b"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <style>
      .label { font: 700 20px Arial, Helvetica, sans-serif; fill: #1f2937; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .small { font: 16px Arial, Helvetica, sans-serif; fill: #334155; }
      .tiny { font: 14px Arial, Helvetica, sans-serif; fill: #475569; }
      .legend { font: 15px Arial, Helvetica, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="960" height="520" fill="#fbfaf7"/>
  <rect x="48" y="42" width="864" height="412" rx="16" fill="#ffffff" stroke="#d6d3cb" filter="url(#soft-shadow)"/>

  <g transform="translate(0,8)">
    <ellipse cx="480" cy="284" rx="390" ry="216" fill="#eaf4f6" stroke="#334155" stroke-width="3"/>
    <ellipse cx="353" cy="252" rx="294" ry="182" transform="rotate(-5 353 252)" fill="none" stroke="#b8403b" stroke-width="4"/>
    <ellipse cx="624" cy="247" rx="303" ry="170" transform="rotate(5 624 247)" fill="none" stroke="#21757b" stroke-width="4"/>

    <path d="M 92 323
             C 94 286, 103 254, 115 222
             C 127 190, 125 160, 146 135
             C 162 116, 181 107, 193 90
             C 205 74, 224 72, 240 61
             C 256 50, 270 45, 289 45"
          fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
    <path d="M 673 48
             C 707 48, 730 62, 756 80
             C 778 96, 804 106, 826 128
             C 854 156, 871 194, 884 229
             C 895 258, 906 282, 910 309"
          fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/>

    <path d="M 96 318
             C 100 276, 111 231, 130 190
             C 151 146, 185 102, 236 70
             C 250 61, 266 55, 285 52"
          fill="none" stroke="#b8403b" stroke-width="10" stroke-linecap="round" opacity="0.22"/>
    <path d="M 674 54
             C 732 57, 791 93, 835 147
             C 872 192, 895 251, 905 305"
          fill="none" stroke="#21757b" stroke-width="10" stroke-linecap="round" opacity="0.22"/>

    <text class="label" x="78" y="98">Amèrica del Nord</text>
    <text class="small" x="120" y="206">el·lipsoide local</text>
    <text class="small" x="120" y="228">proper al relleu</text>

    <text class="label" x="806" y="106" text-anchor="middle">Europa</text>
    <text class="small" x="610" y="208">el·lipsoide local</text>
    <text class="small" x="610" y="230">proper al relleu</text>

    <text class="small" x="480" y="410" text-anchor="middle">el·lipsoide global: millor encaix mitjà del conjunt</text>
    <path d="M 480 389 C 492 361, 503 338, 520 314" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-slate)"/>

    <path d="M 174 438 h54" stroke="#b8403b" stroke-width="4"/>
    <text class="legend" x="240" y="443">ajust local d'Amèrica del Nord</text>
    <path d="M 520 438 h54" stroke="#21757b" stroke-width="4"/>
    <text class="legend" x="586" y="443">ajust local d'Europa</text>
  </g>

  <text class="tiny" x="480" y="486" text-anchor="middle">Esquema conceptual: formes, desplaçaments i separacions estan exagerats per fer visible l'encaix regional.</text>
</svg>
