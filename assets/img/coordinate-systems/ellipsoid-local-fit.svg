<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Ajust local i global d'el·lipsoides</title>
  <desc id="desc">Esquema conceptual amb un geoide exagerat, un el·lipsoide global i dos el·lipsoides locals que s'ajusten millor a Amèrica i Europa respectivament.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#">
      <cc:Work rdf:about="">
        <dc:title>Ajust local i global d'el·lipsoides</dc:title>
        <dc:creator>Manual TIGIT</dc:creator>
        <dc:description>Esquema vectorial propi inspirat en materials docents antics, sense reutilitzar el raster original.</dc:description>
        <dc:rights>Elaboració pròpia</dc:rights>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8403b"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#21757b"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <style>
      .label { font: 700 20px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .small { font: 16px Arial, Helvetica, sans-serif; fill: #334155; }
      .tiny { font: 14px Arial, Helvetica, sans-serif; fill: #475569; }
      .legend { font: 15px Arial, Helvetica, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="960" height="520" fill="#fbfaf7"/>
  <rect x="48" y="42" width="864" height="412" rx="18" fill="#ffffff" stroke="#d6d3cb" filter="url(#soft-shadow)"/>

  <g transform="translate(0,8)">
    <ellipse cx="480" cy="294" rx="386" ry="205" fill="#e8f3f6" stroke="#334155" stroke-width="3"/>
    <ellipse cx="365" cy="286" rx="326" ry="184" fill="none" stroke="#b8403b" stroke-width="4"/>
    <ellipse cx="594" cy="278" rx="322" ry="178" fill="none" stroke="#21757b" stroke-width="4"/>

    <path d="M 100 265
             C 128 210, 170 228, 206 188
             C 246 144, 288 178, 326 149
             C 388 102, 462 128, 518 125
             C 591 120, 638 188, 688 194
             C 740 200, 764 246, 808 233
             C 854 219, 868 270, 896 282"
          fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
    <path d="M 112 250 C 150 208, 183 224, 215 188 C 249 151, 288 177, 326 150"
          fill="none" stroke="#b8403b" stroke-width="10" stroke-linecap="round" opacity="0.28"/>
    <path d="M 642 182 C 679 202, 720 199, 755 224 C 783 243, 820 225, 851 238"
          fill="none" stroke="#21757b" stroke-width="10" stroke-linecap="round" opacity="0.28"/>

    <text class="label" x="130" y="112">Amèrica</text>
    <text class="label" x="744" y="122">Europa</text>
    <text class="small" x="138" y="138">ajust local proper</text>
    <text class="small" x="698" y="148">ajust local proper</text>

    <path d="M 236 143 C 252 165, 270 180, 294 190" fill="none" stroke="#b8403b" stroke-width="2.6" marker-end="url(#arrow-red)"/>
    <path d="M 725 156 C 710 176, 698 188, 682 195" fill="none" stroke="#21757b" stroke-width="2.6" marker-end="url(#arrow-teal)"/>

    <text class="tiny" x="470" y="92" text-anchor="middle">geoide o superfície física simplificada</text>
    <path d="M 471 99 C 485 111, 496 118, 514 125" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-slate)"/>

    <path d="M 172 406 h54" stroke="#b8403b" stroke-width="4"/>
    <text class="legend" x="238" y="411">el·lipsoide local d'Amèrica</text>
    <path d="M 172 433 h54" stroke="#21757b" stroke-width="4"/>
    <text class="legend" x="238" y="438">el·lipsoide local d'Europa</text>
    <path d="M 532 406 h54" stroke="#334155" stroke-width="4"/>
    <text class="legend" x="598" y="411">el·lipsoide global</text>
    <path d="M 532 433 h54" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
    <text class="legend" x="598" y="438">referència física exagerada</text>
  </g>

  <text class="tiny" x="480" y="486" text-anchor="middle">Esquema conceptual: formes, desplaçaments i separacions estan exagerats per fer visible l'encaix regional.</text>
</svg>
