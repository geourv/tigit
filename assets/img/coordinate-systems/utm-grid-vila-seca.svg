<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Lectura d'un reticle UTM local a Vila-seca</title>
  <desc id="desc">Zoom d'una quadrícula UTM d'un quilòmetre amb tres llocs de Vila-seca. L'equador no cap en el mapa local, però s'identifica com l'origen N igual a zero metres, uns 4.551 quilòmetres al sud.</desc>
  <defs>
    <style>
      .title { font: 700 28px system-ui, sans-serif; fill: #17202a; }
      .subtitle { font: 18px system-ui, sans-serif; fill: #52616b; }
      .axis { font: 700 17px ui-monospace, monospace; fill: #17202a; }
      .label { font: 700 18px system-ui, sans-serif; fill: #17202a; }
      .small { font: 16px system-ui, sans-serif; fill: #34495e; }
      .label-back { fill: #ffffff; fill-opacity: 0.94; stroke: #d5dde2; stroke-width: 1; }
      .major { stroke: #365b6d; stroke-width: 3; }
      .minor { stroke: #9fb4bd; stroke-width: 1.5; }
      .panel { fill: #fff6f1; stroke: #e0b8a6; stroke-width: 1.5; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#17697a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b64a32"/>
    </marker>
  </defs>

  <text x="35" y="43" class="title">Zoom local: reticle UTM d'1 km a Vila-seca</text>
  <text x="35" y="72" class="subtitle">Els valors N conserven l'origen llunyà de l'equador, encara que l'equador quedi fora del mapa.</text>

  <rect x="160" y="110" width="520" height="390" fill="#eef4f5" stroke="#365b6d" stroke-width="3"/>
  <line x1="420" y1="110" x2="420" y2="500" class="major"/>
  <line x1="160" y1="240" x2="680" y2="240" class="major"/>
  <line x1="160" y1="370" x2="680" y2="370" class="major"/>
  <line x1="290" y1="110" x2="290" y2="500" class="minor"/>
  <line x1="550" y1="110" x2="550" y2="500" class="minor"/>
  <line x1="160" y1="175" x2="680" y2="175" class="minor"/>
  <line x1="160" y1="305" x2="680" y2="305" class="minor"/>
  <line x1="160" y1="435" x2="680" y2="435" class="minor"/>

  <text x="160" y="528" text-anchor="middle" class="axis">E 344.000 m</text>
  <text x="420" y="528" text-anchor="middle" class="axis">E 345.000 m</text>
  <text x="680" y="528" text-anchor="middle" class="axis">E 346.000 m</text>
  <text x="145" y="506" text-anchor="end" class="axis">N 4.551.000 m</text>
  <text x="145" y="376" text-anchor="end" class="axis">N 4.552.000 m</text>
  <text x="145" y="246" text-anchor="end" class="axis">N 4.553.000 m</text>
  <text x="145" y="116" text-anchor="end" class="axis">N 4.554.000 m</text>

  <circle cx="282" cy="395" r="11" fill="#17697a" stroke="#fff" stroke-width="4"/>
  <circle cx="282" cy="221" r="11" fill="#b64a32" stroke="#fff" stroke-width="4"/>
  <circle cx="543" cy="452" r="11" fill="#7a5195" stroke="#fff" stroke-width="4"/>

  <line x1="282" y1="395" x2="696" y2="395" stroke="#17697a" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="282" y1="395" x2="282" y2="548" stroke="#17697a" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="694" y="355" width="184" height="82" rx="4" class="label-back"/>
  <text x="708" y="379" class="label">Facultat</text>
  <text x="708" y="403" class="axis">E 344.469</text>
  <text x="708" y="427" class="axis">N 4.551.807</text>

  <rect x="294" y="187" width="250" height="55" rx="4" class="label-back"/>
  <text x="304" y="210" class="label">Castell</text>
  <text x="304" y="233" class="small">E 344.469 · N 4.553.142</text>
  <rect x="300" y="399" width="230" height="56" rx="4" class="label-back"/>
  <text x="415" y="422" text-anchor="middle" class="label">Torre d'en Dolça</text>
  <text x="415" y="446" text-anchor="middle" class="small">E 345.474 · N 4.551.369</text>

  <rect x="700" y="108" width="178" height="166" rx="6" class="panel"/>
  <text x="718" y="139" class="label">Origen de N</text>
  <text x="718" y="169" class="axis">Equador = 0 m</text>
  <text x="718" y="198" class="small">Aquí: més de</text>
  <text x="718" y="224" class="axis">4.551 km</text>
  <text x="718" y="248" class="axis">al nord</text>
  <line x1="789" y1="274" x2="789" y2="310" stroke="#b64a32" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="789" y="333" text-anchor="middle" class="small">equador, fora del mapa</text>

  <line x1="220" y1="582" x2="390" y2="582" stroke="#17697a" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="305" y="614" text-anchor="middle" class="label">1. llegir cap a l'est (E)</text>
  <line x1="520" y1="600" x2="520" y2="545" stroke="#b64a32" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="672" y="586" text-anchor="middle" class="label">2. llegir cap al nord (N)</text>
</svg>
