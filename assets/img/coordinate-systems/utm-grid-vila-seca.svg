<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">Lectura d'un reticle UTM a Vila-seca</title>
  <desc id="desc">Quadrícula UTM d'un quilòmetre amb la Facultat de Turisme i Geografia, el Castell de Vila-seca i la Torre d'en Dolça. Les coordenades es llegeixen primer cap a l'est i després cap al nord.</desc>
  <defs>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #17202a; }
      .axis { font: 600 19px ui-monospace, monospace; fill: #17202a; }
      .label { font: 600 18px system-ui, sans-serif; fill: #17202a; }
      .small { font: 17px system-ui, sans-serif; fill: #34495e; }
      .major { stroke: #365b6d; stroke-width: 3; }
      .minor { stroke: #9fb4bd; stroke-width: 1.5; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16697a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d0523c"/>
    </marker>
  </defs>
  <rect width="920" height="620" fill="#fffdf8"/>
  <text x="460" y="46" text-anchor="middle" class="title">Reticle UTM local: primer E, després N</text>
  <text x="460" y="76" text-anchor="middle" class="small">Cada quadrat principal representa 1.000 m × 1.000 m</text>

  <rect x="160" y="110" width="520" height="390" fill="#eef4f5" stroke="#365b6d" stroke-width="3"/>
  <line x1="420" y1="110" x2="420" y2="500" class="major"/>
  <line x1="160" y1="240" x2="680" y2="240" class="major"/>
  <line x1="160" y1="370" x2="680" y2="370" class="major"/>
  <line x1="290" y1="110" x2="290" y2="500" class="minor"/>
  <line x1="550" y1="110" x2="550" y2="500" class="minor"/>
  <line x1="160" y1="175" x2="680" y2="175" class="minor"/>
  <line x1="160" y1="305" x2="680" y2="305" class="minor"/>
  <line x1="160" y1="435" x2="680" y2="435" class="minor"/>

  <text x="160" y="528" text-anchor="middle" class="axis">344.000 E</text>
  <text x="420" y="528" text-anchor="middle" class="axis">345.000 E</text>
  <text x="680" y="528" text-anchor="middle" class="axis">346.000 E</text>
  <text x="145" y="506" text-anchor="end" class="axis">4.551.000 N</text>
  <text x="145" y="376" text-anchor="end" class="axis">4.552.000 N</text>
  <text x="145" y="246" text-anchor="end" class="axis">4.553.000 N</text>
  <text x="145" y="116" text-anchor="end" class="axis">4.554.000 N</text>

  <circle cx="282" cy="395" r="11" fill="#16697a" stroke="#fff" stroke-width="4"/>
  <circle cx="282" cy="221" r="11" fill="#d0523c" stroke="#fff" stroke-width="4"/>
  <circle cx="543" cy="452" r="11" fill="#7a5195" stroke="#fff" stroke-width="4"/>

  <line x1="282" y1="395" x2="720" y2="395" stroke="#16697a" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="282" y1="395" x2="282" y2="560" stroke="#16697a" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="710" y="378" class="label">Facultat</text>
  <text x="710" y="402" class="axis">E 344.469</text>
  <text x="710" y="427" class="axis">N 4.551.807</text>

  <text x="301" y="210" class="label">Castell</text>
  <text x="301" y="232" class="small">E 344.469 · N 4.553.142</text>
  <text x="561" y="468" class="label">Torre d'en Dolça</text>
  <text x="561" y="490" class="small">E 345.474 · N 4.551.369</text>

  <line x1="220" y1="576" x2="390" y2="576" stroke="#16697a" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="305" y="606" text-anchor="middle" class="label">1. llegir cap a l'est (E)</text>
  <line x1="520" y1="590" x2="520" y2="535" stroke="#d0523c" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="650" y="575" text-anchor="middle" class="label">2. llegir cap al nord (N)</text>
</svg>
