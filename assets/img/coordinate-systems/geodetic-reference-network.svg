<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">De la xarxa geodèsica a un aixecament topogràfic local</title>
  <desc id="desc">A l'esquerra, cinc senyals geodèsics amb coordenades ajustades en un mateix marc formen una xarxa d'observacions. A la dreta, un equip topogràfic parteix d'un punt conegut i mesura elements locals. Una cadena inferior relaciona dàtum, marc, senyals i aixecament.</desc>
  <defs>
    <style>
      .panel { fill: #fbfcfd; stroke: #cbd6dc; stroke-width: 1.5; }
      .terrain { fill: #e4ecdf; stroke: #66805f; stroke-width: 2.5; }
      .network { stroke: #17697a; stroke-width: 2.3; stroke-dasharray: 8 6; }
      .survey { stroke: #a63d5a; stroke-width: 2.5; }
      .grid { stroke: #ced9de; stroke-width: 1; }
      .pillar { fill: #f7f8f8; stroke: #365b6d; stroke-width: 2; }
      .mark { fill: #d18a24; stroke: #fff; stroke-width: 2; }
      .title { font: 700 27px system-ui, sans-serif; fill: #17202a; }
      .panel-title { font: 700 21px system-ui, sans-serif; fill: #17202a; }
      .label { font: 700 16px system-ui, sans-serif; fill: #17202a; }
      .small { font: 15px system-ui, sans-serif; fill: #52616b; }
      .chain { font: 700 15px system-ui, sans-serif; fill: #24404a; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#365b6d"/>
    </marker>
  </defs>

  <text x="35" y="44" class="title">Del marc de referència al detall topogràfic</text>
  <text x="35" y="72" class="small">Les coordenades conegudes no són punts aïllats: formen una xarxa observada, ajustada i documentada.</text>

  <rect x="25" y="96" width="590" height="365" rx="7" class="panel"/>
  <text x="48" y="130" class="panel-title">1. Xarxa geodèsica</text>
  <text x="48" y="154" class="small">Punts observats i ajustats en un mateix marc.</text>
  <path d="M45 378 C105 347,145 362,205 283 C255 229,300 342,365 305 C425 269,443 217,492 194 C536 173,565 253,597 278 L597 437 L45 437 Z" class="terrain"/>

  <line x1="91" y1="347" x2="208" y2="278" class="network"/>
  <line x1="91" y1="347" x2="356" y2="301" class="network"/>
  <line x1="208" y1="278" x2="356" y2="301" class="network"/>
  <line x1="208" y1="278" x2="490" y2="191" class="network"/>
  <line x1="356" y1="301" x2="490" y2="191" class="network"/>
  <line x1="356" y1="301" x2="568" y2="264" class="network"/>
  <line x1="490" y1="191" x2="568" y2="264" class="network"/>

  <g transform="translate(77 328)">
    <path d="M0 18 L28 18 L24 2 L4 2 Z" class="pillar"/><rect x="10" y="-15" width="8" height="18" class="pillar"/><circle cx="14" cy="-16" r="5" class="mark"/>
  </g>
  <g transform="translate(194 259)">
    <path d="M0 18 L28 18 L24 2 L4 2 Z" class="pillar"/><rect x="10" y="-15" width="8" height="18" class="pillar"/><circle cx="14" cy="-16" r="5" class="mark"/>
  </g>
  <g transform="translate(342 282)">
    <path d="M0 18 L28 18 L24 2 L4 2 Z" class="pillar"/><rect x="10" y="-15" width="8" height="18" class="pillar"/><circle cx="14" cy="-16" r="5" class="mark"/>
  </g>
  <g transform="translate(476 172)">
    <path d="M0 18 L28 18 L24 2 L4 2 Z" class="pillar"/><rect x="10" y="-15" width="8" height="18" class="pillar"/><circle cx="14" cy="-16" r="5" class="mark"/>
    <path d="M14 -23 L5 -36 L23 -36 Z" fill="#17697a"/><line x1="14" y1="-36" x2="14" y2="-45" stroke="#17697a" stroke-width="2"/>
  </g>
  <g transform="translate(554 245)">
    <path d="M0 18 L28 18 L24 2 L4 2 Z" class="pillar"/><rect x="10" y="-15" width="8" height="18" class="pillar"/><circle cx="14" cy="-16" r="5" class="mark"/>
  </g>

  <text x="91" y="385" text-anchor="middle" class="label">A</text>
  <text x="208" y="315" text-anchor="middle" class="label">B</text>
  <text x="356" y="338" text-anchor="middle" class="label">C</text>
  <text x="490" y="229" text-anchor="middle" class="label">D · GNSS</text>
  <text x="568" y="301" text-anchor="middle" class="label">E</text>
  <rect x="165" y="390" width="330" height="48" rx="5" fill="#ffffff" stroke="#b8c8cf"/>
  <text x="330" y="411" text-anchor="middle" class="label">Coordenades ajustades conjuntament</text>
  <text x="330" y="431" text-anchor="middle" class="small">posició, altura, qualitat, data i estat del senyal</text>

  <rect x="635" y="96" width="340" height="365" rx="7" class="panel"/>
  <text x="658" y="130" class="panel-title">2. Aixecament local</text>
  <text x="658" y="154" class="small">Mesures locals enllaçades a punts coneguts.</text>
  <line x1="660" y1="420" x2="950" y2="420" stroke="#66805f" stroke-width="3"/>

  <g opacity="0.8">
    <line x1="820" y1="177" x2="820" y2="405" class="grid"/><line x1="870" y1="177" x2="870" y2="405" class="grid"/><line x1="920" y1="177" x2="920" y2="405" class="grid"/>
    <line x1="790" y1="215" x2="950" y2="215" class="grid"/><line x1="790" y1="265" x2="950" y2="265" class="grid"/><line x1="790" y1="315" x2="950" y2="315" class="grid"/><line x1="790" y1="365" x2="950" y2="365" class="grid"/>
  </g>

  <g transform="translate(666 399)">
    <path d="M0 18 L28 18 L24 2 L4 2 Z" class="pillar"/><rect x="10" y="-15" width="8" height="18" class="pillar"/><circle cx="14" cy="-16" r="5" class="mark"/>
  </g>
  <text x="650" y="445" text-anchor="start" class="label">punt conegut</text>

  <g transform="translate(726 332)">
    <line x1="14" y1="28" x2="0" y2="78" stroke="#365b6d" stroke-width="3"/><line x1="14" y1="28" x2="28" y2="78" stroke="#365b6d" stroke-width="3"/><line x1="14" y1="28" x2="14" y2="78" stroke="#365b6d" stroke-width="3"/>
    <rect x="2" y="12" width="24" height="18" rx="3" fill="#17697a" stroke="#365b6d" stroke-width="2"/><circle cx="14" cy="11" r="7" fill="#d18a24" stroke="#365b6d" stroke-width="2"/>
  </g>
  <text x="740" y="320" text-anchor="middle" class="label">estació total</text>

  <line x1="740" y1="343" x2="840" y2="286" class="survey"/>
  <line x1="740" y1="343" x2="900" y2="335" class="survey"/>
  <line x1="740" y1="343" x2="872" y2="398" class="survey"/>
  <circle cx="840" cy="286" r="6" class="mark"/><circle cx="900" cy="335" r="6" class="mark"/><circle cx="872" cy="398" r="6" class="mark"/>
  <path d="M816 250 L882 238 L924 292 L900 335 L840 286 Z" fill="#dce8ef" fill-opacity="0.75" stroke="#365b6d" stroke-width="2.5"/>
  <text x="872" y="225" text-anchor="middle" class="label">geometria detallada</text>
  <text x="872" y="445" text-anchor="middle" class="small">observacions locals</text>

  <rect x="25" y="485" width="950" height="55" rx="7" fill="#eaf2f3" stroke="#9eb9be"/>
  <text x="500" y="519" text-anchor="middle" class="chain">dàtum → marc de referència → xarxa materialitzada → observacions locals → mapa o capa georeferenciada</text>
</svg>
