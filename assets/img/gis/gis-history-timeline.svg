<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="395" viewBox="38 110 1140 395" role="img" aria-labelledby="title desc">
  <title id="title">Evolució dels sistemes d'informació geogràfica</title>
  <desc id="desc">Cronologia en sis etapes que relaciona anàlisi espacial, primers SIG, bases de dades, SIG d'escriptori, navegació per satèl·lit, web, programari lliure, mòbils i núvol.</desc>
  <defs>
    <style>
      .year { font: 700 19px Arial, sans-serif; fill: #ffffff; }
      .stage { font: 700 18px Arial, sans-serif; fill: #17202a; }
      .body { font: 15px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>
  <line x1="105" y1="230" x2="1095" y2="230" stroke="#365b6d" stroke-width="6" stroke-linecap="round"/>

  <g>
    <rect x="40" y="112" width="170" height="92" fill="#ffffff" stroke="#b8c7cc"/>
    <rect x="238" y="256" width="170" height="112" fill="#ffffff" stroke="#b8c7cc"/>
    <rect x="436" y="112" width="170" height="92" fill="#ffffff" stroke="#b8c7cc"/>
    <rect x="634" y="256" width="170" height="112" fill="#ffffff" stroke="#b8c7cc"/>
    <rect x="812" y="112" width="210" height="92" fill="#ffffff" stroke="#b8c7cc"/>
    <rect x="1015" y="256" width="160" height="112" fill="#ffffff" stroke="#b8c7cc"/>
  </g>

  <g>
    <circle cx="125" cy="230" r="34" fill="#b8403b"/>
    <text class="year" x="125" y="237" text-anchor="middle">1950s</text>
    <line x1="125" y1="196" x2="125" y2="204" stroke="#b8403b" stroke-width="4"/>
    <text class="stage" x="125" y="142" text-anchor="middle">Anàlisi espacial</text>
    <text class="body" x="125" y="168" text-anchor="middle">geografia quantitativa</text>
    <text class="body" x="125" y="188" text-anchor="middle">i primers ordinadors</text>

    <circle cx="323" cy="230" r="34" fill="#d47b36"/>
    <text class="year" x="323" y="237" text-anchor="middle">1960s</text>
    <line x1="323" y1="264" x2="323" y2="256" stroke="#d47b36" stroke-width="4"/>
    <text class="stage" x="323" y="286" text-anchor="middle">Primers SIG</text>
    <text class="body" x="323" y="312" text-anchor="middle">CGIS i inventaris</text>
    <text class="body" x="323" y="332" text-anchor="middle">territorials institucionals</text>

    <circle cx="521" cy="230" r="34" fill="#b79b34"/>
    <text class="year" x="521" y="237" text-anchor="middle">70-80</text>
    <line x1="521" y1="196" x2="521" y2="204" stroke="#b79b34" stroke-width="4"/>
    <text class="stage" x="521" y="142" text-anchor="middle">Dades i algoritmes</text>
    <text class="body" x="521" y="168" text-anchor="middle">bases de dades, ràster</text>
    <text class="body" x="521" y="188" text-anchor="middle">i anàlisi espacial</text>

    <circle cx="719" cy="230" r="34" fill="#37856f"/>
    <text class="year" x="719" y="237" text-anchor="middle">1990s</text>
    <line x1="719" y1="264" x2="719" y2="256" stroke="#37856f" stroke-width="4"/>
    <text class="stage" x="719" y="286" text-anchor="middle">SIG d'escriptori</text>
    <text class="body" x="719" y="312" text-anchor="middle">ordinadors personals,</text>
    <text class="body" x="719" y="332" text-anchor="middle">interfícies i nous sectors</text>

    <circle cx="917" cy="230" r="34" fill="#21757b"/>
    <text class="year" x="917" y="237" text-anchor="middle">2000s</text>
    <line x1="917" y1="196" x2="917" y2="204" stroke="#21757b" stroke-width="4"/>
    <text class="stage" x="917" y="142" text-anchor="middle">Web, GNSS i codi obert</text>
    <text class="body" x="917" y="168" text-anchor="middle">serveis interoperables,</text>
    <text class="body" x="917" y="188" text-anchor="middle">QGIS i dades distribuïdes</text>

    <circle cx="1095" cy="230" r="34" fill="#445f8a"/>
    <text class="year" x="1095" y="237" text-anchor="middle">Avui</text>
    <line x1="1095" y1="264" x2="1095" y2="256" stroke="#445f8a" stroke-width="4"/>
    <text class="stage" x="1095" y="286" text-anchor="middle">SIG connectats</text>
    <text class="body" x="1095" y="312" text-anchor="middle">mòbil, sensors,</text>
    <text class="body" x="1095" y="332" text-anchor="middle">núvol i temps real</text>
  </g>

  <rect x="170" y="425" width="860" height="78" fill="#eaf2f3" stroke="#9eb9be"/>
  <text class="stage" x="600" y="455" text-anchor="middle">Continuïtat metodològica</text>
  <text class="body" x="600" y="480" text-anchor="middle">formular una pregunta, documentar les dades, aplicar operacions adequades, validar i comunicar el resultat</text>
</svg>
