<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="865" viewBox="0 30 1000 865" role="img" aria-labelledby="title desc">
  <title id="title">Etapes en l'evolució dels sistemes d'informació geogràfica</title>
  <desc id="desc">Cronologia en set etapes àmplies: fonaments durant els anys cinquanta, primers SIG durant els seixanta, dades i algorismes entre els setanta i els vuitanta, SIG d'escriptori durant els noranta, web, GNSS i codi obert durant els dos mil, SIG connectats durant els anys deu i canvi cap a la intel·ligència artificial geoespacial des dels anys vint.</desc>
  <defs>
    <style>
      .period { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #ffffff; }
      .stage { font-family: Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #17202a; }
      .body { font-family: Arial, sans-serif; font-size: 23px; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78939b"/>
    </marker>
  </defs>

  <g fill="#ffffff" stroke="#b8c7cc" stroke-width="2">
    <rect x="20" y="65" width="300" height="220" rx="8"/>
    <rect x="350" y="65" width="300" height="220" rx="8"/>
    <rect x="680" y="65" width="300" height="220" rx="8"/>
    <rect x="680" y="365" width="300" height="220" rx="8"/>
    <rect x="350" y="365" width="300" height="220" rx="8"/>
    <rect x="20" y="365" width="300" height="220" rx="8"/>
    <rect x="350" y="665" width="300" height="220" rx="8"/>
  </g>

  <g stroke="#78939b" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <line x1="322" y1="175" x2="343" y2="175"/>
    <line x1="652" y1="175" x2="673" y2="175"/>
    <line x1="830" y1="287" x2="830" y2="357"/>
    <line x1="678" y1="475" x2="657" y2="475"/>
    <line x1="348" y1="475" x2="327" y2="475"/>
    <path d="M 170 587 L 170 625 L 500 625 L 500 657"/>
  </g>

  <g>
    <rect x="102" y="40" width="136" height="44" rx="22" fill="#b8403b"/>
    <text class="period" x="170" y="69" text-anchor="middle">1950–59</text>
    <text class="stage" x="170" y="122" text-anchor="middle">Fonaments</text>
    <text class="body" x="170" y="166" text-anchor="middle">geografia quantitativa,</text>
    <text class="body" x="170" y="199" text-anchor="middle">anàlisi espacial</text>
    <text class="body" x="170" y="232" text-anchor="middle">i primers ordinadors</text>

    <rect x="432" y="40" width="136" height="44" rx="22" fill="#d47b36"/>
    <text class="period" x="500" y="69" text-anchor="middle">1960–69</text>
    <text class="stage" x="500" y="122" text-anchor="middle">Primers SIG</text>
    <text class="body" x="500" y="166" text-anchor="middle">CGIS, SYMAP</text>
    <text class="body" x="500" y="199" text-anchor="middle">i inventaris territorials</text>
    <text class="body" x="500" y="232" text-anchor="middle">institucionals</text>

    <rect x="762" y="40" width="136" height="44" rx="22" fill="#b79b34"/>
    <text class="period" x="830" y="69" text-anchor="middle">1970–89</text>
    <text class="stage" x="830" y="112" text-anchor="middle">Dades</text>
    <text class="stage" x="830" y="142" text-anchor="middle">i algorismes</text>
    <text class="body" x="830" y="181" text-anchor="middle">bases de dades, ràster,</text>
    <text class="body" x="830" y="214" text-anchor="middle">teledetecció</text>
    <text class="body" x="830" y="247" text-anchor="middle">i anàlisi espacial</text>

    <rect x="762" y="340" width="136" height="44" rx="22" fill="#37856f"/>
    <text class="period" x="830" y="369" text-anchor="middle">1990–99</text>
    <text class="stage" x="830" y="412" text-anchor="middle">Escriptori</text>
    <text class="stage" x="830" y="442" text-anchor="middle">i usuaris</text>
    <text class="body" x="830" y="481" text-anchor="middle">ordinadors personals,</text>
    <text class="body" x="830" y="514" text-anchor="middle">interfícies gràfiques</text>
    <text class="body" x="830" y="547" text-anchor="middle">i nous sectors</text>

    <rect x="432" y="340" width="136" height="44" rx="22" fill="#21757b"/>
    <text class="period" x="500" y="369" text-anchor="middle">2000–09</text>
    <text class="stage" x="500" y="412" text-anchor="middle">Web, GNSS</text>
    <text class="stage" x="500" y="442" text-anchor="middle">i codi obert</text>
    <text class="body" x="500" y="481" text-anchor="middle">serveis interoperables,</text>
    <text class="body" x="500" y="514" text-anchor="middle">millora del GPS civil,</text>
    <text class="body" x="500" y="547" text-anchor="middle">QGIS i dades distribuïdes</text>

    <rect x="92" y="340" width="156" height="44" rx="22" fill="#445f8a"/>
    <text class="period" x="170" y="369" text-anchor="middle">2010–19</text>
    <text class="stage" x="170" y="422" text-anchor="middle">SIG connectats</text>
    <text class="body" x="170" y="466" text-anchor="middle">telèfons i sensors,</text>
    <text class="body" x="170" y="499" text-anchor="middle">dades obertes i núvol,</text>
    <text class="body" x="170" y="532" text-anchor="middle">serveis en temps real</text>

    <rect x="422" y="640" width="156" height="44" rx="22" fill="#66548c"/>
    <text class="period" x="500" y="669" text-anchor="middle">2020–avui</text>
    <text class="stage" x="500" y="712" text-anchor="middle">Cap a la IA</text>
    <text class="stage" x="500" y="742" text-anchor="middle">geoespacial</text>
    <text class="body" x="500" y="775" text-anchor="middle">models d'aprenentatge,</text>
    <text class="body" x="500" y="805" text-anchor="middle">assistents generatius,</text>
    <text class="body" x="500" y="835" text-anchor="middle">automatització,</text>
    <text class="body" x="500" y="865" text-anchor="middle">criteri i validació</text>
  </g>

</svg>
