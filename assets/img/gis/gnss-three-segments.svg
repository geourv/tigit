<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="810" height="546" viewBox="45 74 810 546" role="img" aria-labelledby="title desc">
  <title id="title">Segments espacial, de control i d'usuari d'un sistema GNSS</title>
  <desc id="desc">Tres satèl·lits emeten senyals unidireccionals cap al segment d'usuari. Les antenes del segment de control reben telemetria i seguiment dels satèl·lits i hi envien ordres i dades de navegació actualitzades. Els receptors, representats per un telèfon, reben els senyals passivament i estimen posició, velocitat i temps.</desc>
  <metadata>
    Els pictogrames satellite i satellite-dish s'han adaptat de Lucide Icons and Contributors, llicència ISC. El pictograma smartphone deriva de Feather, copyright 2013-present Cole Bemis, llicència MIT. Font: https://lucide.dev/. Els avisos complets es conserven a assets/licenses/lucide-icons.txt.
  </metadata>
  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #17202a; }
      .pill { font-family: Arial, sans-serif; font-size: 23px; font-weight: 700; fill: #ffffff; }
      .body { font-family: Arial, sans-serif; font-size: 24px; fill: #334155; }
      .small { font-family: Arial, sans-serif; font-size: 22px; fill: #334155; }
      .small-compact { font-family: Arial, sans-serif; font-size: 19px; fill: #334155; }
    </style>
    <marker id="signal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#21757b"/>
    </marker>
    <marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d47b36"/>
    </marker>
    <symbol id="icon-satellite" viewBox="0 0 24 24">
      <g fill="none" stroke="#445f8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m13.5 6.5-3.148-3.148a1.205 1.205 0 0 0-1.704 0L6.352 5.648a1.205 1.205 0 0 0 0 1.704L9.5 10.5"/>
        <path d="M16.5 7.5 19 5"/>
        <path d="m17.5 10.5 3.148 3.148a1.205 1.205 0 0 1 0 1.704l-2.296 2.296a1.205 1.205 0 0 1-1.704 0L13.5 14.5"/>
        <path d="M9 21a6 6 0 0 0-6-6"/>
        <path d="M9.352 10.648a1.205 1.205 0 0 0 0 1.704l2.296 2.296a1.205 1.205 0 0 0 1.704 0l4.296-4.296a1.205 1.205 0 0 0 0-1.704l-2.296-2.296a1.205 1.205 0 0 0-1.704 0z"/>
      </g>
    </symbol>
    <symbol id="icon-satellite-dish" viewBox="0 0 24 24">
      <g fill="none" stroke="#704f16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 10a7.31 7.31 0 0 0 10 10Z"/>
        <path d="m9 15 3-3"/>
        <path d="M17 13a6 6 0 0 0-6-6"/>
        <path d="M21 13A10 10 0 0 0 11 3"/>
      </g>
    </symbol>
    <symbol id="icon-smartphone" viewBox="0 0 24 24">
      <g fill="none" stroke="#17202a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
        <path d="M12 18h.01"/>
      </g>
    </symbol>
  </defs>

  <!-- Segment backgrounds are drawn before the links so arrowheads remain visible. -->
  <rect x="55" y="84" width="790" height="225" rx="10" fill="#f2f6fb" stroke="#9fb7d3" stroke-width="2"/>
  <rect x="75" y="100" width="275" height="42" rx="21" fill="#445f8a"/>
  <rect x="55" y="405" width="350" height="205" rx="10" fill="#fff8ed" stroke="#e1b274" stroke-width="2"/>
  <rect x="75" y="421" width="300" height="42" rx="21" fill="#d47b36"/>
  <rect x="495" y="405" width="350" height="205" rx="10" fill="#eef8f5" stroke="#83b8a7" stroke-width="2"/>
  <rect x="515" y="421" width="280" height="42" rx="21" fill="#37856f"/>

  <path d="M 235 286 L 560 397" fill="none" stroke="#21757b" stroke-width="5" marker-end="url(#signal-arrow)"/>
  <path d="M 450 286 L 650 397" fill="none" stroke="#21757b" stroke-width="5" marker-end="url(#signal-arrow)"/>
  <path d="M 665 286 L 740 397" fill="none" stroke="#21757b" stroke-width="5" marker-end="url(#signal-arrow)"/>
  <rect x="548" y="322" width="252" height="36" rx="7" fill="#f8fafc" fill-opacity="0.94"/>
  <text class="small-compact" x="674" y="347" text-anchor="middle" fill="#21757b">senyals GNSS de baixada</text>

  <path d="M 205 292 Q 130 330 115 397" fill="none" stroke="#d47b36" stroke-width="5" marker-end="url(#control-arrow)"/>
  <path d="M 285 397 Q 330 330 255 292" fill="none" stroke="#d47b36" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#control-arrow)"/>
  <text class="small-compact" x="113" y="345" text-anchor="middle" fill="#a85f25">telemetria</text>
  <text class="small-compact" x="330" y="363" text-anchor="middle" fill="#a85f25">ordres</text>

  <text class="pill" x="212.5" y="130" text-anchor="middle">1. Segment espacial</text>
  <text class="body" x="450" y="169" text-anchor="middle">Satèl·lits amb òrbites i rellotges controlats</text>
  <text class="body" x="450" y="197" text-anchor="middle">emeten dades de posició orbital i temps.</text>
  <circle cx="225" cy="255" r="43" fill="#ffffff" stroke="#9fb7d3" stroke-width="2"/>
  <circle cx="450" cy="255" r="43" fill="#ffffff" stroke="#9fb7d3" stroke-width="2"/>
  <circle cx="675" cy="255" r="43" fill="#ffffff" stroke="#9fb7d3" stroke-width="2"/>
  <use href="#icon-satellite" xlink:href="#icon-satellite" x="190" y="220" width="70" height="70"/>
  <use href="#icon-satellite" xlink:href="#icon-satellite" x="415" y="220" width="70" height="70"/>
  <use href="#icon-satellite" xlink:href="#icon-satellite" x="640" y="220" width="70" height="70"/>

  <text class="pill" x="225" y="451" text-anchor="middle">2. Segment de control</text>
  <use href="#icon-satellite-dish" xlink:href="#icon-satellite-dish" x="75" y="495" width="72" height="72"/>
  <use href="#icon-satellite-dish" xlink:href="#icon-satellite-dish" x="135" y="520" width="54" height="54"/>
  <text class="small-compact" x="292" y="500" text-anchor="middle">Reben telemetria,</text>
  <text class="small-compact" x="292" y="525" text-anchor="middle">segueixen òrbites</text>
  <text class="small-compact" x="292" y="550" text-anchor="middle">i rellotges,</text>
  <text class="small-compact" x="292" y="575" text-anchor="middle">envien ordres i navegació.</text>

  <text class="pill" x="655" y="451" text-anchor="middle">3. Segment d'usuari</text>
  <use href="#icon-smartphone" xlink:href="#icon-smartphone" x="535" y="485" width="78" height="98"/>
  <circle cx="574" cy="529" r="12" fill="#21757b"/>
  <circle cx="574" cy="529" r="4" fill="#ffffff"/>
  <text class="small" x="730" y="507" text-anchor="middle">Receptors passius</text>
  <text class="small" x="730" y="539" text-anchor="middle">estimen posició,</text>
  <text class="small" x="730" y="571" text-anchor="middle">velocitat i temps.</text>

</svg>
