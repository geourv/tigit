<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">Quatre observacions GNSS per estimar una posició tridimensional</title>
  <desc id="desc">Quatre satèl·lits envien senyals a un receptor. Cada temps de propagació permet calcular una pseudodistància. El receptor resol quatre incògnites: les coordenades x, y i z i el desajust del seu rellotge. Més satèl·lits aporten redundància i poden millorar la geometria de la solució.</desc>
  <defs>
    <style>
      .heading { font-family: Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #17202a; }
      .label { font-family: Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #17202a; }
      .body { font-family: Arial, sans-serif; font-size: 24px; fill: #334155; }
      .small { font-family: Arial, sans-serif; font-size: 22px; fill: #334155; }
      .signal { fill: none; stroke-width: 5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
    <g id="satellite">
      <rect x="-22" y="-18" width="44" height="36" rx="5" fill="#e6a534" stroke="#704f16" stroke-width="3"/>
      <rect x="-68" y="-15" width="39" height="30" fill="#445f8a" stroke="#263a60" stroke-width="3"/>
      <rect x="29" y="-15" width="39" height="30" fill="#445f8a" stroke="#263a60" stroke-width="3"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    </g>
  </defs>

  <rect x="18" y="18" width="864" height="684" rx="12" fill="#ffffff" stroke="#b8c7cc" stroke-width="2"/>
  <text class="heading" x="450" y="55" text-anchor="middle">Quatre observacions per a una posició 3D</text>

  <use href="#satellite" transform="translate(125 185) rotate(-12)"/>
  <use href="#satellite" transform="translate(350 142) rotate(-4)"/>
  <use href="#satellite" transform="translate(570 142) rotate(4)"/>
  <use href="#satellite" transform="translate(790 185) rotate(12)"/>
  <text class="label" x="125" y="137" text-anchor="middle">S1</text>
  <text class="label" x="350" y="100" text-anchor="middle">S2</text>
  <text class="label" x="570" y="100" text-anchor="middle">S3</text>
  <text class="label" x="790" y="137" text-anchor="middle">S4</text>

  <path class="signal" d="M 145 215 L 425 433" stroke="#b8403b" marker-end="url(#arrow)"/>
  <path class="signal" d="M 365 172 L 440 425" stroke="#d47b36" marker-end="url(#arrow)"/>
  <path class="signal" d="M 555 172 L 460 425" stroke="#37856f" marker-end="url(#arrow)"/>
  <path class="signal" d="M 770 215 L 475 433" stroke="#445f8a" marker-end="url(#arrow)"/>
  <rect x="260" y="250" width="380" height="88" rx="10" fill="#eef5f7" stroke="#9eb9be" stroke-width="2"/>
  <text class="body" x="450" y="265" text-anchor="middle">temps de propagació</text>
  <text class="label" x="450" y="299" text-anchor="middle">× velocitat de la llum</text>

  <rect x="415" y="420" width="70" height="118" rx="10" fill="#ffffff" stroke="#17202a" stroke-width="6"/>
  <circle cx="450" cy="518" r="7" fill="#17202a"/>
  <circle cx="450" cy="470" r="19" fill="#21757b"/>
  <circle cx="450" cy="470" r="7" fill="#ffffff"/>
  <text class="label" x="450" y="570" text-anchor="middle">Receptor</text>

  <rect x="64" y="590" width="365" height="88" rx="10" fill="#fff8ed" stroke="#e1b274" stroke-width="2"/>
  <text class="label" x="246.5" y="625" text-anchor="middle">Quatre incògnites</text>
  <text class="small" x="246.5" y="650" text-anchor="middle">posició x, y, z</text>
  <text class="small" x="246.5" y="675" text-anchor="middle">+ desajust del rellotge Δt</text>

  <rect x="471" y="590" width="365" height="88" rx="10" fill="#eef8f5" stroke="#83b8a7" stroke-width="2"/>
  <text class="label" x="653.5" y="625" text-anchor="middle">Més de quatre satèl·lits</text>
  <text class="small" x="653.5" y="650" text-anchor="middle">redundància</text>
  <text class="small" x="653.5" y="675" text-anchor="middle">i geometria més favorable</text>
</svg>
