<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="821" height="618" viewBox="47 78 821 618" role="img" aria-labelledby="title desc">
  <title id="title">Quatre observacions GNSS per estimar una posició tridimensional</title>
  <desc id="desc">Quatre satèl·lits envien senyals a un receptor. Cada temps de propagació permet calcular una pseudodistància. El receptor resol quatre incògnites: les coordenades x, y i z i el desajust del seu rellotge. Més satèl·lits aporten redundància i poden millorar la geometria de la solució.</desc>
  <metadata>
    Els pictogrames satellite i smartphone s'han adaptat de Lucide. Els avisos de les llicències ISC i MIT es conserven a assets/licenses/lucide-icons.txt.
  </metadata>
  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #17202a; }
      .body { font-family: Arial, sans-serif; font-size: 24px; fill: #334155; }
      .small { font-family: Arial, sans-serif; font-size: 22px; fill: #334155; }
      .signal { fill: none; stroke-width: 5; }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8403b"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d47b36"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37856f"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#445f8a"/>
    </marker>
    <symbol id="icon-satellite" viewBox="0 0 24 24">
      <g fill="none" stroke="#445f8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m13.5 6.5-3.148-3.148a1.205 1.205 0 0 0-1.704 0L6.352 5.648a1.205 1.205 0 0 0 0 1.704L9.5 10.5"/>
        <path d="M16.5 7.5 19 5"/>
        <path d="m17.5 10.5 3.148 3.148a1.205 1.205 0 0 1 0 1.704l-2.296 2.296a1.205 1.205 0 0 1-1.704 0L13.5 14.5"/>
        <path d="M9 21a6 6 0 0 0-6-6"/>
        <path d="M9.352 10.648a1.205 1.205 0 0 0 0 1.704l2.296 2.296a1.205 1.205 0 0 0 1.704 0l4.296-4.296a1.205 1.205 0 0 0 0-1.704l-2.296-2.296a1.205 1.205 0 0 0-1.704 0z"/>
      </g>
    </symbol>
    <symbol id="icon-smartphone" viewBox="0 0 24 24">
      <g fill="none" stroke="#17202a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
        <path d="M12 18h.01"/>
      </g>
    </symbol>
  </defs>

  <circle cx="125" cy="185" r="42" fill="#f8fafc" stroke="#9fb7d3" stroke-width="2"/>
  <circle cx="350" cy="142" r="42" fill="#f8fafc" stroke="#9fb7d3" stroke-width="2"/>
  <circle cx="570" cy="142" r="42" fill="#f8fafc" stroke="#9fb7d3" stroke-width="2"/>
  <circle cx="790" cy="185" r="42" fill="#f8fafc" stroke="#9fb7d3" stroke-width="2"/>
  <use href="#icon-satellite" xlink:href="#icon-satellite" x="90" y="150" width="70" height="70"/>
  <use href="#icon-satellite" xlink:href="#icon-satellite" x="315" y="107" width="70" height="70"/>
  <use href="#icon-satellite" xlink:href="#icon-satellite" x="535" y="107" width="70" height="70"/>
  <use href="#icon-satellite" xlink:href="#icon-satellite" x="755" y="150" width="70" height="70"/>
  <text class="label" x="125" y="137" text-anchor="middle">S1</text>
  <text class="label" x="350" y="100" text-anchor="middle">S2</text>
  <text class="label" x="570" y="100" text-anchor="middle">S3</text>
  <text class="label" x="790" y="137" text-anchor="middle">S4</text>

  <path class="signal" d="M 145 215 L 425 410" stroke="#b8403b" marker-end="url(#arrow-red)"/>
  <path class="signal" d="M 365 172 L 440 410" stroke="#d47b36" marker-end="url(#arrow-orange)"/>
  <path class="signal" d="M 555 172 L 460 410" stroke="#37856f" marker-end="url(#arrow-green)"/>
  <path class="signal" d="M 770 215 L 475 410" stroke="#445f8a" marker-end="url(#arrow-blue)"/>
  <rect x="260" y="250" width="380" height="88" rx="10" fill="#eef5f7" stroke="#9eb9be" stroke-width="2"/>
  <text class="body" x="450" y="284" text-anchor="middle">temps de propagació</text>
  <text class="label" x="450" y="319" text-anchor="middle">× velocitat de la llum</text>

  <use href="#icon-smartphone" xlink:href="#icon-smartphone" x="405" y="420" width="90" height="118"/>
  <circle cx="450" cy="470" r="19" fill="#21757b"/>
  <circle cx="450" cy="470" r="7" fill="#ffffff"/>
  <text class="label" x="450" y="570" text-anchor="middle">Receptor</text>

  <rect x="64" y="590" width="365" height="88" rx="10" fill="#fff8ed" stroke="#e1b274" stroke-width="2"/>
  <text class="label" x="246.5" y="619" text-anchor="middle">Quatre incògnites</text>
  <text class="small" x="246.5" y="646" text-anchor="middle">posició x, y, z</text>
  <text class="small" x="246.5" y="670" text-anchor="middle">+ desajust del rellotge Δt</text>

  <rect x="471" y="590" width="365" height="88" rx="10" fill="#eef8f5" stroke="#83b8a7" stroke-width="2"/>
  <text class="label" x="653.5" y="619" text-anchor="middle">Més de quatre satèl·lits</text>
  <text class="small" x="653.5" y="646" text-anchor="middle">redundància</text>
  <text class="small" x="653.5" y="670" text-anchor="middle">i geometria més favorable</text>
</svg>
