<svg xmlns="http://www.w3.org/2000/svg" width="1124" height="675" viewBox="38 116 1124 675" role="img" aria-labelledby="title desc">
  <title id="title">El posicionament combina senyals, sensors i models</title>
  <desc id="desc">Tres famílies d'observacions convergeixen en una solució de posicionament. Els senyals de ràdio inclouen GNSS, telefonia, Wi-Fi, Bluetooth i UWB. Els sensors inclouen acceleròmetres, giroscopis, odometria, magnetòmetres i baròmetres. L'entorn i els models inclouen visió, LiDAR, acústica, ajust a mapes i punts de control. La fusió produeix una posició amb incertesa i sistema de referència.</desc>
  <defs>
    <style>
      .card-title { font-family: Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #ffffff; }
      .item-title { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #17202a; }
      .body { font-family: Arial, sans-serif; font-size: 19px; fill: #40515b; }
      .note { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .fusion-title { font-family: Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #17202a; }
      .fusion-body { font-family: Arial, sans-serif; font-size: 20px; fill: #40515b; }
      .output { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #ffffff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#637983"/>
    </marker>
  </defs>

  <g aria-label="Senyals de ràdio">
    <rect x="48" y="126" width="340" height="414" rx="14" fill="#eef8f5" stroke="#83b8a7" stroke-width="2"/>
    <path d="M48 140 Q48 126 62 126 H374 Q388 126 388 140 V190 H48 Z" fill="#21757b"/>
    <text class="card-title" x="218" y="169" text-anchor="middle">Senyals de ràdio</text>

    <circle cx="86" cy="234" r="19" fill="#d7ece7" stroke="#21757b" stroke-width="3"/>
    <path d="M75 237 Q86 225 97 237 M69 229 Q86 211 103 229" fill="none" stroke="#21757b" stroke-width="3" stroke-linecap="round"/>
    <text class="item-title" x="120" y="229">GNSS</text>
    <text class="body" x="120" y="247">GPS, Galileo, GLONASS</text>
    <text class="body" x="120" y="270">i BeiDou</text>

    <circle cx="86" cy="316" r="19" fill="#d7ece7" stroke="#21757b" stroke-width="3"/>
    <rect x="79" y="305" width="14" height="23" rx="2" fill="none" stroke="#21757b" stroke-width="3"/>
    <path d="M99 309 Q109 316 99 323 M104 304 Q120 316 104 328" fill="none" stroke="#21757b" stroke-width="3" stroke-linecap="round"/>
    <text class="item-title" x="120" y="311">Xarxes</text>
    <text class="body" x="120" y="337">Telefonia i punts d'accés Wi-Fi</text>

    <circle cx="86" cy="398" r="19" fill="#d7ece7" stroke="#21757b" stroke-width="3"/>
    <path d="M86 384 V412 M86 384 L97 394 L86 402 L97 412 M86 394 L76 402 L86 408" fill="none" stroke="#21757b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="item-title" x="120" y="393">Balises locals</text>
    <text class="body" x="120" y="419">Bluetooth i ancoratges UWB</text>

    <rect x="70" y="464" width="296" height="52" rx="10" fill="#d7ece7"/>
    <text class="note" x="218" y="486" text-anchor="middle" fill="#165d67">Emissors i propagació coneguts</text>
    <text class="body" x="218" y="507" text-anchor="middle">Cobertura global, de xarxa o local</text>
  </g>

  <g aria-label="Sensors i moviment">
    <rect x="430" y="126" width="340" height="414" rx="14" fill="#f2f6fb" stroke="#9fb7d3" stroke-width="2"/>
    <path d="M430 140 Q430 126 444 126 H756 Q770 126 770 140 V190 H430 Z" fill="#445f8a"/>
    <text class="card-title" x="600" y="169" text-anchor="middle">Sensors i moviment</text>

    <circle cx="468" cy="234" r="19" fill="#dfe8f3" stroke="#445f8a" stroke-width="3"/>
    <path d="M468 218 V250 M452 234 H484 M456 222 L480 246 M480 222 L456 246" stroke="#445f8a" stroke-width="3" stroke-linecap="round"/>
    <text class="item-title" x="502" y="229">Sensors inercials</text>
    <text class="body" x="502" y="255">Acceleròmetre i giroscopi</text>

    <circle cx="468" cy="316" r="19" fill="#dfe8f3" stroke="#445f8a" stroke-width="3"/>
    <circle cx="468" cy="316" r="10" fill="none" stroke="#445f8a" stroke-width="3"/>
    <circle cx="468" cy="316" r="3" fill="#445f8a"/>
    <text class="item-title" x="502" y="311">Odometria</text>
    <text class="body" x="502" y="337">Rodes, passos, velocitat i gir</text>

    <circle cx="468" cy="398" r="19" fill="#dfe8f3" stroke="#445f8a" stroke-width="3"/>
    <path d="M468 382 L474 398 L468 414 L462 398 Z" fill="#445f8a"/>
    <circle cx="468" cy="398" r="14" fill="none" stroke="#445f8a" stroke-width="2"/>
    <text class="item-title" x="502" y="393">Orientació i altura</text>
    <text class="body" x="502" y="419">Magnetòmetre i baròmetre</text>

    <rect x="452" y="464" width="296" height="52" rx="10" fill="#dfe8f3"/>
    <text class="note" x="600" y="486" text-anchor="middle" fill="#354d73">No necessiten cap senyal de ràdio</text>
    <text class="body" x="600" y="507" text-anchor="middle">La deriva s'acumula amb el temps</text>
  </g>

  <g aria-label="Entorn i models">
    <rect x="812" y="126" width="340" height="414" rx="14" fill="#fff8ed" stroke="#e1b274" stroke-width="2"/>
    <path d="M812 140 Q812 126 826 126 H1138 Q1152 126 1152 140 V190 H812 Z" fill="#d47b36"/>
    <text class="card-title" x="982" y="169" text-anchor="middle">Entorn i models</text>

    <circle cx="850" cy="234" r="19" fill="#fae8d2" stroke="#d47b36" stroke-width="3"/>
    <rect x="838" y="226" width="24" height="17" rx="3" fill="none" stroke="#d47b36" stroke-width="3"/>
    <circle cx="850" cy="234.5" r="5" fill="none" stroke="#d47b36" stroke-width="3"/>
    <text class="item-title" x="884" y="229">Visió</text>
    <text class="body" x="884" y="255">Càmeres i fites conegudes</text>

    <circle cx="850" cy="316" r="19" fill="#fae8d2" stroke="#d47b36" stroke-width="3"/>
    <path d="M837 316 Q843 305 849 316 T861 316 M837 324 Q843 313 849 324 T861 324" fill="none" stroke="#d47b36" stroke-width="3" stroke-linecap="round"/>
    <text class="item-title" x="884" y="311">Llum o acústica</text>
    <text class="body" x="884" y="337">LiDAR, so i ultrasons</text>

    <circle cx="850" cy="398" r="19" fill="#fae8d2" stroke="#d47b36" stroke-width="3"/>
    <path d="M838 389 L846 386 L854 390 L862 386 V407 L854 411 L846 407 L838 411 Z" fill="none" stroke="#d47b36" stroke-width="3" stroke-linejoin="round"/>
    <text class="item-title" x="884" y="393">Restriccions espacials</text>
    <text class="body" x="884" y="419">Mapes, xarxes i control</text>

    <rect x="834" y="464" width="296" height="52" rx="10" fill="#fae8d2"/>
    <text class="note" x="982" y="486" text-anchor="middle" fill="#a85f25">Observacions i referències locals</text>
    <text class="body" x="982" y="507" text-anchor="middle">El model limita solucions possibles</text>
  </g>

  <path d="M218 541 C218 580 390 577 468 611" fill="none" stroke="#637983" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 541 V604" fill="none" stroke="#637983" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M982 541 C982 580 810 577 732 611" fill="none" stroke="#637983" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="242" y="608" width="716" height="104" rx="16" fill="#edf3f4" stroke="#9eb9be" stroke-width="2"/>
  <text class="fusion-title" x="600" y="646" text-anchor="middle">Fusió d'observacions</text>
  <text class="fusion-body" x="600" y="677" text-anchor="middle">Combina disponibilitat, qualitat, consum i context; no elimina els errors.</text>
  <rect x="362" y="733" width="476" height="48" rx="24" fill="#315d70"/>
  <text class="output" x="600" y="765" text-anchor="middle">Posició + incertesa + sistema de referència</text>
</svg>
