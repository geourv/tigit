<svg xmlns="http://www.w3.org/2000/svg" width="641" height="344" viewBox="56 114 641 344" role="img" aria-labelledby="title desc">
  <title id="title">Coropleta problemàtica construïda amb recomptes absoluts</title>
  <desc id="desc">Mapa esquemàtic de municipis on una coropleta pinta recompte absolut de places turístiques, sense denominador i amb absència de dades confosa amb valor baix.</desc>
