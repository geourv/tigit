    </pattern>
    <style>
      .panel{fill:#fff;stroke:#d8d2c5;stroke-width:1.5}.sea{fill:#dcecf3}.muni{stroke:#fffdf8;stroke-width:4;stroke-linejoin:round}.txt{font-family:Arial,Helvetica,sans-serif;fill:#2b2b2b}.small{font-size:14px}.label{font-size:13px;fill:#555}.c1{fill:#f6eadf}.c2{fill:#efc7a1}.c3{fill:#da874d}.c4{fill:#9d3b26}.nodata{fill:#f6eadf}.outline{fill:none;stroke:#6e6e6e;stroke-width:1.3}
    </style>
  </defs>
  <g transform="translate(58 116)">
