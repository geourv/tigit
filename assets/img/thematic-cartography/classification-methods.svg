<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="980" viewBox="0 0 1180 980" role="img" aria-labelledby="title desc">
  <title id="title">Cinc maneres de tallar una distribució en classes</title>
  <desc id="desc">Comparació entre intervals iguals, quantils, intervals arrodonits, desviacions estàndard i trencaments naturals sobre una mateixa distribució de valors municipals.</desc>
  <defs>
    <style>
      .bg { fill: #fffdf8; }
      .panel { fill: #ffffff; stroke: #d5dde2; stroke-width: 1.6; rx: 18; }
      .title { font: 700 31px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .subtitle { font: 16px Arial, 'Liberation Sans', sans-serif; fill: #52616b; }
      .label { font: 700 19px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .small { font: 15px Arial, 'Liberation Sans', sans-serif; fill: #52616b; }
      .formula { font: 700 18px 'Liberation Serif', Georgia, serif; fill: #17202a; }
      .axis { stroke: #87949a; stroke-width: 2; }
      .cut { stroke: #d0523c; stroke-width: 3; stroke-dasharray: 7 6; }
      .center { stroke: #6f7780; stroke-width: 3; }
      .dot { fill: #16697a; opacity: .85; }
      .range1 { fill: #e9f2f7; }
      .range2 { fill: #cfe3ea; }
      .range3 { fill: #8fbdd0; }
      .range4 { fill: #16697a; opacity: .82; }
      .range5 { fill: #0e4f5d; opacity: .88; }
    </style>
  </defs>
  <rect class="bg" width="1180" height="980"/>
  <text x="590" y="48" text-anchor="middle" class="title">Classificar és decidir què es considera semblant</text>
  <text x="590" y="78" text-anchor="middle" class="subtitle">Els mateixos valors produeixen lectures diferents quan canvien els punts de tall.</text>

  <g transform="translate(70 115)">
    <rect class="panel" width="1040" height="145"/>
    <text x="30" y="36" class="label">Intervals iguals</text>
    <text x="30" y="62" class="small">tots els rangs numèrics tenen la mateixa amplitud</text>
    <rect x="300" y="82" width="160" height="28" class="range1"/><rect x="460" y="82" width="160" height="28" class="range2"/><rect x="620" y="82" width="160" height="28" class="range3"/><rect x="780" y="82" width="160" height="28" class="range4"/>
    <line x1="300" y1="110" x2="940" y2="110" class="axis"/>
    <g class="dot"><circle cx="310" cy="110" r="5"/><circle cx="334" cy="110" r="5"/><circle cx="352" cy="110" r="5"/><circle cx="375" cy="110" r="5"/><circle cx="405" cy="110" r="5"/><circle cx="430" cy="110" r="5"/><circle cx="476" cy="110" r="5"/><circle cx="518" cy="110" r="5"/><circle cx="570" cy="110" r="5"/><circle cx="632" cy="110" r="5"/><circle cx="735" cy="110" r="5"/><circle cx="920" cy="110" r="5"/></g>
    <line x1="460" y1="74" x2="460" y2="121" class="cut"/><line x1="620" y1="74" x2="620" y2="121" class="cut"/><line x1="780" y1="74" x2="780" y2="121" class="cut"/>
    <text x="30" y="114" class="formula">w = (x<tspan baseline-shift="sub" font-size="12">max</tspan> - x<tspan baseline-shift="sub" font-size="12">min</tspan>) / k</text>
  </g>

  <g transform="translate(70 285)">
    <rect class="panel" width="1040" height="145"/>
    <text x="30" y="36" class="label">Quantils</text>
    <text x="30" y="62" class="small">cada classe conté aproximadament el mateix nombre d'observacions</text>
    <rect x="300" y="82" width="75" height="28" class="range1"/><rect x="375" y="82" width="155" height="28" class="range2"/><rect x="530" y="82" width="205" height="28" class="range3"/><rect x="735" y="82" width="205" height="28" class="range4"/>
    <line x1="300" y1="110" x2="940" y2="110" class="axis"/>
    <g class="dot"><circle cx="310" cy="110" r="5"/><circle cx="334" cy="110" r="5"/><circle cx="352" cy="110" r="5"/><circle cx="375" cy="110" r="5"/><circle cx="405" cy="110" r="5"/><circle cx="430" cy="110" r="5"/><circle cx="476" cy="110" r="5"/><circle cx="518" cy="110" r="5"/><circle cx="570" cy="110" r="5"/><circle cx="632" cy="110" r="5"/><circle cx="735" cy="110" r="5"/><circle cx="920" cy="110" r="5"/></g>
    <line x1="375" y1="74" x2="375" y2="121" class="cut"/><line x1="530" y1="74" x2="530" y2="121" class="cut"/><line x1="735" y1="74" x2="735" y2="121" class="cut"/>
    <text x="30" y="114" class="formula">p<tspan baseline-shift="sub" font-size="12">j</tspan> = j / k</text>
  </g>

  <g transform="translate(70 455)">
    <rect class="panel" width="1040" height="145"/>
    <text x="30" y="36" class="label">Intervals arrodonits</text>
    <text x="30" y="62" class="small">els talls busquen números fàcils de llegir a la llegenda</text>
    <rect x="280" y="82" width="120" height="28" class="range1"/><rect x="400" y="82" width="160" height="28" class="range2"/><rect x="560" y="82" width="160" height="28" class="range3"/><rect x="720" y="82" width="160" height="28" class="range4"/><rect x="880" y="82" width="80" height="28" class="range5"/>
    <line x1="280" y1="110" x2="960" y2="110" class="axis"/>
    <g class="dot"><circle cx="310" cy="110" r="5"/><circle cx="334" cy="110" r="5"/><circle cx="352" cy="110" r="5"/><circle cx="375" cy="110" r="5"/><circle cx="405" cy="110" r="5"/><circle cx="430" cy="110" r="5"/><circle cx="476" cy="110" r="5"/><circle cx="518" cy="110" r="5"/><circle cx="570" cy="110" r="5"/><circle cx="632" cy="110" r="5"/><circle cx="735" cy="110" r="5"/><circle cx="920" cy="110" r="5"/></g>
    <line x1="400" y1="74" x2="400" y2="121" class="cut"/><line x1="560" y1="74" x2="560" y2="121" class="cut"/><line x1="720" y1="74" x2="720" y2="121" class="cut"/><line x1="880" y1="74" x2="880" y2="121" class="cut"/>
    <text x="30" y="114" class="formula">c<tspan baseline-shift="sub" font-size="12">j</tspan> = a + jb</text>
  </g>

  <g transform="translate(70 625)">
    <rect class="panel" width="1040" height="145"/>
    <text x="30" y="36" class="label">Desviacions estàndard</text>
    <text x="30" y="62" class="small">les classes mesuren distància respecte de la mitjana</text>
    <rect x="300" y="82" width="130" height="28" class="range1"/><rect x="430" y="82" width="140" height="28" class="range2"/><rect x="570" y="82" width="130" height="28" class="range3"/><rect x="700" y="82" width="130" height="28" class="range4"/><rect x="830" y="82" width="110" height="28" class="range5"/>
    <line x1="300" y1="110" x2="940" y2="110" class="axis"/>
    <g class="dot"><circle cx="310" cy="110" r="5"/><circle cx="334" cy="110" r="5"/><circle cx="352" cy="110" r="5"/><circle cx="375" cy="110" r="5"/><circle cx="405" cy="110" r="5"/><circle cx="430" cy="110" r="5"/><circle cx="476" cy="110" r="5"/><circle cx="518" cy="110" r="5"/><circle cx="570" cy="110" r="5"/><circle cx="632" cy="110" r="5"/><circle cx="735" cy="110" r="5"/><circle cx="920" cy="110" r="5"/></g>
    <line x1="570" y1="74" x2="570" y2="121" class="center"/><line x1="430" y1="74" x2="430" y2="121" class="cut"/><line x1="700" y1="74" x2="700" y2="121" class="cut"/><line x1="830" y1="74" x2="830" y2="121" class="cut"/>
    <text x="30" y="114" class="formula">c<tspan baseline-shift="sub" font-size="12">j</tspan> = x̄ + js</text>
  </g>

  <g transform="translate(70 795)">
    <rect class="panel" width="1040" height="145"/>
    <text x="30" y="36" class="label">Trencaments naturals de Jenks</text>
    <text x="30" y="62" class="small">els talls busquen grups interns compactes i separacions externes</text>
    <rect x="300" y="82" width="130" height="28" class="range1"/><rect x="430" y="82" width="140" height="28" class="range2"/><rect x="570" y="82" width="165" height="28" class="range3"/><rect x="735" y="82" width="205" height="28" class="range4"/>
    <line x1="300" y1="110" x2="940" y2="110" class="axis"/>
    <g class="dot"><circle cx="310" cy="110" r="5"/><circle cx="334" cy="110" r="5"/><circle cx="352" cy="110" r="5"/><circle cx="375" cy="110" r="5"/><circle cx="405" cy="110" r="5"/><circle cx="430" cy="110" r="5"/><circle cx="476" cy="110" r="5"/><circle cx="518" cy="110" r="5"/><circle cx="570" cy="110" r="5"/><circle cx="632" cy="110" r="5"/><circle cx="735" cy="110" r="5"/><circle cx="920" cy="110" r="5"/></g>
    <line x1="430" y1="74" x2="430" y2="121" class="cut"/><line x1="570" y1="74" x2="570" y2="121" class="cut"/><line x1="735" y1="74" x2="735" y2="121" class="cut"/>
    <text x="30" y="114" class="formula">min Σ<tspan baseline-shift="sub" font-size="12">c</tspan> Σ<tspan baseline-shift="sub" font-size="12">i∈c</tspan> (x<tspan baseline-shift="sub" font-size="12">i</tspan> - x̄<tspan baseline-shift="sub" font-size="12">c</tspan>)²</text>
  </g>

  <text x="590" y="965" text-anchor="middle" class="small">Figura d'elaboració pròpia, 16 d'agost de 2026. Distribució sintètica amb dotze observacions; els mètodes il·lustren criteris, no una recomanació automàtica.</text>
</svg>
