<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">Tres maneres de tallar una distribucio en classes</title>
  <desc id="desc">Comparació entre intervals iguals, quantils i trencaments naturals sobre una mateixa distribució de valors municipals.</desc>
  <defs>
    <style>
      .bg { fill: #fffdf8; }
      .panel { fill: #ffffff; stroke: #d5dde2; stroke-width: 1.6; rx: 18; }
      .title { font: 700 31px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .subtitle { font: 16px Arial, 'Liberation Sans', sans-serif; fill: #52616b; }
      .label { font: 700 20px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .small { font: 15px Arial, 'Liberation Sans', sans-serif; fill: #52616b; }
      .mono { font: 700 15px 'Liberation Mono', Consolas, monospace; fill: #17202a; }
      .axis { stroke: #87949a; stroke-width: 2; }
      .cut { stroke: #d0523c; stroke-width: 3; stroke-dasharray: 7 6; }
      .dot { fill: #16697a; opacity: .85; }
      .range1 { fill: #e9f2f7; }
      .range2 { fill: #cfe3ea; }
      .range3 { fill: #8fbdd0; }
      .range4 { fill: #16697a; opacity: .82; }
    </style>
  </defs>
  <rect class="bg" width="1180" height="760"/>
  <text x="590" y="48" text-anchor="middle" class="title">Classificar es decidir que es considera semblant</text>
  <text x="590" y="78" text-anchor="middle" class="subtitle">Els mateixos valors produeixen lectures diferents quan canvien els punts de tall.</text>

  <g transform="translate(70 125)">
    <rect class="panel" width="1040" height="155"/>
    <text x="30" y="38" class="label">Intervals iguals</text>
    <text x="30" y="64" class="small">tots els rangs numerics tenen la mateixa amplitud</text>
    <rect x="300" y="88" width="160" height="28" class="range1"/><rect x="460" y="88" width="160" height="28" class="range2"/><rect x="620" y="88" width="160" height="28" class="range3"/><rect x="780" y="88" width="160" height="28" class="range4"/>
    <line x1="300" y1="116" x2="940" y2="116" class="axis"/>
    <g class="dot"><circle cx="310" cy="116" r="5"/><circle cx="334" cy="116" r="5"/><circle cx="352" cy="116" r="5"/><circle cx="375" cy="116" r="5"/><circle cx="405" cy="116" r="5"/><circle cx="430" cy="116" r="5"/><circle cx="476" cy="116" r="5"/><circle cx="518" cy="116" r="5"/><circle cx="570" cy="116" r="5"/><circle cx="632" cy="116" r="5"/><circle cx="735" cy="116" r="5"/><circle cx="920" cy="116" r="5"/></g>
    <line x1="460" y1="78" x2="460" y2="127" class="cut"/><line x1="620" y1="78" x2="620" y2="127" class="cut"/><line x1="780" y1="78" x2="780" y2="127" class="cut"/>
    <text x="30" y="118" class="mono">w = (max - min) / k</text>
  </g>

  <g transform="translate(70 315)">
    <rect class="panel" width="1040" height="155"/>
    <text x="30" y="38" class="label">Quantils</text>
    <text x="30" y="64" class="small">cada classe conte aproximadament el mateix nombre d'observacions</text>
    <rect x="300" y="88" width="75" height="28" class="range1"/><rect x="375" y="88" width="155" height="28" class="range2"/><rect x="530" y="88" width="205" height="28" class="range3"/><rect x="735" y="88" width="205" height="28" class="range4"/>
    <line x1="300" y1="116" x2="940" y2="116" class="axis"/>
    <g class="dot"><circle cx="310" cy="116" r="5"/><circle cx="334" cy="116" r="5"/><circle cx="352" cy="116" r="5"/><circle cx="375" cy="116" r="5"/><circle cx="405" cy="116" r="5"/><circle cx="430" cy="116" r="5"/><circle cx="476" cy="116" r="5"/><circle cx="518" cy="116" r="5"/><circle cx="570" cy="116" r="5"/><circle cx="632" cy="116" r="5"/><circle cx="735" cy="116" r="5"/><circle cx="920" cy="116" r="5"/></g>
    <line x1="375" y1="78" x2="375" y2="127" class="cut"/><line x1="530" y1="78" x2="530" y2="127" class="cut"/><line x1="735" y1="78" x2="735" y2="127" class="cut"/>
    <text x="30" y="118" class="mono">p_j = j / k</text>
  </g>

  <g transform="translate(70 505)">
    <rect class="panel" width="1040" height="155"/>
    <text x="30" y="38" class="label">Trencaments naturals</text>
    <text x="30" y="64" class="small">els talls busquen grups interns compactes i separacions externes</text>
    <rect x="300" y="88" width="130" height="28" class="range1"/><rect x="430" y="88" width="140" height="28" class="range2"/><rect x="570" y="88" width="165" height="28" class="range3"/><rect x="735" y="88" width="205" height="28" class="range4"/>
    <line x1="300" y1="116" x2="940" y2="116" class="axis"/>
    <g class="dot"><circle cx="310" cy="116" r="5"/><circle cx="334" cy="116" r="5"/><circle cx="352" cy="116" r="5"/><circle cx="375" cy="116" r="5"/><circle cx="405" cy="116" r="5"/><circle cx="430" cy="116" r="5"/><circle cx="476" cy="116" r="5"/><circle cx="518" cy="116" r="5"/><circle cx="570" cy="116" r="5"/><circle cx="632" cy="116" r="5"/><circle cx="735" cy="116" r="5"/><circle cx="920" cy="116" r="5"/></g>
    <line x1="430" y1="78" x2="430" y2="127" class="cut"/><line x1="570" y1="78" x2="570" y2="127" class="cut"/><line x1="735" y1="78" x2="735" y2="127" class="cut"/>
    <text x="30" y="118" class="mono">min sum (x_i - mean_c)^2</text>
  </g>

  <text x="590" y="724" text-anchor="middle" class="small">Figura d'elaboracio propia, 14 d'agost de 2026. Distribucio sintetica amb dotze observacions; els metodes il·lustren criteris, no una recomanacio automatica.</text>
</svg>
