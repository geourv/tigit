<svg xmlns="http://www.w3.org/2000/svg" width="1075" height="555" viewBox="53 118 1075 555" role="img" aria-labelledby="title desc">
  <title id="title">Famílies principals de mapes tematics</title>
  <desc id="desc">Sis esquemes de mapes tematics: coropleta, simbols proporcionals, punts, fluxos, isolinies i cartodiagrama.</desc>
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #d5dde2; stroke-width: 1.6; }
      .label { font: 700 18px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .small { font: 14px Arial, 'Liberation Sans', sans-serif; fill: #52616b; }
      .line { fill: none; stroke: #365b6d; stroke-width: 2; }
      .border { fill: none; stroke: #ffffff; stroke-width: 2; }
      .flow { fill: none; stroke: #d0523c; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d0523c"/>
    </marker>
  </defs>
  <g transform="translate(55 120)">
    <rect class="card" width="340" height="250"/>
    <text x="24" y="38" class="label">Coropleta</text>
    <text x="24" y="62" class="small">percentatges, ratios o densitats</text>
    <path d="M72,112 L145,88 L211,117 L200,185 L123,200 L60,163 Z" fill="#e6f0f3" stroke="#365b6d" stroke-width="2"/>
    <path d="M72,112 L123,140 L60,163" fill="#cfe3ea" class="border"/>
    <path d="M72,112 L145,88 L153,143 L123,140 Z" fill="#8fbdd0" class="border"/>
    <path d="M153,143 L211,117 L200,185 L164,171 Z" fill="#16697a" class="border"/>
    <path d="M123,140 L153,143 L164,171 L123,200 L60,163 Z" fill="#5b9eb7" class="border"/>
  </g>

  <g transform="translate(420 120)">
    <rect class="card" width="340" height="250"/>
    <text x="24" y="38" class="label">Simbols proporcionals</text>
    <text x="24" y="62" class="small">quantitats absolutes localitzades</text>
    <path d="M70,112 L145,90 L218,115 L220,184 L128,205 L58,164 Z" fill="#edf2f3" stroke="#365b6d" stroke-width="2"/>
    <circle cx="107" cy="151" r="16" fill="#d0523c" opacity=".8"/>
    <circle cx="174" cy="138" r="31" fill="#d0523c" opacity=".75"/>
    <circle cx="148" cy="186" r="10" fill="#d0523c" opacity=".85"/>
  </g>

  <g transform="translate(785 120)">
    <rect class="card" width="340" height="250"/>
    <text x="24" y="38" class="label">Punts</text>
    <text x="24" y="62" class="small">cada punt representa una quantitat</text>
    <path d="M70,112 L145,90 L218,115 L220,184 L128,205 L58,164 Z" fill="#edf2f3" stroke="#365b6d" stroke-width="2"/>
    <g fill="#16697a"><circle cx="93" cy="150" r="4"/><circle cx="111" cy="139" r="4"/><circle cx="126" cy="164" r="4"/><circle cx="152" cy="143" r="4"/><circle cx="177" cy="131" r="4"/><circle cx="189" cy="158" r="4"/><circle cx="145" cy="181" r="4"/><circle cx="113" cy="179" r="4"/><circle cx="166" cy="174" r="4"/></g>
  </g>

  <g transform="translate(55 420)">
    <rect class="card" width="340" height="250"/>
    <text x="24" y="38" class="label">Fluxos</text>
    <text x="24" y="62" class="small">moviment, direccio i volum</text>
    <circle cx="82" cy="160" r="10" fill="#16697a"/><circle cx="236" cy="105" r="10" fill="#16697a"/><circle cx="210" cy="190" r="10" fill="#16697a"/>
    <path d="M90,157 C135,112 176,103 226,106" class="flow" stroke-width="8"/>
    <path d="M91,166 C142,188 168,193 200,190" class="flow" stroke-width="4"/>
  </g>

  <g transform="translate(420 420)">
    <rect class="card" width="340" height="250"/>
    <text x="24" y="38" class="label">Isolinies</text>
    <text x="24" y="62" class="small">fenomens continus o interpolats</text>
    <path d="M55,178 C98,135 136,154 168,115 C202,73 252,94 284,62" class="line"/>
    <path d="M52,210 C98,171 139,186 178,145 C218,103 268,124 300,92" class="line"/>
    <path d="M47,132 C95,98 134,110 168,75 C205,36 245,52 282,25" class="line"/>
    <text x="242" y="80" class="small">20</text><text x="258" y="112" class="small">30</text><text x="280" y="143" class="small">40</text>
  </g>

  <g transform="translate(785 420)">
    <rect class="card" width="340" height="250"/>
    <text x="24" y="38" class="label">Cartodiagrama</text>
    <text x="24" y="62" class="small">grafic localitzat sobre el mapa</text>
    <path d="M70,112 L145,90 L218,115 L220,184 L128,205 L58,164 Z" fill="#edf2f3" stroke="#365b6d" stroke-width="2"/>
    <rect x="90" y="156" width="16" height="36" fill="#16697a"/><rect x="108" y="134" width="16" height="58" fill="#f2b544"/><rect x="126" y="168" width="16" height="24" fill="#d0523c"/>
    <rect x="170" y="127" width="16" height="65" fill="#16697a"/><rect x="188" y="146" width="16" height="46" fill="#f2b544"/><rect x="206" y="176" width="16" height="16" fill="#d0523c"/>
  </g>
</svg>
