<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Coropleta esquemàtica amb intervals iguals</title>
  <desc id="desc">Mapa municipal esquemàtic classificat amb intervals iguals i llegenda de quatre classes amb la mateixa amplitud.</desc>
  <defs>
    <style>
      .bg { fill: #fffdf8; }
      .land { stroke: #ffffff; stroke-width: 3; }
      .coast { fill: none; stroke: #7aa6b8; stroke-width: 5; stroke-linecap: round; opacity: .75; }
      .t { font: 700 24px Arial, sans-serif; fill: #17202a; }
      .s { font: 15px Arial, sans-serif; fill: #52616b; }
      .l { font: 14px Arial, sans-serif; fill: #17202a; }
      .c1 { fill: #edf8fb; } .c2 { fill: #b2e2e2; } .c3 { fill: #66c2a4; } .c4 { fill: #238b45; }
    </style>
  </defs>
  <rect class="bg" width="760" height="520"/>
  <text class="t" x="40" y="48">Intervals iguals</text>
  <text class="s" x="40" y="74">Mateixa amplitud numèrica a cada classe</text>
  <g transform="translate(54 106)">
