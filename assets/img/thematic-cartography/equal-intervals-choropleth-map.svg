    <path class="land c3" d="M132 318 L250 312 L420 334 L390 430 L230 438 L92 390 Z"/>
    <path class="land c3" d="M430 122 L540 92 L638 158 L590 254 L500 186 Z"/>
    <path class="land c4" d="M420 334 L540 344 L602 430 L474 462 L390 430 Z"/>
  </g>
  <g transform="translate(42 426)">
