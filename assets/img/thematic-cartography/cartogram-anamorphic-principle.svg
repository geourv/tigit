<svg xmlns="http://www.w3.org/2000/svg" width="1065" height="384" viewBox="58 128 1065 384" role="img" aria-labelledby="title desc">
  <title id="title">Principi dels cartogrames i mapes anamorfics</title>
  <desc id="desc">Comparació entre un mapa territorial convencional, un cartograma contigu esquematic i un cartograma de cercles en què la mida respon a una magnitud.</desc>
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d5dde2; stroke-width: 1.6; }
      .label { font: 700 20px Arial, 'Liberation Sans', sans-serif; fill: #17202a; }
      .small { font: 15px Arial, 'Liberation Sans', sans-serif; fill: #52616b; }
      .border { stroke: #ffffff; stroke-width: 3; }
      .outline { fill: none; stroke: #365b6d; stroke-width: 2.5; }
    </style>
  </defs>
  <g transform="translate(60 130)">
    <rect class="panel" width="330" height="380"/>
    <text x="24" y="42" class="label">Mapa convencional</text>
    <text x="24" y="68" class="small">forma, veïnatge i superficie territorial</text>
    <path d="M80,122 L160,88 L250,118 L268,210 L222,310 L122,330 L62,238 Z" fill="#edf2f3" class="outline"/>
    <path d="M80,122 L138,170 L62,238 Z" fill="#cfe3ea" class="border"/>
    <path d="M80,122 L160,88 L178,164 L138,170 Z" fill="#8fbdd0" class="border"/>
    <path d="M178,164 L250,118 L268,210 L210,218 Z" fill="#16697a" class="border"/>
    <path d="M138,170 L178,164 L210,218 L222,310 L122,330 L62,238 Z" fill="#5b9eb7" class="border"/>
  </g>

  <g transform="translate(425 130)">
    <rect class="panel" width="330" height="380"/>
    <text x="24" y="42" class="label">Cartograma contigu</text>
    <text x="24" y="68" class="small">deforma peces i intenta conservar veïnatge</text>
    <path d="M72,144 L146,94 L252,116 L292,236 L222,342 L108,318 L48,236 Z" fill="#edf2f3" class="outline"/>
    <path d="M72,144 L132,192 L48,236 Z" fill="#cfe3ea" class="border"/>
    <path d="M72,144 L146,94 L184,178 L132,192 Z" fill="#8fbdd0" class="border"/>
    <path d="M184,178 L252,116 L292,236 L218,260 Z" fill="#16697a" class="border"/>
    <path d="M132,192 L184,178 L218,260 L222,342 L108,318 L48,236 Z" fill="#5b9eb7" class="border"/>
  </g>

  <g transform="translate(790 130)">
    <rect class="panel" width="330" height="380"/>
    <text x="24" y="42" class="label">Cartograma de cercles</text>
    <text x="24" y="68" class="small">area dels cercles proporcional al valor</text>
    <circle cx="110" cy="224" r="42" fill="#cfe3ea" stroke="#ffffff" stroke-width="4"/>
    <circle cx="185" cy="170" r="70" fill="#16697a" opacity=".85" stroke="#ffffff" stroke-width="4"/>
    <circle cx="210" cy="276" r="30" fill="#8fbdd0" stroke="#ffffff" stroke-width="4"/>
    <circle cx="135" cy="310" r="54" fill="#5b9eb7" opacity=".9" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
