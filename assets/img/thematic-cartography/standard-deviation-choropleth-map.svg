<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Coropleta esquemàtica amb desviacions estàndard</title>
  <desc id="desc">Mapa municipal esquemàtic classificat per desviacions estàndard al voltant de la mitjana.</desc>
  <defs>
    <style>
      .bg { fill: #fffdf8; }
      .land { stroke: #ffffff; stroke-width: 3; }
      .coast { fill: none; stroke: #7aa6b8; stroke-width: 5; stroke-linecap: round; opacity: .75; }
      .t { font: 700 24px Arial, sans-serif; fill: #17202a; }
      .s { font: 15px Arial, sans-serif; fill: #52616b; }
      .l { font: 14px Arial, sans-serif; fill: #17202a; }
      .c1 { fill: #d8daeb; } .c2 { fill: #f1eef6; } .c3 { fill: #f7f7f7; } .c4 { fill: #fee0b6; } .c5 { fill: #e08214; }
    </style>
  </defs>
  <rect class="bg" width="760" height="520"/>
  <text class="t" x="40" y="48">Desviacions estàndard</text>
  <text class="s" x="40" y="74">Classes per sota i per sobre de la mitjana</text>
  <g transform="translate(54 106)">
    <path class="coast" d="M420 0 C462 58 452 118 496 176 C544 238 510 326 570 386"/>
    <path class="land c2" d="M60 44 L176 18 L232 92 L180 176 L72 164 Z"/>
    <path class="land c3" d="M232 92 L346 58 L430 122 L392 220 L282 206 L180 176 Z"/>
    <path class="land c1" d="M72 164 L180 176 L282 206 L250 312 L132 318 L42 250 Z"/>
    <path class="land c4" d="M392 220 L500 186 L590 254 L540 344 L420 334 L250 312 L282 206 Z"/>
    <path class="land c3" d="M132 318 L250 312 L420 334 L390 430 L230 438 L92 390 Z"/>
    <path class="land c4" d="M430 122 L540 92 L638 158 L590 254 L500 186 Z"/>
    <path class="land c5" d="M420 334 L540 344 L602 430 L474 462 L390 430 Z"/>
  </g>
  <g transform="translate(42 426)">
    <text class="l" x="0" y="0">Distància respecte de la mitjana</text>
    <rect class="c1" x="0" y="18" width="34" height="18"/><text class="l" x="44" y="32">&lt; -1s</text>
    <rect class="c2" x="112" y="18" width="34" height="18"/><text class="l" x="156" y="32">-1s a -0,5s</text>
    <rect class="c3" x="260" y="18" width="34" height="18"/><text class="l" x="304" y="32">entorn de x̄</text>
    <rect class="c4" x="410" y="18" width="34" height="18"/><text class="l" x="454" y="32">+0,5s a +1s</text>
    <rect class="c5" x="580" y="18" width="34" height="18"/><text class="l" x="624" y="32">&gt; +1s</text>
  </g>
</svg>
